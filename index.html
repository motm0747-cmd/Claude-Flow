    const s=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${colors[i]}" stroke-width="20"
      stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;
    off+=len; return s;
  }).join('');
  el.innerHTML=`
    <div class="row" style="margin-bottom:8px"><div style="font-weight:800;font-size:.92rem">💰 수입원 분석</div>
      <span class="tiny">최근 ${b.months}개월</span></div>
    <div style="display:flex;gap:14px;align-items:center">
      <svg width="140" height="140" viewBox="0 0 140 140" style="flex-shrink:0">${arcs}
        <text x="70" y="66" text-anchor="middle" font-size="11" fill="var(--sub)" font-weight="700">월평균</text>
        <text x="70" y="82" text-anchor="middle" font-size="14" fill="var(--ink)" font-weight="800">${fmtK(b.avg)}원</text></svg>
      <div style="flex:1;min-width:0">${b.byCat.slice(0,5).map(([c,v],i)=>
        `<div class="row" style="padding:3px 0"><span style="font-size:.8rem"><span class="legend-dot" style="background:${colors[i]}"></span>${CAT_EMO[c]||''} ${c}</span>
        <span class="num tiny" style="font-weight:700">${Math.round(v/b.total*100)}%</span></div>`).join('')}</div>
    </div>
    <div class="stat3" style="margin-top:12px">
      <div class="cell"><div class="k">총 수입</div><div class="v num">${fmtK(b.total)}원</div></div>

function scoreHistory(n=6){
  S.scores=S.scores||{};
  const out=[], now=new Date();
  for(let i=n-1;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const ym=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
    const saved=S.scores[ym];
    const live=(ym===thisYM())?healthScore(ym):null;
    const has=monthTx(ym).length>0;
    out.push({ym,score:saved?saved.total:(live?live.total:null),has});
  }
  return out;
}

/* ═════════ v6-4: 소비 성향 프로파일 ═════════ */
function spendProfile(months){
  const M=months||S.settings.profM||3;
  const now=new Date(); let exp=[], fixedSum=0, varSum=0, weekend=0, weekday=0, late=0;
  for(let i=0;i<M;i++){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const ym=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
    monthTx(ym).filter(t=>t.type==='expense').forEach(t=>{
      exp.push(t);
      if(t.fixedId)fixedSum+=t.amount; else varSum+=t.amount;
      const dow=new Date(t.date).getDay();
      if(dow===0||dow===5||dow===6)weekend+=t.amount; else weekday+=t.amount;
    });
  }
  if(exp.length<3)return null;
  const total=fixedSum+varSum;
  // 위시리스트 자제율
  const decided=S.wish.filter(w=>w.status!=='open');
  const skipRate=decided.length?decided.filter(w=>w.status==='skipped').length/decided.length:null;
  // 소액 다건 vs 고액 소수
  const avg=total/exp.length;
  const bigCount=exp.filter(t=>t.amount>=avg*3).length;
  const bigShare=exp.filter(t=>t.amount>=avg*3).reduce((s,t)=>s+t.amount,0)/total;
  // 예산 준수율
  const budKeys=Object.keys(S.budgets||{}).filter(k=>k<thisYM());
  const kept=budKeys.filter(k=>totals(k).exp<=S.budgets[k].total).length;
  const budRate=budKeys.length?kept/budKeys.length:null;
  const traits=[];
  traits.push(fixedSum/total>=0.4
    ?{emo:'🔁',t:'고정비 중심형',d:`지출의 ${Math.round(fixedSum/total*100)}%가 고정비예요. 구독·통신비를 한 번 정리하면 효과가 커요.`}
    :{emo:'🎚️',t:'변동비 중심형',d:`지출의 ${Math.round(varSum/total*100)}%가 변동비라 마음먹으면 조절 여지가 커요.`});
  traits.push(weekend/(weekend+weekday)>=0.5
    ?{emo:'🌆',t:'주말 집중형',d:`지출의 ${Math.round(weekend/(weekend+weekday)*100)}%가 금~일에 몰려요. 주말 예산을 따로 잡아보세요.`}
    :{emo:'📅',t:'평일 분산형',d:'지출이 요일에 고르게 퍼져 있어요. 일상 소비가 주를 이뤄요.'});
  traits.push(bigShare>=0.5
    ?{emo:'💎',t:'큰 지출형',d:`상위 ${bigCount}건이 전체의 ${Math.round(bigShare*100)}%예요. What-if로 큰 결제를 미리 점검하면 좋아요.`}
    :{emo:'🐜',t:'소액 다건형',d:'작은 지출이 쌓이는 유형이에요. 카페·편의점 같은 반복 지출을 줄이면 체감이 커요.'});
  if(skipRate!==null)traits.push(skipRate>=0.5
    ?{emo:'🧘',t:'자제력 좋음',d:`위시리스트에 담은 것 중 ${Math.round(skipRate*100)}%를 참았어요. 쿨다운이 잘 통하고 있어요.`}
    :{emo:'🛍️',t:'구매 결심형',d:`담은 것 중 ${Math.round((1-skipRate)*100)}%를 실제로 샀어요. 쿨다운을 더 길게 잡아보는 것도 방법이에요.`});
  if(budRate!==null)traits.push(budRate>=0.6
    ?{emo:'🎯',t:'계획 준수형',d:`예산을 세운 달 중 ${Math.round(budRate*100)}%를 지켰어요.`}
    :{emo:'🌀',t:'계획 이탈형',d:'예산을 자주 넘겨요. 목표를 조금 낮춰 잡으면 성공 경험이 쌓여요.'});
  return{traits,total,count:exp.length,months:M};
}
function setProfM(m){S.settings.profM=m;save();renderProfile()}
function renderProfile(){
  const el=$('profile-card'); if(!el)return;
  const M=S.settings.profM||3;

/* ═════════ v7: 카드 피킹률 + 개선 코칭 ═════════ */
// 국내 카드 실질 혜택률 벤치마크 (일반적 수준)
const PICK_TIERS=[
  {min:2.0,label:'최상위',color:'var(--green)',desc:'상위권 카드에서도 보기 드문 수준이에요'},
  {min:1.2,label:'우수',color:'var(--green)',desc:'잘 쓰고 있어요. 일반적으로 1~2%면 좋은 편이에요'},
  {min:0.7,label:'양호',color:'var(--gold)',desc:'평균 수준이에요. 조금만 조정하면 더 올릴 수 있어요'},
  {min:0.3,label:'낮음',color:'var(--terra)',desc:'혜택을 거의 못 받고 있어요. 아래 제안을 확인해보세요'},
  {min:-99,label:'거의 없음',color:'var(--terra-deep)',desc:'이 카드로는 혜택이 나오지 않고 있어요'}
];
const pickTier=r=>PICK_TIERS.find(t=>r>=t.min);
function pickRate(card,ym){
  const spend=cardMonthSpend(card.id,ym);
  const ests=perkEstimates(card,ym);
  const got=ests.filter(e=>e.active).reduce((s,e)=>s+e.est,0);
  const rate=spend>0?got/spend*100:0;
  const fee=card.annualFee||0;
  // 연회비 반영 실질: (연간혜택 − 연회비) / 연간사용액
  const netRate=spend>0?((got*12-fee)/(spend*12))*100:0;
  return{spend,got,rate,fee,netRate,ests};
}
/* 개선 제안 생성 — 실제 데이터 기반 */
function pickAdvice(card,ym){
  const p=pickRate(card,ym), out=[];
  const tiers=card.tiers||[], prev=prevYM(ym);
  const perfPrev=perfSpend(card,prev), perfNow=perfSpend(card,ym);
  // ① 실적 미달로 혜택 잠김
  const exLeft=tierExemptLeft(card,ym);
  if(tiers.length&&exLeft){
    out.push({icon:'🎁',t:`발급 첫 달 — 전월 실적이 면제돼요`,
      d:`이번 달은 실적과 상관없이 혜택이 전부 열려 있어요.${exLeft>1?` (${exLeft}개월 남음)`:''} 다음 달부터는 <b>${fmtK(tiers[0])}원</b> 실적이 필요하니, 이번 달에 <b>${fmtK(Math.max(0,tiers[0]-perfNow))}원</b>을 더 쓰면 이어서 열려요.`});
  }else if(tiers.length){
    const t=achievedTierBy(perfPrev,tiers);
    if(t===0){
      const need=tiers[0]-perfPrev;
      out.push({icon:'🔒',t:'전월 실적 미달로 혜택이 잠겼어요',
        d:`지난달 ${fmtK(perfPrev)}원 사용 · ${fmtK(tiers[0])}원 필요. 이번 달은 <b>${fmtK(Math.max(0,tiers[0]-perfNow))}원</b> 더 쓰면 다음 달 혜택이 열려요.`});
    }else if(t<tiers.length){
      const need=tiers[t]-perfNow;
      if(need>0)out.push({icon:'⬆️',t:`${t+1}구간까지 ${fmtK(need)}원 남았어요`,
        d:`이번 달 인정 실적 ${fmtK(perfNow)}원. 여기까지 채우면 다음 달 혜택이 한 단계 올라가요.`});
    }
  }
  // ② 한도를 다 못 쓴 혜택 → 그 카테고리 지출을 이 카드로
  p.ests.filter(e=>e.active&&e.p.capM>0&&e.est<e.p.capM).forEach(e=>{
    const room=e.p.capM-e.est;
    if(room<300)return;
    const cat=e.p.cat;
    // 다른 결제수단으로 나간 같은 카테고리 지출 찾기
    const elsewhere=monthTx(ym).filter(t=>t.type==='expense'&&t.cat===cat&&!(t.payKind==='card'&&t.payId===card.id))
      .reduce((s,t)=>s+t.amount,0);
    const gain=e.p.kind==='percent'?Math.min(room,Math.round(elsewhere*e.p.value/100)):0;
    out.push({icon:'🎯',t:`${cat} 혜택 한도가 ${fmtK(room)}원 남았어요`,
      d:elsewhere>0
        ? `이번 달 ${cat}에 다른 수단으로 <b>${fmtK(elsewhere)}원</b>을 썼어요. 이걸 이 카드로 돌렸다면 약 <b class="pos">+${fmtK(gain)}원</b>을 더 받았을 거예요.`
        : `${cat} 지출을 이 카드로 몰면 월 최대 ${fmtK(e.p.capM)}원까지 받을 수 있어요.`});
  });
  // ③ 한도 소진 → 초과분은 다른 카드로
  p.ests.filter(e=>e.active&&e.p.capM>0&&e.est>=e.p.capM).forEach(e=>{
    out.push({icon:'🈵',t:`${e.p.cat} 혜택 한도(${fmtK(e.p.capM)}원)를 다 채웠어요`,
      d:`이 카테고리는 이제 더 써도 혜택이 안 늘어요. 남은 ${e.p.cat} 지출은 다른 카드로 분산하는 게 이득이에요.`});
  });
  // ④ 혜택이 없는 카테고리에 큰 지출
  const covered=new Set(p.ests.filter(e=>e.active).map(e=>e.p.cat));
  if(!covered.has('전체')){
    const byCat={};
    monthTx(ym).filter(t=>t.type==='expense'&&t.payKind==='card'&&t.payId===card.id)
      .forEach(t=>byCat[t.cat]=(byCat[t.cat]||0)+t.amount);
    const top=Object.entries(byCat).filter(([c])=>!covered.has(c)).sort((a,b)=>b[1]-a[1])[0];
    if(top&&top[1]>=50000)out.push({icon:'💤',t:`${top[0]}에 ${fmtK(top[1])}원을 썼지만 혜택이 없어요`,
      d:`이 카드는 ${top[0]}에 혜택이 없어요. ${top[0]} 혜택이 있는 다른 카드가 있다면 그쪽으로 옮겨보세요.`});
  }
  // ⑤ 연회비 손익
  if(p.fee>0){
    const yearGot=p.got*12, be=Math.round(p.fee/12);
    out.push({icon:p.got*12>=p.fee?'✅':'⚠️',
      t:p.got*12>=p.fee?`연회비 ${fmtK(p.fee)}원 대비 이득이에요`:`연회비를 못 뽑고 있어요`,
      d:`현재 페이스로 연 <b>${fmtK(yearGot)}원</b> 혜택 · 연회비 ${fmtK(p.fee)}원. 본전을 넘으려면 월 <b>${fmtK(be)}원</b> 이상 받아야 해요.`});
  }
  // ⑥ 사용액이 거의 없음
  if(p.spend<30000)out.push({icon:'💤',t:'이번 달 사용액이 적어요',
    d:`${fmtK(p.spend)}원만 사용했어요. 피킹률은 사용액이 쌓여야 의미 있는 수치가 돼요.`});
  return out;
}

/* 청구 사이클: 이번 달 사용분 → 다음 달 결제일에 출금 */
function billOfMonth(card,ym){
  // ym월에 발생한 이 카드 지출의 해당 회차 금액 (정산 완료분 제외)
  let gross=0, items=[];
  S.tx.filter(t=>t.type==='expense'&&t.payKind==='card'&&t.payId===card.id).forEach(t=>{
    const n=t.months||1, start=ymOf(t.date);
    const k=monthDiff(start,ym);                 // 이 달이 몇 번째 회차인지
    if(k<0||k>=n)return;
    if((t.paidPortions||0)>k)return;             // 이미 정산된 회차
    const amt=portionAmt(t,k);
    gross+=amt; items.push({t,amt,k,n});
  });
  const disc=Math.min(gross,discOfAmount(card,ym,gross));
  return{gross,disc,net:gross-disc,items};
}
function nextYM(ym){const[y,m]=ym.split('-').map(Number);const d=new Date(y,m,1);return`${d.getFullYear()}-${pad(d.getMonth()+1)}`}

        <b class="num" style="color:var(--terra-deep)">${fmt(totalCreditPendingNet())}</b></div>
      <div class="tiny">청구할인이 반영된 실제 출금 예정액이에요. 순자산에서 부채로 차감되며, 결제 처리한 내역은 제외됩니다.</div>
      ${credits.map(c=>{const p=creditPendingNet(c),d=billedDiscount(c),r=installRemain(c);
        return p>0||r>0?`<div class="bill-row"><span>${esc(c.name)}</span>

    <div class="card tight"><div class="tiny">💡 신용카드는 <b>이번 달 쓴 돈이 다음 달 결제일</b>에 빠져나가요. 위 금액은 아직 결제 처리하지 않은 내역만 집계합니다.</div></div>`;

function renderCardDetail(){
  const el=$('cardview-detail');
  if(!S.cards.length){el.innerHTML=`<div class="card"><div class="empty">카드를 등록하면 카드별 사용 내역을<br>모아서 볼 수 있어요</div></div>`;return}
  if(!ctSel||!cardById(ctSel))ctSel=S.cards[0].id;
  const c=cardById(ctSel), ym=lstYM||thisYM();
  const txs=monthTx(ym).filter(t=>t.payKind==='card'&&t.payId===c.id);

async function resetAll(scope){
  const msg=scope==='cloud'
    ? '클라우드를 포함해 모든 기기의 데이터를 삭제할까요?\n되돌릴 수 없어요.'
    : '이 기기의 데이터를 삭제할까요?\n되돌릴 수 없어요.';
  if(!confirm(msg))return;
  try{
    if(scope==='cloud'){ toast('클라우드 초기화 중…'); await Sync.wipeCloud(); }
    else if(window.Sync&&Sync.configured&&Sync.configured()){ await Sync.disconnect(); }  // 다시 내려받지 않도록 연결 해제
  }catch(e){ toast('클라우드 초기화 실패 — '+(e.message||'')); return; }
  try{
    localStorage.removeItem(KEY);
    // 클라우드 초기화는 리비전을 그대로 둬야 다른 기기가 '초기화됨'으로 인식한다.
    // (지우면 카운터가 0으로 돌아가 다른 기기의 옛 데이터가 더 최신으로 오인됨)
    if(scope!=='cloud')localStorage.removeItem('claudeflow_sync_rev');
    localStorage.removeItem('claudeflow_conflict_backup');
  }catch(e){}
  location.reload();
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`claude-flow-${todayStr()}.json`;a.click();
}
function importData(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    const backup=JSON.parse(JSON.stringify(S)); // 현재 상태 스냅샷
    try{
      const d=JSON.parse(r.result);
      if(!d||typeof d!=='object'||Array.isArray(d))throw new Error('형식 오류');
      if(!Array.isArray(d.tx)||!Array.isArray(d.accounts))throw new Error('내역/계좌 데이터가 없어요');
      ['cards','fixed','invLogs','debts','wish','recon','goals'].forEach(k=>{
        if(d[k]!==undefined&&!Array.isArray(d[k]))throw new Error(k+' 형식 오류');
      });
      ['reports','budgets','briefs','scores','settings'].forEach(k=>{
        if(d[k]!==undefined&&(typeof d[k]!=='object'||Array.isArray(d[k])))throw new Error(k+' 형식 오류');
      });
      const staged=JSON.parse(JSON.stringify(d)); // 원본 분리
      const prev=S; S=staged; _discInvalidate();
      try{ migrate(); totalAssets(); }        // 마이그레이션·집계 시험 실행
      catch(err){ S=prev; _discInvalidate(); throw new Error('데이터 구조가 손상됐어요') }
      const n=S.tx.length, a=S.accounts.length;
      save(); closeModal(); renderAll();
      toast(`가져왔어요 · 내역 ${n}건 · 계좌 ${a}개`);
    }catch(e){
      S=backup; _discInvalidate(); migrate();   // 원상 복구 보장
      toast('가져오지 못했어요 — '+(e.message||'올바른 백업 파일이 아니에요'));
    }
  };
  r.readAsText(f);
}

function readCatInputs(){
  const list=catList(catKind).slice();
  list.forEach((c,i)=>{ const e=$('ct-e-'+i), n=$('ct-n-'+i);
    if(e&&n) list[i]=[ (e.value.trim()||'💸'), n.value.trim() ]; });
  return list.filter(c=>c[1]);
}
function writeCats(list){
  S.cats=S.cats||{}; S.cats[catKind]=list;
  if(!S.cats.exp)S.cats.exp=catList('exp'); if(!S.cats.inc)S.cats.inc=catList('inc');
}
function addCat(){
  const e=val('ct-new-e').trim()||'💸', n=val('ct-new-n').trim();
  if(!n)return toast('카테고리 이름을 입력해주세요');
  const list=readCatInputs();
  if(list.some(c=>c[1]===n))return toast('같은 이름이 이미 있어요');
  list.push([e,n]); writeCats(list); save(); renderCatModal(); toast('추가했어요');
}
function moveCat(i,d){
  const list=readCatInputs(), j=i+d;
  if(j<0||j>=list.length)return;
  [list[i],list[j]]=[list[j],list[i]]; writeCats(list); save(); renderCatModal();
}
function rmCat(i){
  const list=readCatInputs(), c=list[i]; if(!c)return;
  const n=S.tx.filter(t=>t.cat===c[1]).length;
  if(n)return toast(`'${c[1]}'는 내역 ${n}건에서 쓰이고 있어 삭제할 수 없어요`);
  list.splice(i,1); writeCats(list); save(); renderCatModal(); toast('삭제했어요');
}
function saveCats(){
  const before=catList(catKind).map(c=>c[1]);
  const list=readCatInputs();
  if(!list.length)return toast('카테고리가 최소 1개는 있어야 해요');
  const names=list.map(c=>c[1]);
  if(new Set(names).size!==names.length)return toast('중복된 이름이 있어요');
  // 이름이 바뀐 카테고리는 기존 내역/예산/고정에도 반영
  let renamed=0;
  before.forEach((old,i)=>{ const now=names[i];
    if(now&&old!==now){
      S.tx.forEach(t=>{ if(t.cat===old)t.cat=now; });
      S.fixed.forEach(f=>{ if(f.cat===old)f.cat=now; });
      Object.values(S.budgets).forEach(b=>{ if(b.cats&&b.cats[old]!==undefined){ b.cats[now]=b.cats[old]; delete b.cats[old]; } });
      S.cards.forEach(c=>{ if(Array.isArray(c.exclCats))c.exclCats=c.exclCats.map(x=>x===old?now:x); });
      renamed++;
    }});
  writeCats(list); commit(renamed?`저장했어요 · 이름 변경 ${renamed}건 반영`:'저장했어요');
}
function resetCats(){
  if(!confirm('카테고리를 기본값으로 되돌릴까요? (기존 내역의 카테고리 이름은 그대로 남아요)'))return;
  S.cats=S.cats||{}; S.cats[catKind]=(catKind==='inc'?DEF_INC_CATS:DEF_EXP_CATS).slice();
  save(); renderCatModal(); toast('기본값으로 되돌렸어요');
}

// 옛 버전은 고정수입도 '지출'로 자동기록했을 수 있음 → 찾아서 바로잡기
function findFixedMismatch(){
  const incFixed=S.fixed.filter(f=>(f.kind||'expense')==='income');
  const bad=[];
  incFixed.forEach(f=>{
    S.tx.forEach(t=>{ if(t.fixedId===f.id && t.type==='expense') bad.push({t,f}); });
  });
  return bad;
}
function openFixCheckModal(){
  const bad=findFixedMismatch();
  openModal(`${sheetHead('데이터 점검')}
    ${bad.length?`<div class="card tight warn" style="margin-bottom:12px">
      <div class="w-title">⚠️ 잘못 기록된 고정수입 ${bad.length}건</div>
      <div class="w-body">고정 <b>수입</b>으로 등록했는데 <b>지출</b>로 기록된 내역이에요. 예전 버전에서 생긴 문제로, 아래 버튼으로 한 번에 고칠 수 있어요.</div></div>
      ${bad.slice(0,20).map(({t,f})=>`<div class="tx"><div class="t-main"><div class="t-name">${esc(f.name)}</div>
        <div class="t-sub">${t.date} · 지출로 기록 ${fmt(t.amount)}</div></div>
        <span class="badge terra">수입이어야 함</span></div>`).join('')}
      <button class="btn primary block" style="margin-top:12px" onclick="repairFixedMismatch()">🔧 ${bad.length}건 모두 수입으로 바로잡기</button>
      <div class="tiny" style="margin-top:8px">계좌 잔액도 함께 다시 계산돼요 (지출 취소 + 수입 반영).</div>`
    :`<div class="card tight" style="background:var(--green-soft);border-color:var(--green)">
      <div style="font-weight:800;color:var(--green)">✅ 문제 없어요</div>
      <div class="tiny" style="margin-top:4px">고정수입이 지출로 잘못 기록된 내역이 없습니다.</div></div>`}`);
}
function repairFixedMismatch(){
  const bad=findFixedMismatch();
  if(!bad.length)return toast('고칠 내역이 없어요');
  if(!confirm(`${bad.length}건을 수입으로 바로잡을까요? 계좌 잔액도 함께 정정돼요.`))return;
  let n=0;
  bad.forEach(({t,f})=>{
    applyBalance(t,-1);        // 기존 지출 반영 취소
    t.type='income';
    if(f.cat)t.cat=f.cat;
    t.payKind='account'; if(f.payId)t.payId=f.payId;
    applyBalance(t,1);         // 수입으로 다시 반영
    n++;
  });
  commit(`${n}건을 수입으로 바로잡았어요`);
}

  if(q.length) return q.slice(0,6);
  // 즐겨찾기가 없으면 최근 지출에서 자동 추천(같은 카테고리+금액 조합 빈도순)
  const m={};
  S.tx.filter(t=>t.type==='expense').slice(-60).forEach(t=>{
    const k=`${t.cat}|${t.amount}|${t.memo||''}`;
    m[k]=m[k]||{cat:t.cat,amount:t.amount,memo:t.memo||'',payKind:t.payKind,payId:t.payId,n:0};
    m[k].n++;
  });
  return Object.values(m).filter(x=>x.n>=2&&!hide.includes(quickKey(x)))
    .sort((a,b)=>b.n-a.n).slice(0,6);
}
function renderQuick(){
  const el=$('quick-card'); if(!el) return;
  const list=quickList();
  const hidden=(S.quickHide||[]).length;
  if(!list.length){
    el.innerHTML=`<div class="row"><div style="font-weight:800;font-size:.9rem">⚡ 빠른 입력</div>
      ${hidden?`<button class="btn ghost sm" onclick="resetQuickHidden()">숨김 ${hidden}개 복원</button>`:''}</div>
      <div class="empty">같은 지출을 2번 이상 기록하면<br>여기서 한 번에 다시 넣을 수 있어요</div>`;
    quickEdit=false; return;
  }
  el.innerHTML=`<div class="row" style="margin-bottom:8px"><div style="font-weight:800;font-size:.9rem">⚡ 빠른 입력</div>
      <span style="display:flex;gap:6px;align-items:center">
        ${(!quickEdit&&hidden)?`<button class="btn ghost sm" onclick="resetQuickHidden()">숨김 ${hidden}개 복원</button>`:''}
        <button class="btn ${quickEdit?'primary':'ghost'} sm" onclick="toggleQuickEdit()">${quickEdit?'완료':'편집'}</button></span></div>
    <div style="display:flex;flex-wrap:wrap;gap:7px">
      ${list.map((q,i)=>quickEdit
        ? `<span class="btn ghost sm" style="text-align:left;display:inline-flex;align-items:center;gap:7px">
             ${CAT_EMO[q.cat]||'💸'} ${esc(q.memo||q.cat)} <b class="num">${fmtK(q.amount)}</b>
             <span style="color:var(--danger);font-weight:800;cursor:pointer;padding:0 2px" onclick="delQuick(${i})">✕</span></span>`
        : `<button class="btn ghost sm" style="text-align:left" onclick="runQuick(${i})">
             ${CAT_EMO[q.cat]||'💸'} ${esc(q.memo||q.cat)} <b class="num">${fmtK(q.amount)}</b></button>`).join('')}
    </div>
    <div class="tiny" style="margin-top:7px">${quickEdit?'✕ 를 눌러 지우세요. 자동 추천 항목은 숨김 처리돼요.':'탭하면 오늘 날짜로 기록돼요'}</div>`;
}
function toggleQuickEdit(){ quickEdit=!quickEdit; renderQuick(); }
function delQuick(i){
  const q=quickList()[i]; if(!q)return;
  const k=quickKey(q);
  const before=(S.quick||[]).length;
  S.quick=(S.quick||[]).filter(x=>quickKey(x)!==k);
  // 즐겨찾기에 없던 자동 추천 항목이면 숨김 목록에 넣어 다시 안 뜨게
  if(S.quick.length===before){ S.quickHide=S.quickHide||[]; if(!S.quickHide.includes(k))S.quickHide.push(k); }
  save(); renderQuick(); toast('빠른 입력에서 지웠어요');
}
function resetQuickHidden(){
  S.quickHide=[]; save(); renderQuick(); toast('숨긴 항목을 복원했어요');
}
function runQuick(i){
  const q=quickList()[i]; if(!q)return;
  const t={id:uid(),type:'expense',date:todayStr(),amount:q.amount,cat:q.cat,memo:q.memo||'',
    payKind:q.payKind||'cash',payId:q.payId||'',defended:false};
  if(t.payKind==='card'&&!cardById(t.payId)){t.payKind='cash';t.payId=''}
  if(t.payKind==='account'&&!accById(t.payId)){t.payKind='cash';t.payId=''}
  if(t.payKind==='card'){ const c=cardById(t.payId); if(c&&c.type==='credit'){t.months=1;t.paidPortions=0} }
  S.tx.push(t); applyBalance(t,1);
  save(); renderAll(); toast(`${q.memo||q.cat} ${fmt(q.amount)} 기록했어요`);
}
function addQuickFromTx(id){
  const t=S.tx.find(x=>x.id===id); if(!t||t.type!=='expense')return toast('지출 내역만 추가할 수 있어요');
  S.quick=S.quick||[];
  if(S.quick.some(q=>q.cat===t.cat&&q.amount===t.amount&&(q.memo||'')===(t.memo||'')))return toast('이미 빠른 입력에 있어요');
  const item={cat:t.cat,amount:t.amount,memo:t.memo||'',payKind:t.payKind,payId:t.payId};
  S.quickHide=(S.quickHide||[]).filter(k=>k!==quickKey(item));   // 지웠던 항목이면 숨김 해제
  S.quick.unshift(item);
  S.quick=S.quick.slice(0,6);
  commit('빠른 입력에 추가했어요');
}

let askBusy=false;
const ASK_SUGGEST=[
  '이번 달 왜 이렇게 많이 썼어?',
  '다음 달에 뭘 줄이는 게 제일 효과적이야?',

function openAskModal(preset){

function askBubble(m){
  return m.role==='user'
    ? `<div style="text-align:right;margin-bottom:8px"><span style="display:inline-block;background:var(--terra-soft);color:var(--terra-deep);padding:8px 12px;border-radius:14px 14px 4px 14px;font-size:.87rem;max-width:85%;text-align:left">${esc(m.text)}</span></div>`
    : `<div style="margin-bottom:12px"><span style="display:inline-block;background:var(--surface);border:1px solid var(--line);padding:11px 13px;border-radius:14px 14px 14px 4px;font-size:.87rem;line-height:1.6;max-width:92%">${m.text==='…'?'…':fmtAI(m.text)}</span></div>`;
}
function pushAsk(role,text){
  S.askLog=(S.askLog||[]).concat([{role,text}]).slice(-12);   // 최근 6쌍만 보관
  save();
  const el=$('ask-log');
  if(el){ el.innerHTML=S.askLog.map(m=>askBubble(m)).join(''); el.scrollTop=el.scrollHeight; }
}
async function askAI(preset){
  if(askBusy)return;
  const q=(preset||val('ask-input')||'').trim();
  if(!q)return toast('질문을 입력해주세요');
  const inp=$('ask-input'); if(inp)inp.value='';
  pushAsk('user',q);
  askBusy=true;
  const btn=$('ask-send'); if(btn){btn.disabled=true;btn.textContent='생각 중…'}
  pushAsk('ai','…');
  try{
    // 최근 대화를 함께 넘겨 맥락 유지
    const hist=(S.askLog||[]).slice(0,-2).slice(-6)
      .map(m=>`${m.role==='user'?'나':'코치'}: ${m.text}`).join('\n');
    const prompt=`${AI_PERSONA}
아래 내 재무 데이터를 근거로 질문에 답해. 3~5문장.\n${AI_FORMAT}
숫자를 인용하고, 마지막엔 바로 할 수 있는 행동 1가지를 제안해.
${hist?`\n[이전 대화]\n${hist}\n`:''}
[질문] ${q}${aiCtx()}`;
    const out=(await gemini(prompt)).trim();
    S.askLog.pop();                                   // '…' 제거
    pushAsk('ai',out||'답을 만들지 못했어요. 다시 물어봐주세요.');
    clearAIFail();
  }catch(e){
    S.askLog.pop();
    pushAsk('ai','답하지 못했어요 — '+(e.message||'')+'\n(설정에서 AI 연결을 확인해주세요)');
    noteAIFail(e);
  }
  askBusy=false;
  const b2=$('ask-send'); if(b2){b2.disabled=false;b2.textContent='묻기'}
}
function clearAsk(){ S.askLog=[]; save(); openAskModal(); }

const THEME_KEY='claudeflow_theme';
function themePref(){ try{return localStorage.getItem(THEME_KEY)||'system'}catch(e){return 'system'} }
function applyTheme(){
  const pref=themePref();
  const dark = pref==='dark' || (pref==='system' && window.matchMedia && matchMedia('(prefers-color-scheme:dark)').matches);
  document.documentElement.dataset.theme = dark?'dark':'light';
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content', dark?'#171614':'#FAF9F5');
}
function setTheme(p){
  try{localStorage.setItem(THEME_KEY,p)}catch(e){}
  applyTheme();
  const sh=$('sheet'); // 설정 모달이 열려 있으면 활성 표시 갱신
  if(sh && $('modal') && $('modal').classList.contains('open') && sh.innerHTML.indexOf('화면 테마')>=0) openSettings();
}
function renderThemeSection(){
  const p=themePref(), b=(v,l)=>`<button class="${p===v?'on':''}" onclick="setTheme('${v}')">${l}</button>`;
  return `<div class="field" style="margin-bottom:14px"><label>화면 테마</label><div class="seg">${b('system','시스템')}${b('light','라이트')}${b('dark','다크')}</div></div>`;
}
if(window.matchMedia){ try{ matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{ if(themePref()==='system') applyTheme(); }); }catch(e){} }

async function pushDiagnose(){
  const box=$('push-diag'); if(!box)return;
  box.innerHTML='점검 중…';
  const L=[];
  const mark=(ok,txt)=>L.push(`${ok?'✅':'❌'} ${txt}`);
  const warn=txt=>L.push(`⚠️ ${txt}`);

  // 1) 이 기기
  mark(true,'브라우저 푸시 지원');
  if(_isIOS()&&Sync.isStandalone&&!Sync.isStandalone()){
    warn('아이폰은 <b>홈 화면에 추가한 앱</b>에서 열어야 알림이 와요 (Safari 탭에서는 불가)');
  }
  const perm=(window.Notification&&Notification.permission)||'default';
  mark(perm==='granted',`알림 권한: ${perm==='granted'?'허용됨':perm==='denied'?'<b>차단됨</b> — 기기 설정에서 Claude Flow Pro 알림을 허용해주세요':'아직 요청 안 함 — 위 [푸시 알림 켜기]를 눌러주세요'}`);
  try{
    const reg=await navigator.serviceWorker.getRegistration();
    mark(!!reg,'서비스워커 등록'+(reg?'':' — 페이지를 새로고침해주세요'));
    const sub=reg&&await reg.pushManager.getSubscription();
    mark(!!sub,'이 기기 구독'+(sub?'':' — 위 [푸시 알림 켜기]를 눌러주세요'));
  }catch(e){ mark(false,'서비스워커 확인 실패 — '+esc(e.message||'')); }

  // 2) 서버
  try{
    const d=await Sync.callDigest('status');
    mark(!!d.vapidReady,'서버 알림 키(VAPID)'+(d.vapidReady?'':' — '+esc(d.vapidError||'설정되지 않음')));
    if(d.vapidReady){

    }
    mark(d.subscriptions>0,`서버에 등록된 기기 ${d.subscriptions||0}대`);
  }catch(e){
    mark(false,'알림 서버 호출 실패 — '+esc(e.message||''));
    L.push('→ Supabase <b>Edge Functions</b> 에 <b>digest</b> 함수가 최신 코드로 배포돼 있는지 확인해주세요.');
  }
  box.innerHTML=L.join('<br>');
}
async function pushTest(){
  const box=$('push-diag'); if(box)box.innerHTML='보내는 중…';
  try{
    const d=await Sync.callDigest('test');
    if(d.ok){
      if(box)box.innerHTML=`✅ ${d.sent}대에 보냈어요. 잠시 뒤 알림이 오지 않으면 기기의 알림 설정을 확인해주세요.`;
      toast('테스트 알림을 보냈어요');
    }else{
      const why=(d.results&&d.results[0]&&(d.results[0].detail||('HTTP '+d.results[0].status)))||d.error||'알 수 없는 이유';
      if(box)box.innerHTML=`❌ 보내지 못했어요 — ${esc(why)}`;
    }
  }catch(e){ if(box)box.innerHTML='❌ 호출 실패 — '+esc(e.message||''); }
}
function refreshPushBtn(){
  if(!(window.Sync && Sync.pushSubscribed)) return;
  Sync.pushSubscribed().then(on=>{ _pushOn=on; const b=$('push-btn'); if(b)b.textContent=on?'🔔 푸시 알림 끄기':'🔔 푸시 알림 켜기'; });
}
async function togglePush(){
  try{
    if(_pushOn){ await Sync.disablePush(); _pushOn=false; toast('푸시 알림을 껐어요'); }
    else { toast('알림 권한 요청 중…'); await Sync.enablePush(PUSH_VAPID_PUBLIC); _pushOn=true; toast('푸시 알림을 켰어요 🔔'); }
  }catch(e){ toast('실패 — '+(e.message||'')); }
  const b=$('push-btn'); if(b)b.textContent=_pushOn?'🔔 푸시 알림 끄기':'🔔 푸시 알림 켜기';
}
function renderSyncSection(){
  if(!window.Sync) return '';
  const configured=Sync.configured(), signedIn=Sync.signedIn();
  let inner;
  if(!configured){
    inner=`<div class="tiny" style="margin-bottom:8px">Supabase 프로젝트를 만든 뒤 URL·anon key를 넣으면 기기 간 자동 동기화가 켜져요. (설정 방법은 README 참고)</div>
      <div class="field"><label>Supabase URL</label><input id="sy-url" placeholder="https://xxxx.supabase.co"></div>
      <div class="field"><label>anon key (public)</label><input id="sy-key" type="password" placeholder="eyJ… 로 시작"></div>
      <button class="btn dark block" onclick="syncConnect()">연결</button>`;
  } else if(!signedIn){
    // 앱에 프로젝트가 내장돼 있으면 사용자는 이메일·비밀번호만 입력하면 된다
    inner=`<div class="tiny" style="margin-bottom:9px">이메일로 가입하면 폰·패드·PC가 같은 데이터를 공유해요.</div>
      <div class="field"><label>이메일</label><input id="sy-email" type="email" placeholder="you@example.com" autocomplete="username"></div>
      <div class="field"><label>비밀번호</label><input id="sy-pw" type="password" placeholder="6자 이상" autocomplete="current-password"></div>
      <div class="grid2"><button class="btn primary" onclick="syncSignIn()">로그인</button><button class="btn ghost" onclick="syncSignUp()">회원가입</button></div>
      ${Sync.usingBuiltin&&Sync.usingBuiltin()
        ? (Sync.allowCustom&&Sync.allowCustom()
            ? `<details class="acc" style="margin-top:10px"><summary style="padding:11px 14px;font-size:.82rem">직접 만든 Supabase 쓰기 (선택)</summary>
                 <div style="padding:0 14px 14px">
                   <div class="field"><label>Supabase URL</label><input id="sy-url" placeholder="https://xxxx.supabase.co"></div>
                   <div class="field"><label>anon key (public)</label><input id="sy-key" type="password" placeholder="eyJ… 로 시작"></div>
                   <button class="btn dark block" onclick="syncConnect()">이 프로젝트로 바꾸기</button>
                 </div></details>` : '')
        : `<button class="btn ghost block" style="margin-top:8px;font-size:.8rem;color:var(--sub)" onclick="syncDisconnect()">이 기기 연결 해제</button>`}`;
  } else {
    inner=`<div class="row" style="margin-bottom:10px"><span class="muted" style="font-size:.85rem">${esc(Sync.email())}</span><button class="btn soft sm" onclick="syncNow()">지금 동기화</button></div>
      <button class="btn ghost block" style="margin-bottom:8px" onclick="syncForcePush()">⬆️ 이 기기 내용을 모든 기기에 덮어쓰기</button>
      <div class="tiny" style="margin-bottom:10px">기기마다 데이터가 어긋났을 때, 지금 이 기기 상태를 기준으로 맞춰요.</div>
      <div class="grid2"><button class="btn ghost" onclick="syncSignOut()">로그아웃</button><button class="btn ghost" style="color:var(--danger)" onclick="syncDisconnect()">연결 해제</button></div>`;
  }
  return `<div class="card tight" style="margin-bottom:14px">
    <div class="row" style="margin-bottom:8px"><b style="font-size:.92rem">☁️ 클라우드 동기화</b><span id="sync-status-line" style="font-size:.75rem;font-weight:700;color:${syncStatusColor()}">${syncStatusText()}</span></div>
    ${inner}</div>`;
}
function syncConnect(){ const url=val('sy-url'),key=val('sy-key');
  Sync.connect(url,key).then(()=>{toast('연결했어요 — 이제 로그인하세요');openSettings();}).catch(e=>toast(e.message||'연결 실패')); }
function syncSignIn(){ const email=val('sy-email').trim(),pw=val('sy-pw');
  if(!email||!pw){toast('이메일과 비밀번호를 입력해주세요');return}
  toast('로그인 중…'); Sync.signIn(email,pw).then(()=>{toast('로그인했어요 — 동기화됩니다');openSettings();}).catch(e=>toast('로그인 실패 — '+(e.message||''))); }
function syncSignUp(){ const email=val('sy-email').trim(),pw=val('sy-pw');
  if(!email||pw.length<6){toast('이메일과 6자 이상 비밀번호를 입력해주세요');return}
  toast('가입 중…'); Sync.signUp(email,pw).then(r=>{ toast(r&&r.needConfirm?'확인 메일을 보냈어요 — 인증 후 로그인하세요':'가입·로그인 완료 — 동기화됩니다'); openSettings(); }).catch(e=>toast('가입 실패 — '+(e.message||''))); }
function syncSignOut(){ Sync.signOut().then(()=>{toast('로그아웃했어요');openSettings();}); }
function syncDisconnect(){ if(!confirm('이 기기의 클라우드 연결을 해제할까요? 로컬 데이터는 그대로 남아요.'))return;
  Sync.disconnect().then(()=>{toast('연결을 해제했어요');openSettings();}); }
function syncNow(){ toast('동기화 중…'); Sync.syncNow().then(()=>toast('동기화했어요')); }
function syncForcePush(){
  if(!confirm('지금 이 기기의 내용으로 클라우드와 다른 기기를 모두 덮어쓸까요?\n다른 기기에만 있던 변경은 사라져요.'))return;
  toast('덮어쓰는 중…');
  Sync.forcePush().then(()=>{toast('이 기기 기준으로 맞췄어요');openSettings();})
    .catch(e=>toast('실패 — '+(e.message||'')));
}

/* ═════════ 버전 복원(타임머신) ═════════ */
function openVersionsModal(){
  if(!window.Sync || !Sync.signedIn()){ toast('클라우드 로그인 후 사용할 수 있어요'); return; }
  openModal(`${sheetHead('타임머신 · 버전 복원')}
    <div id="ver-list" class="muted" style="text-align:center;padding:20px 0">불러오는 중…</div>
    <div class="tiny" style="margin-top:8px;text-align:center">저장할 때마다 자동으로 남는 최근 백업이에요. 복원해도 현재 상태는 먼저 백업됩니다.</div>`);
  Sync.listVersions().then(res=>{
    const el=$('ver-list'); if(!el) return;
    if(!res || res.error){ el.innerHTML=`<div class="tiny">아직 버전 기록을 켜지 않았어요.<br>Supabase에서 백업 테이블 SQL(README의 schema.sql)을 실행하면 여기에 쌓여요.</div>`; return; }
    const rows=res.data||[];
    if(!rows.length){ el.innerHTML=`<div class="tiny">아직 저장된 버전이 없어요. 몇 번 기록하면 여기 쌓여요.</div>`; return; }
    el.classList.remove('muted'); el.style.padding='0'; el.style.textAlign='left';
    el.innerHTML=rows.map(r=>{
      const d=new Date(r.saved_at);
      const label=`${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      return `<div class="tx"><div class="t-main"><div class="t-name num">${label}</div><div class="t-sub">버전 ${r.rev}</div></div><button class="btn ghost sm" onclick="restoreVersion(${r.id})">복원</button></div>`;
    }).join('');
  }).catch(()=>{ const el=$('ver-list'); if(el)el.innerHTML=`<div class="tiny">목록을 불러오지 못했어요.</div>`; });
}
function restoreVersion(id){
  if(!confirm('이 시점으로 되돌릴까요? 지금 상태는 자동으로 백업돼요.'))return;
  toast('복원 중…');
  Sync.restoreVersion(id).then(()=>{ toast('복원했어요'); closeModal(); }).catch(e=>toast('복원 실패 — '+(e.message||'')));
}

autoApplyFixed();

renderHome();

/* PWA: 서비스워커 등록 + 클라우드 동기화 부트스트랩 */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
window.addEventListener('load',()=>{ if(window.Sync){ Sync.on((s)=>{
  // 실제로 로그인해 본 적이 있는지 기록 (오류 배너를 신규 사용자에게 띄우지 않기 위함)
  if(s&&s.signedIn&&s.signedIn()&&!(S.settings&&S.settings.syncUsed)){ S.settings.syncUsed=true; save(); }
  renderSyncBanner(); if(s&&s.status==='synced') refreshDigest();
}); Sync.init(); renderSyncBanner(); } });
