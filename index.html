<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FAF9F5">
<title>Claude Flow</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<meta name="apple-mobile-web-app-title" content="Claude Flow">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#FAF9F5; --surface:#FFFFFF; --ink:#3D3929; --sub:#8A8478; --faint:#B5AFA2;
  --line:#EAE7DD; --line2:#DFDBCE;
  --terra:#D97757; --terra-deep:#C05B3C; --terra-soft:#F9EFE9; --terra-line:#EDCDBE;
  --green:#6B8F71; --green-soft:#EEF3EE;
  --gold:#B8933F; --gold-soft:#F6F1E3;
  --blue:#5B7B99; --blue-soft:#ECF1F5;
  --danger:#C14E3D;
  --r:18px; --r-sm:12px;
  --shadow:0 1px 2px rgba(61,57,41,.04), 0 4px 16px rgba(61,57,41,.05);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo',sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.5;
  -webkit-font-smoothing:antialiased; letter-spacing:-0.01em;
}
#app{max-width:520px;margin:0 auto;padding:0 18px calc(96px + env(safe-area-inset-bottom))}
.num{font-variant-numeric:tabular-nums;letter-spacing:-0.02em}

/* ── header ── */
header{display:flex;align-items:center;justify-content:space-between;padding:22px 2px 14px}
.wordmark{font-family:ui-serif,Georgia,'Times New Roman',serif;font-size:1.35rem;font-weight:600;letter-spacing:-0.01em}
.wordmark em{font-style:normal;color:var(--terra)}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  display:flex;align-items:center;justify-content:center;font-size:1.05rem;cursor:pointer;color:var(--sub)}

/* ── cards & layout ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.card.tight{padding:14px 16px}
.sec-title{font-size:.82rem;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;margin:20px 2px 10px;display:flex;justify-content:space-between;align-items:center}
.sec-title .link{color:var(--terra);font-weight:600;letter-spacing:0;text-transform:none;font-size:.82rem;cursor:pointer}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--sub);font-size:.85rem}
.tiny{color:var(--faint);font-size:.75rem}
.pos{color:var(--green)} .neg{color:var(--terra-deep)}
.divider{height:1px;background:var(--line);margin:12px 0}

/* ── hero (total assets) ── */
.hero{padding:24px 20px}
.hero .label{font-size:.82rem;color:var(--sub);font-weight:600}
.hero .amount{font-size:2.15rem;font-weight:800;letter-spacing:-0.03em;margin:2px 0 4px}
.hero-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px}
.hero-grid .cell{background:var(--bg);border-radius:var(--r-sm);padding:10px 12px}
.hero-grid .cell .k{font-size:.72rem;color:var(--sub);font-weight:600}
.hero-grid .cell .v{font-size:.95rem;font-weight:700;margin-top:1px}

/* ── badges / chips ── */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px}
.badge.terra{background:var(--terra-soft);color:var(--terra-deep)}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.gold{background:var(--gold-soft);color:var(--gold)}
.badge.blue{background:var(--blue-soft);color:var(--blue)}
.badge.gray{background:#F1EFE8;color:var(--sub)}
.score-chip{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:8px 14px 8px 10px;cursor:pointer}
.score-ring{width:34px;height:34px}

/* ── warning card ── */
.warn{background:var(--terra-soft);border:1px solid var(--terra-line)}
.warn .w-title{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--terra-deep)}
.warn .w-body{font-size:.88rem;margin:8px 0 12px;color:#6E4a3a}
.quick-actions{display:flex;gap:8px}

/* ── buttons ── */
.btn{border:none;border-radius:12px;padding:11px 16px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s}
.btn:active{opacity:.75}
.btn.primary{background:var(--terra);color:#fff}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:var(--surface);border:1px solid var(--line2);color:var(--ink)}
.btn.soft{background:var(--terra-soft);color:var(--terra-deep)}
.btn.sm{padding:7px 12px;font-size:.8rem;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}

/* ── gauges & progress ── */
.gauge-track{height:10px;border-radius:99px;background:#F0EDE3;overflow:hidden;position:relative}
.gauge-fill{height:100%;border-radius:99px;background:var(--green);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.gauge-fill.warn-fill{background:var(--gold)}
.gauge-fill.over-fill{background:var(--terra)}
.gauge-marker{position:absolute;top:-3px;width:2px;height:16px;background:var(--ink);opacity:.35;border-radius:2px}

/* ── transaction list ── */
.tx{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.tx:last-child{border-bottom:none}
.tx .emo{width:38px;height:38px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex-shrink:0}
.tx .t-main{flex:1;min-width:0}
.tx .t-name{font-weight:600;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t-sub{font-size:.75rem;color:var(--faint)}
.tx .t-amt{font-weight:700;font-size:.93rem;white-space:nowrap}
.empty{padding:26px 0;text-align:center;color:var(--faint);font-size:.85rem}

/* ── calendar heatmap ── */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head .m-label{font-weight:800;font-size:1.05rem}
.cal-nav{display:flex;gap:6px}
.cal-nav button{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--sub);font-size:.9rem}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-dow{text-align:center;font-size:.68rem;color:var(--faint);font-weight:700;padding:2px 0}
.hm-cell{aspect-ratio:1;border-radius:10px;background:#F2F0E8;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;border:2px solid transparent}
.hm-cell .d{font-size:.78rem;font-weight:600}
.hm-cell.other{opacity:0;pointer-events:none}
.hm-cell.today{border-color:var(--ink)}
.hm-cell.sel{border-color:var(--terra);box-shadow:0 0 0 2px var(--terra-soft)}
.hm-cell .dot{width:4px;height:4px;border-radius:99px;background:var(--green);position:absolute;bottom:5px}
.heat-legend{display:flex;align-items:center;gap:5px;justify-content:flex-end;margin-top:10px;font-size:.68rem;color:var(--faint)}
.heat-legend i{width:12px;height:12px;border-radius:4px;display:inline-block}

/* ── assets ── */
.asset-item{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.asset-item:last-child{border-bottom:none}
.a-ic{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.a-main{flex:1;min-width:0}
.a-name{font-weight:700;font-size:.93rem}
.a-sub{font-size:.74rem;color:var(--faint)}
.a-amt{font-weight:800;font-size:.95rem;white-space:nowrap}

/* ── card(신용/체크) item ── */
.pay-card{border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;background:var(--surface);box-shadow:var(--shadow)}
.pc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.pc-name{font-weight:800;font-size:1rem}
.pc-meta{font-size:.76rem;color:var(--sub);margin-top:2px}
.perk-box{background:var(--bg);border-radius:var(--r-sm);padding:10px 12px;font-size:.8rem;color:var(--sub);margin-top:10px;white-space:pre-wrap}

/* ── report ── */
.rep-month{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.rep-month::-webkit-scrollbar{display:none}
.rm-chip{flex-shrink:0;padding:8px 14px;border-radius:99px;border:1px solid var(--line2);background:var(--surface);font-size:.82rem;font-weight:700;cursor:pointer;color:var(--sub)}
.rm-chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.headline{font-family:ui-serif,Georgia,serif;font-size:1.3rem;font-weight:700;line-height:1.35;letter-spacing:-0.015em}
.stat3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.stat3 .cell{background:var(--bg);border-radius:var(--r-sm);padding:10px 12px}
.stat3 .k{font-size:.7rem;color:var(--sub);font-weight:700}
.stat3 .v{font-size:.92rem;font-weight:800;margin-top:1px}
.stat3 .d{font-size:.7rem;font-weight:700;margin-top:1px}
.top3 .bar-row{margin:10px 0}
.top3 .bar-label{display:flex;justify-content:space-between;font-size:.83rem;font-weight:600;margin-bottom:4px}
.top3 .bar-track{height:8px;border-radius:99px;background:#F0EDE3;overflow:hidden}
.top3 .bar-fill{height:100%;border-radius:99px;background:var(--terra)}
.ai-box{background:linear-gradient(180deg,#FBF4EF, #FDFBF8);border:1px solid var(--terra-line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.ai-box .ai-tag{font-size:.72rem;font-weight:800;color:var(--terra-deep);letter-spacing:.05em;margin-bottom:6px}
.ai-box .ai-text{font-size:.9rem;white-space:pre-wrap}
.tip{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.tip:last-child{border-bottom:none}
.tip .n{color:var(--terra);font-weight:800;font-family:ui-serif,Georgia,serif}
.score-detail{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.sd-row{display:flex;align-items:center;gap:10px;font-size:.85rem}
.sd-row .k{width:64px;font-weight:700;color:var(--sub)}
.sd-row .bar{flex:1;height:8px;border-radius:99px;background:#F0EDE3;overflow:hidden}
.sd-row .bar i{display:block;height:100%;border-radius:99px;background:var(--green)}
.sd-row .v{width:46px;text-align:right;font-weight:800}

/* ── forms ── */
.field{margin-bottom:13px}
.field label{display:block;font-size:.78rem;font-weight:700;color:var(--sub);margin-bottom:5px}
input,select,textarea{
  width:100%;padding:12px 13px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);
  font-family:inherit;font-size:.95rem;color:var(--ink);outline:none;appearance:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--terra);box-shadow:0 0 0 3px var(--terra-soft)}
textarea{resize:vertical;min-height:70px}
.seg{display:flex;background:#F0EDE3;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:none;background:transparent;padding:9px 4px;border-radius:10px;font-family:inherit;font-size:.85rem;font-weight:700;color:var(--sub);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.cat-cell{border:1px solid var(--line);border-radius:12px;padding:9px 2px;text-align:center;cursor:pointer;background:var(--surface)}
.cat-cell .ce{font-size:1.05rem}
.cat-cell .cl{font-size:.68rem;font-weight:600;color:var(--sub);margin-top:2px}
.cat-cell.on{border-color:var(--terra);background:var(--terra-soft)}
.cat-cell.on .cl{color:var(--terra-deep);font-weight:800}

/* ── modal ── */
.overlay{position:fixed;inset:0;background:rgba(41,38,27,.45);display:none;align-items:flex-end;justify-content:center;z-index:50;backdrop-filter:blur(2px)}
.overlay.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:translateY(0);opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sheet-head h3{font-size:1.05rem;font-weight:800}
.sheet-head .x{border:none;background:#EFECE2;width:30px;height:30px;border-radius:99px;cursor:pointer;color:var(--sub);font-size:.9rem}

/* ── tab bar & FAB ── */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(250,249,245,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tabbar .inner{max-width:520px;margin:0 auto;display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;border:none;background:transparent;font-family:inherit;cursor:pointer;padding:6px 0 4px;color:var(--faint);font-size:.66rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button .ti{font-size:1.25rem;line-height:1}
.tabbar button.on{color:var(--terra-deep)}
.fab{position:fixed;right:max(18px,calc(50% - 242px));bottom:calc(78px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:19px;background:var(--terra);color:#fff;border:none;font-size:1.6rem;cursor:pointer;box-shadow:0 6px 20px rgba(217,119,87,.4);z-index:41;display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(.94)}

/* ── misc ── */
.view{display:none}.view.on{display:block}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:.85rem;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;white-space:nowrap}
#toast.show{opacity:1}
.banner{display:flex;align-items:center;gap:12px;background:var(--gold-soft);border:1px solid #E7DCBB;border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.banner .b-main{flex:1;font-size:.86rem;font-weight:600}
.svg-chart{width:100%;height:auto;display:block}
.legend-dot{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:4px}
details.acc{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:12px;box-shadow:var(--shadow)}
details.acc summary{padding:15px 16px;font-weight:800;font-size:.92rem;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.acc summary::-webkit-details-marker{display:none}
details.acc .acc-body{padding:0 16px 14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ── 시뮬레이터 ── */
.sim-controls{margin-top:14px}
.slider-row{margin:14px 0}
.slider-row .sl-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.slider-row .sl-label{font-size:.83rem;font-weight:700}
.slider-row .sl-val{font-size:.86rem;font-weight:800;color:var(--terra-deep)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;background:#EAE7DD;outline:none;padding:0;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;background:var(--terra);cursor:pointer;box-shadow:0 2px 6px rgba(217,119,87,.4);border:3px solid #fff}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--terra);cursor:pointer;border:3px solid #fff;box-shadow:0 2px 6px rgba(217,119,87,.4)}
.sim-out{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px}
.sim-out .cell{background:var(--bg);border-radius:var(--r-sm);padding:11px 10px;text-align:center}
.sim-out .cell .k{font-size:.68rem;color:var(--sub);font-weight:700}
.sim-out .cell .v{font-size:.98rem;font-weight:800;margin-top:2px}
.sim-out .cell .d{font-size:.66rem;font-weight:700;margin-top:1px}
.horizon-seg{display:flex;gap:5px;margin-top:4px}
.horizon-seg button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 0;font-family:inherit;font-size:.76rem;font-weight:700;color:var(--sub);cursor:pointer}
.horizon-seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.wi-preset{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.wi-preset button{border:1px solid var(--line2);background:var(--surface);border-radius:99px;padding:6px 12px;font-family:inherit;font-size:.78rem;font-weight:600;cursor:pointer;color:var(--ink)}
.wi-verdict{border-radius:var(--r-sm);padding:12px 14px;margin-top:12px;font-size:.86rem;font-weight:600;line-height:1.5}
.wi-ok{background:var(--green-soft);color:var(--green)}
.wi-warn{background:var(--gold-soft);color:var(--gold)}
.wi-bad{background:var(--terra-soft);color:var(--terra-deep)}
/* ── 받을돈/빌려준돈 ── */
.debt-row{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line)}
.debt-row:last-child{border-bottom:none}
.debt-row.done{opacity:.5}
.debt-ic{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:.95rem;flex-shrink:0;font-weight:800}
.debt-main{flex:1;min-width:0}
.debt-name{font-weight:700;font-size:.9rem}
.debt-sub{font-size:.72rem;color:var(--faint)}
.debt-amt{font-weight:800;font-size:.92rem;white-space:nowrap}
.debt-sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.debt-sum .cell{border-radius:var(--r-sm);padding:11px 12px;text-align:center}
.debt-sum .k{font-size:.7rem;font-weight:700;opacity:.75}
.debt-sum .v{font-size:1.02rem;font-weight:800;margin-top:2px}
/* ── 브리핑 ── */
.brief{background:linear-gradient(160deg,#FDF7F2,#FBF3EC);border:1px solid var(--terra-line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.brief .b-tag{font-size:.7rem;font-weight:800;color:var(--terra-deep);letter-spacing:.06em;margin-bottom:7px}
.brief .b-head{font-family:ui-serif,Georgia,serif;font-size:1.15rem;font-weight:700;line-height:1.4;margin-bottom:9px}
.brief .b-line{font-size:.86rem;padding:5px 0;display:flex;gap:8px;align-items:flex-start}
.brief .b-line b{white-space:nowrap}
/* ── 이상 거래 ── */
.anom{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.anom:last-child{border-bottom:none}
.anom .a-emo{font-size:1rem;flex-shrink:0}
.anom .a-txt{font-size:.84rem;line-height:1.45}
/* ── 예산 ── */
.bd-row{padding:10px 0;border-bottom:1px solid var(--line)}
.bd-row:last-child{border-bottom:none}
.bd-top{display:flex;justify-content:space-between;align-items:baseline;font-size:.85rem;margin-bottom:6px}
.bd-name{font-weight:700}
.bd-nums{font-size:.78rem;color:var(--sub)}
.bd-track{height:7px;border-radius:99px;background:#F0EDE3;overflow:hidden;position:relative}
.bd-fill{height:100%;border-radius:99px;transition:width .4s}
.bd-pace{position:absolute;top:-2px;width:2px;height:11px;background:var(--ink);opacity:.3;border-radius:2px}
/* ── 위시리스트 ── */
.wish-row{display:flex;align-items:center;gap:11px;padding:12px 2px;border-bottom:1px solid var(--line)}
.wish-row:last-child{border-bottom:none}
.wish-row.ready{background:linear-gradient(90deg,rgba(107,143,113,.07),transparent);border-radius:10px;padding-left:8px}

<script>
/* ═════════ 데이터 & 저장 ═════════ */
const KEY='claudeflow_v1';
const store={
  ok:(()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true}catch(e){return false}})(),
  mem:null,
  load(){ if(this.ok){const r=localStorage.getItem(KEY);return r?JSON.parse(r):null} return this.mem },
  save(d){
    if(!this.ok){this.mem=d;return true}
    try{ localStorage.setItem(KEY,JSON.stringify(d)); this.full=false; return true }
    catch(e){
      this.mem=d; // 메모리에라도 보존
      if(!this.full){
        this.full=true;
        setTimeout(()=>{try{alert('⚠️ 기기 저장 공간이 부족해 저장하지 못했어요.\n\n설정 → 데이터 내보내기로 백업한 뒤, 오래된 내역을 정리해주세요. 지금 화면의 변경사항은 앱을 닫으면 사라집니다.')}catch(_){}},50);
      }
      return false;
    }
  }
};
let S = store.load() || {
  accounts:[], cards:[], tx:[], fixed:[], invLogs:[], reports:{},
  settings:{gemini:'', name:''}
};
function migrate(){
  S.reports=S.reports||{}; S.invLogs=S.invLogs||[]; S.fixed=S.fixed||[];
  S.settings=S.settings||{gemini:''};
  S.goals=S.goals||[]; S.weekly=S.weekly||null;
  if(S.settings.dcaM===undefined)S.settings.dcaM=0;
  if(S.settings.simReturn===undefined)S.settings.simReturn=6;
  if(S.settings.simExtra===undefined)S.settings.simExtra=0;
  if(S.settings.simHorizon===undefined)S.settings.simHorizon=12;
  S.debts=S.debts||[]; S.budgets=S.budgets||{}; S.briefs=S.briefs||{}; S.anomAck=S.anomAck||[];
  S.wish=S.wish||[]; S.recon=S.recon||[]; S.scores=S.scores||{};
  if(!S.settings.fx)S.settings.fx={usdkrw:1380,at:'',auto:true};
  const _fx=S.settings.fx;
  if(_fx.err===undefined)_fx.err=''; if(_fx.tried===undefined)_fx.tried=''; if(_fx.src===undefined)_fx.src='';
  if(S.settings.aiErr===undefined)S.settings.aiErr=''; if(S.settings.aiErrAt===undefined)S.settings.aiErrAt='';
  S.accounts.forEach(a=>{if(!a.cur)a.cur='KRW'});
  S.invLogs.forEach(l=>{if(!l.cur)l.cur='KRW';if(!l.fxAt)l.fxAt=(l.cur==='USD'?(S.settings.fx.usdkrw||1380):1)});
  S.cards.forEach(c=>{c.perks=c.perks||[];c.exclCats=c.exclCats||[];if(!c.tiers)c.tiers=c.target?[c.target]:[]});
  S.tx.forEach(t=>{
    if(t.type==='expense'&&t.payKind==='card'){
      if(!t.months)t.months=1;
      if(t.paidPortions===undefined){
        const c=S.cards.find(x=>x.id===t.payId);
        t.paidPortions=(c&&c.type==='credit'&&c.lastSettled&&t.date<=c.lastSettled)?t.months:0;
      }
    }
  });
}
migrate();
const save=()=>{const ok=store.save(S); if(window.Sync&&window.Sync.markDirty)window.Sync.markDirty(); return ok;};
const uid=()=> Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const AMT_MAX=1000000000; // 10억 — 오타 방어 상한
function checkAmt(v,label){
  if(!isFinite(v)||v<=0){toast((label||'금액')+'을 확인해주세요');return false}
  if(v>AMT_MAX){toast('금액이 너무 커요 (10억 초과) — 오타를 확인해주세요');return false}
  return true;
}

/* ═════════ 상수 ═════════ */
const EXP_CATS=[['🍚','식비'],['☕','카페/간식'],['🚇','교통'],['🛍️','쇼핑'],['🎬','문화/여가'],['📚','교육'],['📱','통신'],['🔄','구독'],['💊','의료'],['✈️','여행'],['🎁','경조사'],['🏠','주거'],['🏋️','운동'],['💸','기타']];
const INC_CATS=[['📖','과외'],['🧑‍💼','아르바이트'],['💌','용돈'],['🎓','장학금'],['📈','투자수익'],['🏦','이자'],['📦','판매수익'],['💰','환급'],['🎉','상금'],['💵','기타수입']];
const CAT_EMO=Object.fromEntries([...EXP_CATS,...INC_CATS].map(([e,n])=>[n,e]));
const ACC_META={
  checking:{emo:'💳',label:'입출금',bg:'var(--blue-soft)'},
  deposit:{emo:'🏦',label:'예금',bg:'var(--green-soft)'},
  saving:{emo:'🔒',label:'적금',bg:'var(--gold-soft)'},
  invest:{emo:'📈',label:'투자',bg:'var(--terra-soft)'}
};

/* ═════════ 유틸 ═════════ */
const fmt=n=>Math.round(n).toLocaleString('ko-KR')+'원';
const fmtK=n=>{ // 축약형
  const a=Math.abs(n);
  if(a>=100000000) return (n/100000000).toFixed(1).replace(/\.0$/,'')+'억';
  if(a>=10000) return Math.round(n/10000).toLocaleString()+'만';
  return Math.round(n).toLocaleString();
};
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const ymOf=s=>s.slice(0,7);
const thisYM=()=>todayStr().slice(0,7);
const prevYM=ym=>{const[y,m]=ym.split('-').map(Number);const d=new Date(y,m-2,1);return`${d.getFullYear()}-${pad(d.getMonth()+1)}`};
const ymLabel=ym=>{const[y,m]=ym.split('-');return`${y}년 ${+m}월`};
const daysIn=ym=>{const[y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate()};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const accById=id=>S.accounts.find(a=>a.id===id);
const cardById=id=>S.cards.find(c=>c.id===id);
/* ── DOM/공통 헬퍼 (중복 제거) ── */
const $=id=>document.getElementById(id);
const val=(id,d='')=>{const e=$(id);return e?e.value:d};
const numVal=(id)=>{const e=$(id);return e?(+e.value||0):0};
const chkVal=(id,d=false)=>{const e=$(id);return e?e.checked:d};
function commit(msg){save();closeModal();renderAll();if(msg)toast(msg);}
function askDel(msg,fn){if(confirm(msg)){fn();}}
// 계좌 <option> 생성기: types 배열로 필터, sel과 일치 시 selected
function accOpts(sel,types,fmtFn){
  return S.accounts.filter(a=>!types||types.includes(a.type))
    .map(a=>`<option value="${a.id}" ${sel===a.id?'selected':''}>${ACC_META[a.type].emo} ${esc(a.name)}${fmtFn?' · '+fmtFn(a):''}</option>`).join('');
}
// 진행 바 마크업 생성기
function gauge(pct,color,opts={}){
  const p=Math.max(0,Math.min(100,pct||0));
  const cls=opts.cls||'gauge-track', fcls=opts.fillCls||'gauge-fill';
  const mark=opts.mark!=null?`<div class="${opts.markCls||'gauge-marker'}" style="left:${Math.max(0,Math.min(100,opts.mark))}%"></div>`:'';
  return`<div class="${cls}" style="${opts.style||''}"><div class="${fcls}" style="width:${p}%${color?';background:'+color:''}"></div>${mark}</div>`;
}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2000)}

/* ═════════ 집계 ═════════ */
const monthTx=ym=>S.tx.filter(t=>ymOf(t.date)===ym);
const dayTx=d=>S.tx.filter(t=>t.date===d);
function totals(ym){
  const m=monthTx(ym);let inc=0,exp=0;
  m.forEach(t=>{if(t.type==='income')inc+=t.amount;else if(t.type==='expense')exp+=t.amount});
  return{inc,exp,bal:inc-exp};
}
function catSums(ym,type='expense'){
  const map={};
  monthTx(ym).filter(t=>t.type===type).forEach(t=>map[t.cat]=(map[t.cat]||0)+t.amount);
  return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}
function dailyAvg30(){ // 최근 30일(오늘 제외) 일평균 지출 — 고정비·방어 지출 제외
  const t=new Date();let sum=0;
  for(let i=1;i<=30;i++){
    const d=new Date(t);d.setDate(t.getDate()-i);
    const ds=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    dayTx(ds).forEach(x=>{if(x.type==='expense'&&!x.fixedId&&!x.defended)sum+=x.amount});
  }
  return sum/30;
}
function todaySpend(includeDefended=true){
  return dayTx(todayStr()).filter(t=>t.type==='expense'&&!t.fixedId&&(includeDefended||!t.defended)).reduce((s,t)=>s+t.amount,0);
}
const monthDiff=(a,b)=>{const[y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number);return(y2-y1)*12+(m2-m1)};
/* 할부: 승인월부터 매달 1회분씩 청구. duePortions=지금까지 청구된 회차 수 */
function duePortions(t){const n=t.months||1;return Math.max(0,Math.min(n,monthDiff(ymOf(t.date),thisYM())+1))}
function portionAmt(t,k){const n=t.months||1;const base=Math.floor(t.amount/n);return k===n-1?t.amount-base*(n-1):base}
function pendingOfTx(t){const due=duePortions(t),paid=t.paidPortions||0;let s=0;for(let k=paid;k<due;k++)s+=portionAmt(t,k);return s}
function creditPending(card){ // 미결제 잔액: 청구됐지만 아직 결제 처리 안 된 회차 합
  return S.tx.filter(t=>t.type==='expense'&&t.payKind==='card'&&t.payId===card.id).reduce((s,t)=>s+pendingOfTx(t),0);
}
function installRemain(card){ // 아직 청구되지 않은 미래 할부 잔여
  return S.tx.filter(t=>t.type==='expense'&&t.payKind==='card'&&t.payId===card.id&&(t.months||1)>1)
    .reduce((s,t)=>{let r=0;for(let k=duePortions(t);k<(t.months||1);k++)r+=portionAmt(t,k);return s+r},0);
}
/* 전월 실적 엔진 */
function perfSpend(card,ym){ // 실적 인정액: 제외 카테고리·실적제외 표시 건 제외
  return monthTx(ym).filter(t=>t.type==='expense'&&t.payKind==='card'&&t.payId===card.id&&!t.noPerf&&!(card.exclCats||[]).includes(t.cat)).reduce((s,t)=>s+t.amount,0);
}
const achievedTierBy=(amt,tiers)=>tiers.filter(t=>amt>=t).length;
function perkEstimates(card,ym){ // 혜택별 이번 달 예상 적립액 (전월 실적으로 활성 판정)
  const tiers=card.tiers||[];
  const activeTier=tiers.length?achievedTierBy(perfSpend(card,prevYM(ym)),tiers):Infinity;
  return(card.perks||[]).map(p=>{
    const active=tiers.length?activeTier>=(p.tier||1):true;
    const txs=monthTx(ym).filter(t=>t.type==='expense'&&t.payKind==='card'&&t.payId===card.id
      &&(p.cat==='전체'||t.cat===p.cat)&&t.amount>=(p.minAmt||0)).sort((a,b)=>a.date.localeCompare(b.date));
    const use=(p.maxCnt||0)>0?txs.slice(0,p.maxCnt):txs;
    let est=use.reduce((s,t)=>s+(p.kind==='percent'?t.amount*p.value/100:p.value),0);
    if((p.capM||0)>0)est=Math.min(est,p.capM);
    return{p,active,est:active?Math.round(est):0};
  });
}

async function fetchFx(silent){
  if(fxBusy){ if(!silent)toast('환율을 가져오는 중이에요…'); return false }
  fxBusy=true;
  if(!silent)toast('환율 확인 중…');
  S.settings.fx.tried=todayStr();
  let lastErr='연결 실패';
  for(const s of FX_SOURCES){
    try{
      let r;
      if(typeof AbortController!=='undefined'){
        const c=new AbortController(), t=setTimeout(()=>c.abort(),5000);
        r=await fetch(s.u,{signal:c.signal,cache:'no-store'}); clearTimeout(t);
      }else r=await fetch(s.u,{cache:'no-store'});
      if(!r.ok){lastErr='서버 응답 '+r.status;continue}
      const j=await r.json();
      const v=s.pick(j);
      if(v&&v>500&&v<3000){
        S.settings.fx.usdkrw=Math.round(v*100)/100;
        S.settings.fx.at=todayStr(); S.settings.fx.err=''; S.settings.fx.src=s.n;
        save(); fxBusy=false;

      lastErr=(e&&e.name==='AbortError')?'시간 초과':'네트워크 차단(CORS)';
    }

/* ═════════ Financial Health Score ═════════ */
function healthScore(ym){
  const{inc,exp}=totals(ym);
  const p=prevYM(ym), pv=totals(p);
  const clamp=(x,lo=0,hi=20)=>Math.max(lo,Math.min(hi,Math.round(x)));
  // 소비: 수입 대비 지출률 50% 이하 만점, 100% 이상 0점
  const spend = inc>0 ? clamp((1-exp/inc)/0.5*20) : (exp>0?8:10);
  // 저축: 저축률 30% 이상 만점
  const saveR = inc>0 ? (inc-exp)/inc : 0;
  const saving = inc>0 ? clamp(saveR/0.3*20) : 10;
  // 투자: 이번 달 납입액 / 수입 15% 이상 만점 (+투자자산 보유 가점)
  const invM = S.invLogs.filter(l=>ymOf(l.date)===ym).reduce((s,l)=>s+toKRW(l.amount,l.cur,l.fxAt),0);
  let invest = inc>0 ? clamp(invM/inc/0.15*20) : (invM>0?14:6);
  if(invest<20 && S.accounts.some(a=>a.type==='invest')) invest=clamp(invest+3);
  // 부채: 신용카드 미결제 / 월수입 10% 이하 만점, 50% 이상 0점
  const debtR = inc>0 ? totalCreditPending()/inc : (totalCreditPending()>0?0.5:0);
  const debt = clamp((0.5-debtR)/0.4*20);
  // 현금흐름: 이번 달 흑자 + 전월 흑자 여부
  let flow=6;
  if(inc-exp>0)flow+=8; if(pv.inc-pv.exp>0)flow+=6;
  if(inc===0&&exp===0)flow=10;
  flow=clamp(flow);
  const parts={'소비':spend,'저축':saving,'투자':invest,'부채':debt,'현금흐름':flow};
  return{total:Object.values(parts).reduce((a,b)=>a+b,0),parts};
}
function scoreRing(score,size=34){
  const r=(size/2)-3, c=2*Math.PI*r, off=c*(1-score/100);
  const col=score>=80?'var(--green)':score>=55?'var(--gold)':'var(--terra)';
  return`<svg class="score-ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#F0EDE3" stroke-width="4"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="4"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-size="${size*0.32}" font-weight="800" fill="var(--ink)">${score}</text>
  </svg>`;
}

/* ── 소비 예측 ── */
function forecastMonth(){
  const ym=thisYM(), day=new Date().getDate(), dim=daysIn(ym);
  const m=monthTx(ym).filter(t=>t.type==='expense');
  const spent=m.reduce((s,t)=>s+t.amount,0);
  const varSpent=m.filter(t=>!t.fixedId).reduce((s,t)=>s+t.amount,0);
  const pace=varSpent/day;
  // 남은 고정비: 아직 반영 안 된 이번 달 고정비
  const appliedIds=new Set(m.filter(t=>t.fixedId).map(t=>t.fixedId));
  const remainFixed=S.fixed.filter(f=>f.active!==false&&!appliedIds.has(f.id)).reduce((s,f)=>s+f.amount,0);
  return{spent,predicted:spent+pace*(dim-day)+remainFixed,day,dim};
}
function renderForecast(){
  const f=forecastMonth(), pmT=totals(prevYM(thisYM()));
  const ref=pmT.exp>0?pmT.exp:null;

function syncTxDraft(){
  const g=$;
  if(g('tx-date'))txDraft.date=val('tx-date');
  if(g('tx-amt'))txDraft.amount=val('tx-amt');
  if(g('tx-memo'))txDraft.memo=val('tx-memo');
  if(g('tx-def'))txDraft.defended=chkVal('tx-def');
  if(g('tx-noperf'))txDraft.noPerf=g('tx-noperf').checked;
  if(g('tx-months'))txDraft.months=+g('tx-months').value||1;
  if(g('tx-from'))txDraft.fromId=g('tx-from').value;
  if(g('tx-to'))txDraft.toId=g('tx-to').value;
  if(g('tx-pay')&&g('tx-pay').value){const[k,i]=g('tx-pay').value.split('|');txDraft.payKind=k;txDraft.payId=i||'';}
}
/* 잔액 반영: 체크카드/계좌/수입은 즉시, 신용카드는 결제 처리 때 */
// 거래 금액(t.amount)은 항상 원화. 계좌 통화에 맞춰 환산해 반영.
function applyToAcc(a,krwAmt,sign){ // sign: +1 증가, -1 감소
  if(!a)return;
  const v=(a.cur==='USD')?Math.round(fromKRW(krwAmt,'USD')*100)/100:krwAmt;
  a.balance+=sign*v;
  if(a.cur==='USD')a.balance=Math.round(a.balance*100)/100;
}
function applyBalance(t,sign){
  if(t.type==='transfer'){
    const f=accById(t.fromId),g=accById(t.toId);
    applyToAcc(f,t.amount,-sign);
    applyToAcc(g,t.amount,sign);
    return;
  }
  if(t.type==='income'){
    if(t.payKind==='account')applyToAcc(accById(t.payId),t.amount,sign);
    return;
  }
  if(t.payKind==='account')applyToAcc(accById(t.payId),t.amount,-sign);
  if(t.payKind==='card'){
    const c=cardById(t.payId);
    if(c&&c.type==='check')applyToAcc(accById(c.accountId),t.amount,-sign);
    // credit: 결제 처리 시점에 차감
  }
}
function saveTx(){
  syncTxDraft();
  const d=txDraft, amt=Math.round(+d.amount);
  if(!d.date)return toast('날짜를 확인해주세요');
  if(!checkAmt(amt))return;
  if(d.type==='transfer'){
    if(!d.fromId||!d.toId)return toast('보내는 계좌와 받는 계좌를 선택해주세요');
    if(d.fromId===d.toId)return toast('보내는 계좌와 받는 계좌가 같아요');
  }
  if(d.id){
    const old=S.tx.find(x=>x.id===d.id);
    applyBalance(old,-1);
    Object.assign(old,{...d,amount:amt});
    applyBalance(old,1);
  }else{
    const t={...d,id:uid(),amount:amt};
    S.tx.push(t);applyBalance(t,1);
  }
  commit('저장했어요');
}
function delTx(id){
  const t=S.tx.find(x=>x.id===id);if(!t)return;
  if(!confirm('이 내역을 삭제할까요?'))return;
  applyBalance(t,-1);
  S.tx=S.tx.filter(x=>x.id!==id);
  commit('삭제했어요');
}

function delAcc(id){
  const linked=S.cards.filter(c=>c.accountId===id).length
    +S.goals.filter(g=>g.accountId===id).length
    +S.debts.filter(d=>d.accountId===id&&!d.settled).length
    +S.fixed.filter(f=>f.payKind==='account'&&f.payId===id).length;
  if(!confirm(linked?`이 자산을 삭제할까요?\n연결된 항목 ${linked}건의 연결이 해제됩니다. (기록 자체는 유지돼요)`:'이 자산을 삭제할까요?'))return;
  S.accounts=S.accounts.filter(a=>a.id!==id);
  S.invLogs=S.invLogs.filter(l=>l.accountId!==id);
  S.cards.forEach(c=>{if(c.accountId===id)c.accountId=''});
  S.goals.forEach(g=>{if(g.accountId===id)g.accountId=''});
  S.debts.forEach(d=>{if(d.accountId===id)d.accountId=''});
  S.fixed.forEach(f=>{if(f.payKind==='account'&&f.payId===id){f.payKind='cash';f.payId=''}});
  commit('삭제했어요');
}

function renderDCA(){
  const el=$('dca-card');

  if(!logs.length){el.innerHTML=`<div class="row"><div style="font-weight:800;font-size:.92rem;margin-bottom:6px">DCA 적립 차트</div><span style="font-size:.78rem;cursor:pointer;color:var(--terra);font-weight:600" onclick="openDcaTargetModal()">목표 설정</span></div><div class="empty">투자 자산에서 납입을 기록하면<br>적립 곡선이 그려져요 📈</div>`;return}
  // 월별 누적 납입
  const byM={};logs.forEach(l=>byM[ymOf(l.date)]=(byM[ymOf(l.date)]||0)+toKRW(l.amount,l.cur,l.fxAt));
  const months=Object.keys(byM).sort();
  let cum=0;const pts=months.map(m=>{cum+=byM[m];return{m,cum,put:byM[m]}});
  const curVal=S.accounts.filter(a=>a.type==='invest').reduce((s,a)=>s+accKRW(a),0);
  const W=440,H=170,P=30;
  const dcaM=S.settings.dcaM||0;
  const maxY=Math.max(cum,curVal,dcaM*pts.length)*1.12;
  const x=i=>P+ i*(W-P-12)/Math.max(1,pts.length-1);
  const y=v=>H-24-(v/maxY)*(H-44);
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.cum).toFixed(1)}`).join(' ');
  const area=line+` L${x(pts.length-1).toFixed(1)},${H-24} L${x(0).toFixed(1)},${H-24} Z`;
  const pl=curVal-cum, plr=cum>0?pl/cum*100:0;
  const goalLine=dcaM>0?pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(dcaM*(i+1)).toFixed(1)}`).join(' '):'';
  const goalGap=cum-dcaM*pts.length;
  el.innerHTML=`
    <div class="row" style="margin-bottom:4px"><div style="font-weight:800;font-size:.92rem">DCA 적립 차트 <span style="font-size:.76rem;cursor:pointer;color:var(--terra);font-weight:600" onclick="openDcaTargetModal()">목표 설정</span></div>
    <div class="tiny num">누적 납입 ${fmtK(cum)}원 → 평가 ${fmtK(curVal)}원</div></div>
    <div class="num" style="font-size:.85rem;margin-bottom:8px">수익 <b class="${pl>=0?'pos':'neg'}">${pl>=0?'+':''}${fmt(pl)} (${plr>=0?'+':''}${plr.toFixed(1)}%)</b></div>
    <svg class="svg-chart" viewBox="0 0 ${W} ${H}">
      <line x1="${P}" y1="${H-24}" x2="${W-10}" y2="${H-24}" stroke="var(--line2)" stroke-width="1"/>
      <line x1="${P}" y1="${y(curVal)}" x2="${W-10}" y2="${y(curVal)}" stroke="var(--green)" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="${W-12}" y="${y(curVal)-5}" text-anchor="end" font-size="10" fill="var(--green)" font-weight="700">현재 평가액</text>
      ${goalLine?`<path d="${goalLine}" fill="none" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="${x(0)+3}" y="${y(dcaM)-6}" font-size="10" fill="var(--gold)" font-weight="700">목표 페이스</text>`:''}
      <path d="${area}" fill="rgba(217,119,87,.12)"/>
      <path d="${line}" fill="none" stroke="var(--terra)" stroke-width="2.5" stroke-linecap="round"/>
      ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.cum)}" r="3.4" fill="var(--terra)" stroke="#fff" stroke-width="1.5"/>`).join('')}
      ${pts.map((p,i)=>(pts.length<=8||i%2===0||i===pts.length-1)?`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="var(--faint)">${p.m.slice(2).replace('-','.')}</text>`:'').join('')}
    </svg>
    <div class="tiny" style="margin-top:4px"><span class="legend-dot" style="background:var(--terra)"></span>누적 납입액 곡선${dcaM?` · 목표(월 ${fmtK(dcaM)}원) 대비 <b class="${goalGap>=0?'pos':'neg'}">${goalGap>=0?'+':'−'}${fmtK(Math.abs(goalGap))}원</b>`:' — 꾸준함이 그려지고 있어요'}</div>`;
}

function renderPerfBanner(){
  const el=$('perf-banner'); el.innerHTML='';

  if(left>7)return;

    const appliedIds=new Set(monthTx(ym).filter(t=>t.fixedId).map(t=>t.fixedId));
    const cand=S.fixed.filter(f=>f.active!==false&&!appliedIds.has(f.id)&&!(f.payKind==='card'&&f.payId===c.id));

function reportStats(ym){
  const{inc,exp}=totals(ym), p=prevYM(ym), pv=totals(p);
  const saveRate=inc>0?Math.round((inc-exp)/inc*100):0;
  const pSave=pv.inc>0?Math.round((pv.inc-pv.exp)/pv.inc*100):null;
  const top3=catSums(ym).slice(0,3);
  const maxTx=monthTx(ym).filter(t=>t.type==='expense').sort((a,b)=>b.amount-a.amount)[0]||null;
  return{inc,exp,saveRate,top3,maxTx,
    expD:pv.exp>0?(exp-pv.exp)/pv.exp*100:null,
    incD:pv.inc>0?(inc-pv.inc)/pv.inc*100:null,
    saveD:pSave===null?null:saveRate-pSave};
}
function ruleHeadline(st,ym){
  if(st.inc>st.exp&&st.saveRate>=30)return`${+ym.slice(5)}월, 수입의 ${st.saveRate}%를 지켜낸 견실한 한 달`;
  if(st.inc>st.exp)return`${+ym.slice(5)}월은 흑자. 다만 저축률 ${st.saveRate}%는 조금 아쉬워요`;
  if(st.exp>0&&st.inc===0)return`${+ym.slice(5)}월, 수입 기록 없이 ${fmtK(st.exp)}원이 나갔어요`;
  return`${+ym.slice(5)}월은 적자. 새는 곳을 찾아볼 시간이에요`;
}
function ruleCommentary(st){
  const l=[];
  if(st.top3[0])l.push(`가장 큰 지출은 ${st.top3[0][0]}(${fmtK(st.top3[0][1])}원)로 전체의 ${Math.round(st.top3[0][1]/st.exp*100)}%를 차지했어요.`);
  if(st.expD!==null)l.push(st.expD>10?`지출이 전월보다 ${st.expD.toFixed(0)}% 늘었어요. 증가 원인을 TOP 3에서 확인해보세요.`:st.expD<-10?`지출을 전월 대비 ${Math.abs(st.expD).toFixed(0)}% 줄였어요. 좋은 흐름이에요.`:`지출 규모는 전월과 비슷하게 유지됐어요.`);
  if(st.saveRate>=30)l.push(`저축률 ${st.saveRate}%는 사회초년생 권장선(20~30%)을 넘는 훌륭한 수치예요.`);
  else if(st.inc>0)l.push(`저축률은 ${st.saveRate}%예요. 다음 달엔 수입의 20%를 먼저 떼어놓는 '선저축'을 시도해보세요.`);
  if(st.maxTx)l.push(`최대 단일 지출은 '${st.maxTx.memo||st.maxTx.cat}' ${fmtK(st.maxTx.amount)}원이었어요.`);
  return l.join(' ');
}
function ruleTips(st){
  const tips=[];
  if(st.top3[0])tips.push(`${st.top3[0][0]} 예산을 ${fmtK(Math.round(st.top3[0][1]*0.9))}원(−10%)으로 정하고 캘린더로 페이스를 확인하기`);
  if(st.inc>0&&st.saveRate<30)tips.push(`월급날 수입의 ${Math.min(30,st.saveRate+10)}%를 적금·투자 계좌로 자동이체 걸기`);

}

async function gemini(prompt){
  let res;
  try{
    const c=(typeof AbortController!=='undefined')?new AbortController():null;
    const t=c?setTimeout(()=>c.abort(),25000):null;
    res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(S.settings.gemini)}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:prompt}]}]}),
      signal:c?c.signal:undefined
    });
    if(t)clearTimeout(t);
  }catch(e){
    const err=new Error((e&&e.name==='AbortError')?'응답 시간 초과':'네트워크 차단(CORS) — 저장한 파일을 직접 열면 막힐 수 있어요');
    err.kind='network'; throw err;
  }
  if(!res.ok){
    let msg='서버 오류 '+res.status;
    if(res.status===400||res.status===403)msg='API 키가 올바르지 않아요';
    else if(res.status===429)msg='무료 사용량을 초과했어요 (잠시 후 재시도)';
    const err=new Error(msg); err.kind='api'; throw err;
  }
  const data=await res.json();
  return data.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||'';
}

function weekStats(offset){ // offset 0=최근7일, 1=직전7일
  const end=new Date(); end.setDate(end.getDate()-offset*7);
  const days=[];
  for(let i=0;i<7;i++){const d=new Date(end);d.setDate(end.getDate()-i);days.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`)}
  const list=S.tx.filter(t=>days.includes(t.date));
  let exp=0,inc=0;const cats={};
  list.forEach(t=>{if(t.type==='expense'){exp+=t.amount;cats[t.cat]=(cats[t.cat]||0)+t.amount}else if(t.type==='income')inc+=t.amount});
  const top=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,3);
  return{exp,inc,top};
}

/* ═════════ v2: 6개월 추이 차트 ═════════ */
function renderTrend(){
  const el=$('trend-card');
  const months=[];const n=new Date();
  for(let i=5;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1);months.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}`)}
  const data=months.map(m=>({m,...totals(m)}));
  if(!data.some(d=>d.inc||d.exp)){el.innerHTML=`<div style="font-weight:800;font-size:.92rem">6개월 추이</div><div class="empty">기록이 쌓이면 월별 흐름이 그려져요</div>`;return}
  const W=440,H=200,BOT=36,TOP=18,BW=17;
  const maxV=Math.max(1,...data.map(d=>Math.max(d.inc,d.exp)))*1.15;
  const x=i=>44+i*(W-60)/5;
  const y=v=>H-BOT-(v/maxV)*(H-BOT-TOP);
  const yR=v=>H-BOT-(Math.max(0,Math.min(100,v))/100)*(H-BOT-TOP); // 저축률 0~100%
  let bars='',labels='',ratePts=[];
  data.forEach((d,i)=>{
    const cx=x(i);
    if(d.inc>0)bars+=`<rect x="${cx-BW-1.5}" y="${y(d.inc)}" width="${BW}" height="${Math.max(0,H-BOT-y(d.inc))}" rx="3.5" fill="var(--green)" opacity=".8"/>`;
    if(d.exp>0)bars+=`<rect x="${cx+1.5}" y="${y(d.exp)}" width="${BW}" height="${Math.max(0,H-BOT-y(d.exp))}" rx="3.5" fill="var(--terra)" opacity=".9"/>`;
    labels+=`<text x="${cx}" y="${H-16}" text-anchor="middle" font-size="10" fill="var(--faint)">${+d.m.slice(5)}월</text>`;
    if(d.inc>0){const sr=Math.round((d.inc-d.exp)/d.inc*100);ratePts.push({cx,cy:yR(sr),sr})}
  });
  const rateLine=ratePts.map((p,i)=>`${i?'L':'M'}${p.cx},${p.cy.toFixed(1)}`).join(' ');
  el.innerHTML=`<div class="row" style="margin-bottom:6px"><div style="font-weight:800;font-size:.92rem">6개월 추이</div>
    <div class="tiny"><span class="legend-dot" style="background:var(--green)"></span>수입 <span class="legend-dot" style="background:var(--terra)"></span>지출 <span class="legend-dot" style="background:var(--gold)"></span>저축률</div></div>
    <svg class="svg-chart" viewBox="0 0 ${W} ${H}">
      <line x1="30" y1="${H-BOT}" x2="${W-10}" y2="${H-BOT}" stroke="var(--line2)" stroke-width="1"/>
      ${bars}
      ${ratePts.length>1?`<path d="${rateLine}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-dasharray="1 0" stroke-linecap="round"/>`:''}
      ${ratePts.map(p=>`<circle cx="${p.cx}" cy="${p.cy}" r="3.2" fill="var(--gold)" stroke="#fff" stroke-width="1.4"/><text x="${p.cx}" y="${p.cy-7}" text-anchor="middle" font-size="9.5" font-weight="800" fill="var(--gold)">${p.sr}%</text>`).join('')}
      ${labels}
    </svg>`;
}

/* ═════════ v3: 자산 시뮬레이터 ═════════ */
// 최근 N개월 실제 월 저축(수입-지출) 중앙값 → 기본 저축 페이스
function recentMonthlySaving(){
  const now=new Date(); const vals=[];
  for(let i=1;i<=6;i++){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const ym=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
    const t=totals(ym);
    if(t.inc>0||t.exp>0) vals.push(t.inc-t.exp);
  }
  if(!vals.length)return 0;
  vals.sort((a,b)=>a-b);
  const mid=Math.floor(vals.length/2);
  return Math.round(vals.length%2?vals[mid]:(vals[mid-1]+vals[mid])/2);
}
// 적금 월 자동납입 합계(만기 전까지 유지되는 강제저축)
function monthlyAutoSaving(){
  return S.accounts.filter(a=>a.type==='saving'&&a.monthly>0)
    .filter(a=>!a.maturity||a.maturity>=todayStr())
    .reduce((s,a)=>s+a.monthly,0);
}
// 최근 투자 월 납입 페이스(최근 3회 평균)
function recentInvestPace(){
  const byM={}; S.invLogs.forEach(l=>byM[ymOf(l.date)]=(byM[ymOf(l.date)]||0)+toKRW(l.amount,l.cur,l.fxAt));
  const ms=Object.keys(byM).sort().slice(-3);
  if(!ms.length)return 0;
  return Math.round(ms.reduce((s,m)=>s+byM[m],0)/ms.length);
}
/* 시뮬레이션: 매달 (기본저축 + 추가절약)을 순자산에 더하고, 투자원금엔 월 수익률 복리 */
function simulate(months,extraMonthly){
  const start=netAssets();
  const invStart=S.accounts.filter(a=>a.type==='invest').reduce((s,a)=>s+accKRW(a),0);
  const baseSave=recentMonthlySaving();
  const invPace=recentInvestPace();
  const r=(S.settings.simReturn||0)/100/12; // 월 수익률
  const contrib=baseSave+extraMonthly; // 매달 순자산 증가(현금성)
  const pts=[]; let cash=start-invStart, inv=invStart;
  pts.push({m:0,total:start});
  for(let i=1;i<=months;i++){
    inv=inv*(1+r)+invPace;      // 투자: 복리 + 매달 납입
    cash+=contrib-invPace;       // 현금: 저축분에서 투자납입만큼은 투자로 이동
    pts.push({m:i,total:Math.round(cash+inv)});
  }
  return{pts,baseSave,invPace,contrib,end:pts[pts.length-1].total,invEnd:Math.round(inv)};
}
function setHorizon(h){S.settings.simHorizon=h;save();renderSim()}
function onSimExtra(v){S.settings.simExtra=Math.round(+v);$('sim-extra-val').textContent=(S.settings.simExtra>=0?'+':'−')+fmtK(Math.abs(S.settings.simExtra))+'원/월';save();drawSim()}
function onSimReturn(v){S.settings.simReturn=+v;$('sim-ret-val').textContent=(+v).toFixed(1)+'%/년';save();drawSim()}
function renderSim(){

    <svg class="svg-chart" id="sim-svg" viewBox="0 0 440 180" style="margin-top:10px"></svg>
    <div class="sim-out" id="sim-out"></div>
    <div class="sim-controls">
      <div class="slider-row">
        <div class="sl-top"><span class="sl-label">💰 월 추가 절약/저축</span><span class="sl-val" id="sim-extra-val">${(S.settings.simExtra>=0?'+':'−')+fmtK(Math.abs(S.settings.simExtra))}원/월</span></div>
        <input type="range" min="-300000" max="500000" step="10000" value="${S.settings.simExtra}" oninput="onSimExtra(this.value)">
      </div>
      <div class="slider-row">
        <div class="sl-top"><span class="sl-label">📊 투자 연 수익률 가정</span><span class="sl-val" id="sim-ret-val">${(S.settings.simReturn||0).toFixed(1)}%/년</span></div>
        <input type="range" min="0" max="15" step="0.5" value="${S.settings.simReturn}" oninput="onSimReturn(this.value)">
      </div>
    </div>
    <div class="tiny">투자 수익률은 가정치예요. 과거 수익이 미래를 보장하지 않습니다.</div>`;
  drawSim();
}
function drawSim(){
  const svg=$('sim-svg'); if(!svg)return;
  const months=S.settings.simHorizon, extra=S.settings.simExtra;
  const sim=simulate(months,extra), base=simulate(months,0); // 비교선: 추가절약 0
  const W=440,H=180,P=8,BOT=22,L=4;
  const allV=[...sim.pts,...base.pts].map(p=>p.total);
  const minV=Math.min(...allV,0), maxV=Math.max(...allV)*1.08||1;
  const x=i=>L+i*(W-L-10)/months;
  const y=v=>H-BOT-((v-minV)/(maxV-minV||1))*(H-BOT-P);
  const path=pts=>pts.map((p,i)=>`${i?'L':'M'}${x(p.m).toFixed(1)},${y(p.total).toFixed(1)}`).join(' ');
  const area=path(sim.pts)+` L${x(months).toFixed(1)},${H-BOT} L${L},${H-BOT} Z`;
  const zeroY=y(0);
  svg.innerHTML=`
    ${minV<0?`<line x1="${L}" y1="${zeroY.toFixed(1)}" x2="${W-10}" y2="${zeroY.toFixed(1)}" stroke="var(--terra-line)" stroke-width="1" stroke-dasharray="3 3"/>`:''}
    <path d="${area}" fill="rgba(217,119,87,.10)"/>
    ${extra!==0?`<path d="${path(base.pts)}" fill="none" stroke="var(--faint)" stroke-width="1.5" stroke-dasharray="4 4"/>`:''}
    <path d="${path(sim.pts)}" fill="none" stroke="var(--terra)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="${x(months)}" cy="${y(sim.end)}" r="4" fill="var(--terra)" stroke="#fff" stroke-width="1.5"/>
    <text x="${x(0)}" y="${H-6}" font-size="9.5" fill="var(--faint)">지금</text>
    <text x="${x(months)}" y="${H-6}" text-anchor="end" font-size="9.5" fill="var(--faint)">${months>=12?months/12+'년 후':months+'개월 후'}</text>
    ${extra!==0?`<text x="${x(months)-4}" y="${y(base.pts[months].total)-6}" text-anchor="end" font-size="9" fill="var(--faint)">지금 페이스</text>`:''}`;
  const diff=sim.end-netAssets(), vsBase=sim.end-base.end;
  $('sim-out').innerHTML=`
    <div class="cell"><div class="k">현재 순자산</div><div class="v num">${fmtK(netAssets())}원</div></div>
    <div class="cell"><div class="k">${months>=12?months/12+'년 후 예상':months+'개월 후 예상'}</div><div class="v num" style="color:var(--terra-deep)">${fmtK(sim.end)}원</div><div class="d ${diff>=0?'pos':'neg'}">${diff>=0?'+':'−'}${fmtK(Math.abs(diff))}</div></div>
    <div class="cell"><div class="k">추가 절약 효과</div><div class="v num ${vsBase>=0?'pos':'neg'}">${vsBase>=0?'+':'−'}${fmtK(Math.abs(vsBase))}</div><div class="d">지금 페이스 대비</div></div>`;
}

      <div class="field" style="margin-bottom:8px"><label>할부 개월</label><select id="wi-months" onchange="wiCalc()">${[1,2,3,6,12].map(n=>`<option value="${n}" ${wiMonths===n?'selected':''}>${n===1?'일시불':n+'개월'}</option>`).join('')}</select></div>
    </div>

function wiSet(a,m){wiAmt=a;wiMonths=m;renderWhatIf()}
function wiCalc(){
  if($('wi-amt'))wiAmt=Math.round(numVal('wi-amt'));
  if($('wi-months'))wiMonths=numVal('wi-months')||1;
  const box=$('wi-result'); if(!box)return;
  if(!wiAmt){box.innerHTML='';return}
  const perMonth=Math.round(wiAmt/wiMonths);
  const liquid=S.accounts.filter(a=>a.type==='checking'||a.type==='deposit').reduce((s,a)=>s+accKRW(a),0);
  const baseSave=recentMonthlySaving();
  const t=totals(thisYM());
  const thisMonthBal=t.inc-t.exp-perMonth; // 이번 달 첫 회차 반영
  const afterLiquid=liquid-perMonth;
  const monthsToRecover=baseSave>0?Math.ceil(wiAmt/baseSave):null;
  // 판정
  let cls,verdict;
  if(perMonth>liquid){cls='wi-bad';verdict=`⚠️ 첫 회차 ${fmt(perMonth)}이 현재 유동자산(${fmtK(liquid)}원)을 넘어요. 지금은 무리예요.`;}

const budgetOf=ym=>S.budgets[ym]||null;
function budgetPace(ym){
  const b=budgetOf(ym); if(!b||!b.total)return null;
  const day=(ym===thisYM())?new Date().getDate():daysIn(ym);
  const dim=daysIn(ym), {exp}=totals(ym);
  const f=(ym===thisYM())?forecastMonth().predicted:exp;
  const idealPace=b.total*day/dim; // 오늘까지 이상적 소비
  return{total:b.total,spent:exp,day,dim,predicted:Math.round(f),
    pct:b.total>0?exp/b.total*100:0, pacePct:day/dim*100,
    over:f>b.total, gap:Math.round(f-b.total),
    dailyLeft:Math.max(0,Math.round((b.total-exp)/Math.max(1,dim-day))),
    ahead:exp>idealPace};
}

/* ═════════ v4-3: 이상 거래 감지 ═════════ */
function detectAnomalies(){
  const ym=thisYM(), out=[];
  const m=monthTx(ym).filter(t=>t.type==='expense'&&!t.fixedId);
  // 카테고리별 과거 3개월 평균 건당 금액
  const hist={};
  for(let i=1;i<=3;i++){
    const d=new Date();d.setMonth(d.getMonth()-i);
    monthTx(`${d.getFullYear()}-${pad(d.getMonth()+1)}`).filter(t=>t.type==='expense'&&!t.fixedId)
      .forEach(t=>{(hist[t.cat]=hist[t.cat]||[]).push(t.amount)});
  }
  const recent=m.filter(t=>{const dd=(new Date(todayStr())-new Date(t.date))/86400000;return dd>=0&&dd<=14});
  // ① 평소보다 큰 단일 지출
  recent.forEach(t=>{
    const hs=hist[t.cat];
    if(hs&&hs.length>=3){
      const avg=hs.reduce((a,b)=>a+b,0)/hs.length;
      if(t.amount>=avg*2.5&&t.amount>=30000)
        out.push({id:'big-'+t.id,emo:'📈',txt:`<b>${esc(t.memo||t.cat)}</b> ${fmt(t.amount)} — 평소 ${t.cat} 평균(${fmtK(avg)}원)의 <b>${(t.amount/avg).toFixed(1)}배</b>예요.`});
    }
  });
  // ② 중복 결제 의심 (같은 금액·같은 카테고리가 3일 내 2건 이상)
  const seen={};
  recent.forEach(t=>{const k=t.cat+'|'+t.amount;(seen[k]=seen[k]||[]).push(t)});
  Object.values(seen).forEach(g=>{
    if(g.length>=2){
      g.sort((a,b)=>a.date.localeCompare(b.date));
      for(let i=1;i<g.length;i++){
        const gap=(new Date(g[i].date)-new Date(g[i-1].date))/86400000;
        if(gap<=3){out.push({id:'dup-'+g[i].id,emo:'👯',txt:`<b>${esc(g[i].memo||g[i].cat)}</b> ${fmt(g[i].amount)}이 ${gap===0?'같은 날':gap+'일 간격으로'} 2번 기록됐어요. 중복 입력이 아닌지 확인해보세요.`});break}
      }
    }
  });
  // ③ 안 쓰던 카테고리 등장
  const usedBefore=new Set(Object.keys(hist));
  const newCats=[...new Set(recent.map(t=>t.cat))].filter(c=>!usedBefore.has(c));
  newCats.forEach(c=>{
    const sum=recent.filter(t=>t.cat===c).reduce((s,t)=>s+t.amount,0);
    if(sum>=50000)out.push({id:'new-'+ym+'-'+c,emo:'🆕',txt:`최근 <b>${c}</b>에 ${fmt(sum)}을 썼어요. 이전 3개월엔 없던 항목이에요.`});
  });
  return out.filter(a=>!S.anomAck.includes(a.id)).slice(0,4);
}
function renderAnomaly(){
  const el=$('anomaly-card');
  const list=detectAnomalies();
  if(!list.length){el.innerHTML='';el.style.display='none';return}
  el.style.display='';
  el.innerHTML=`<div class="row" style="margin-bottom:4px"><div style="font-weight:800;font-size:.9rem">🔍 이런 점이 눈에 띄어요</div>
    <button class="btn ghost sm" onclick="ackAllAnom()">모두 확인</button></div>
    ${list.map(a=>`<div class="anom"><span class="a-emo">${a.emo}</span><span class="a-txt">${a.txt}</span></div>`).join('')}
    <div class="tiny" style="margin-top:6px">잘못 입력한 게 없다면 [모두 확인]을 눌러 정리하세요.</div>`;
}
function ackAllAnom(){
  detectAnomalies().forEach(a=>S.anomAck.push(a.id));
  if(S.anomAck.length>200)S.anomAck=S.anomAck.slice(-200);

}

const COOL_DAYS=14;

  const passed=Math.floor((new Date(todayStr())-new Date(w.date))/86400000);
  return Math.max(0,(w.cool||COOL_DAYS)-passed);
}
function savedThisMonth(){
  return S.wish.filter(w=>w.status==='skipped'&&ymOf(w.decidedAt||'')===thisYM()).reduce((s,w)=>s+w.amount,0);
}
function renderWish(){
  const el=$('wish-card');

  const saved=savedThisMonth();
  const badge=saved>0?`<div class="saved-badge">🌱 이번 달 참아서 아낀 돈 ${fmt(saved)}</div>`:'';
  if(!open.length){
    el.innerHTML=badge+`<div class="empty">사고 싶은 게 생기면 바로 사지 말고<br>여기 담아두세요. ${COOL_DAYS}일 뒤에 다시 물어볼게요 🛒</div>`;
    return;
  }
  el.innerHTML=badge+open.sort((a,b)=>wishDaysLeft(a)-wishDaysLeft(b)).map(w=>{
    const left=wishDaysLeft(w), cool=w.cool||COOL_DAYS, prog=(cool-left)/cool*100;
    const ready=left===0;
    return`<div class="wish-row ${ready?'ready':''}">
      <div class="wish-ic">${ready?'⏰':'🛒'}</div>
      <div class="wish-main">
        <div class="row"><span class="wish-name">${esc(w.name)}</span><span class="num" style="font-weight:800;font-size:.9rem">${fmt(w.amount)}</span></div>
        <div class="wish-sub">${ready?'<b style="color:var(--green)">쿨다운 끝 — 아직도 사고 싶나요?</b>':`${left}일 남음 · ${w.date.slice(5).replace('-','/')} 담음`}</div>
        ${!ready?`<div class="cool-track"><div class="cool-fill" style="width:${prog}%"></div></div>`:''}
        ${ready?`<div class="wish-acts">
          <button class="btn soft sm" onclick="wishDecide('${w.id}','bought')">샀어요</button>
          <button class="btn ghost sm" onclick="wishDecide('${w.id}','skipped')">안 사기로 했어요</button>
          <button class="btn ghost sm" onclick="wishExtend('${w.id}')">${COOL_DAYS}일 더</button>

          <button class="btn ghost sm" onclick="delWish('${w.id}')">삭제</button></div>`}

/* ═════════ v6-2: 수입원 분석 ═════════ */
function incomeBreakdown(months=6){
  const now=new Date(), byCat={}, byMonth={};
  for(let i=0;i<months;i++){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const ym=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
    let mSum=0;
    monthTx(ym).filter(t=>t.type==='income').forEach(t=>{
      byCat[t.cat]=(byCat[t.cat]||0)+t.amount; mSum+=t.amount;
    });
    byMonth[ym]=mSum;
  }
  const total=Object.values(byCat).reduce((a,b)=>a+b,0);
  const sorted=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const vals=Object.values(byMonth).filter(v=>v>0);
  const avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
  // 변동성: 표준편차/평균 (낮을수록 안정적)
  const sd=vals.length>1?Math.sqrt(vals.reduce((s,v)=>s+Math.pow(v-avg,2),0)/vals.length):0;
  const cv=avg>0?sd/avg:0;
  // 의존도: 최대 수입원 비중
  const dep=total>0&&sorted.length?sorted[0][1]/total:0;
  return{byCat:sorted,byMonth,total,avg,cv,dep,months};
}
function renderIncome(){
  const el=$('income-card'); if(!el)return;
  const b=incomeBreakdown(6);
  if(!b.total){el.innerHTML=`<div style="font-weight:800;font-size:.92rem">💰 수입원 분석</div><div class="empty">수입을 기록하면 수입원 구성과<br>안정성을 분석해드려요</div>`;return}

/* ═════════ v6-3: Health Score 히스토리 ═════════ */
function recordScore(){ // 지난달 점수를 확정 저장
  const pm=prevYM(thisYM());
  S.scores=S.scores||{};
  if(!S.scores[pm]&&monthTx(pm).length>0){
    const hs=healthScore(pm);
    S.scores[pm]={total:hs.total,parts:hs.parts};
    save();
  }
}
function scoreHistory(n=6){
  S.scores=S.scores||{};
  const out=[], now=new Date();
  for(let i=n-1;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const ym=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
    const saved=S.scores[ym];
    const live=(ym===thisYM())?healthScore(ym):null;
    const has=monthTx(ym).length>0;
    out.push({ym,score:saved?saved.total:(live?live.total:null),has});
  }
  return out;
}
function renderScoreHistory(){
  const el=$('score-hist'); if(!el)return;
  const h=scoreHistory(6).filter(x=>x.score!==null&&x.has);
  if(h.length<2){el.innerHTML='';return}
  const W=440,H=120,P=26;
  const x=i=>P+i*(W-P-14)/Math.max(1,h.length-1);
  const y=v=>H-24-(v/100)*(H-40);
  const line=h.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.score).toFixed(1)}`).join(' ');
  const last=h[h.length-1], prev=h[h.length-2];
  const diff=last.score-prev.score;
  el.innerHTML=`<div class="divider"></div>
    <div class="row" style="margin-bottom:4px"><span style="font-size:.82rem;font-weight:700">점수 추이</span>
      <span class="tiny num ${diff>=0?'pos':'neg'}">${diff>=0?'▲':'▼'} 전월 대비 ${Math.abs(diff)}점</span></div>
    <svg class="svg-chart" viewBox="0 0 ${W} ${H}">
      <line x1="${P}" y1="${y(80)}" x2="${W-10}" y2="${y(80)}" stroke="var(--green)" stroke-width="1" stroke-dasharray="3 3" opacity=".5"/>
      <text x="${W-12}" y="${y(80)-4}" text-anchor="end" font-size="9" fill="var(--green)">80 (우수)</text>
      <path d="${line}" fill="none" stroke="var(--terra)" stroke-width="2.5" stroke-linecap="round"/>
      ${h.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.score)}" r="3.6" fill="var(--terra)" stroke="#fff" stroke-width="1.5"/>
        <text x="${x(i)}" y="${y(p.score)-9}" text-anchor="middle" font-size="10" font-weight="800" fill="var(--ink)">${p.score}</text>
        <text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="9" fill="var(--faint)">${+p.ym.slice(5)}월</text>`).join('')}
    </svg>`;
}

/* ═════════ v6-4: 소비 성향 프로파일 ═════════ */
function spendProfile(){
  const now=new Date(); let exp=[], fixedSum=0, varSum=0, weekend=0, weekday=0, late=0;
  for(let i=0;i<3;i++){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const ym=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
    monthTx(ym).filter(t=>t.type==='expense').forEach(t=>{
      exp.push(t);
      if(t.fixedId)fixedSum+=t.amount; else varSum+=t.amount;
      const dow=new Date(t.date).getDay();
      if(dow===0||dow===5||dow===6)weekend+=t.amount; else weekday+=t.amount;
    });
  }
  if(exp.length<5)return null;
  const total=fixedSum+varSum;
  // 위시리스트 자제율
  const decided=S.wish.filter(w=>w.status!=='open');
  const skipRate=decided.length?decided.filter(w=>w.status==='skipped').length/decided.length:null;
  // 소액 다건 vs 고액 소수
  const avg=total/exp.length;
  const bigCount=exp.filter(t=>t.amount>=avg*3).length;
  const bigShare=exp.filter(t=>t.amount>=avg*3).reduce((s,t)=>s+t.amount,0)/total;
  // 예산 준수율
  const budKeys=Object.keys(S.budgets||{}).filter(k=>k<thisYM());
  const kept=budKeys.filter(k=>totals(k).exp<=S.budgets[k].total).length;
  const budRate=budKeys.length?kept/budKeys.length:null;
  const traits=[];
  traits.push(fixedSum/total>=0.4
    ?{emo:'🔁',t:'고정비 중심형',d:`지출의 ${Math.round(fixedSum/total*100)}%가 고정비예요. 구독·통신비를 한 번 정리하면 효과가 커요.`}
    :{emo:'🎚️',t:'변동비 중심형',d:`지출의 ${Math.round(varSum/total*100)}%가 변동비라 마음먹으면 조절 여지가 커요.`});
  traits.push(weekend/(weekend+weekday)>=0.5
    ?{emo:'🌆',t:'주말 집중형',d:`지출의 ${Math.round(weekend/(weekend+weekday)*100)}%가 금~일에 몰려요. 주말 예산을 따로 잡아보세요.`}
    :{emo:'📅',t:'평일 분산형',d:'지출이 요일에 고르게 퍼져 있어요. 일상 소비가 주를 이뤄요.'});
  traits.push(bigShare>=0.5
    ?{emo:'💎',t:'큰 지출형',d:`상위 ${bigCount}건이 전체의 ${Math.round(bigShare*100)}%예요. What-if로 큰 결제를 미리 점검하면 좋아요.`}
    :{emo:'🐜',t:'소액 다건형',d:'작은 지출이 쌓이는 유형이에요. 카페·편의점 같은 반복 지출을 줄이면 체감이 커요.'});
  if(skipRate!==null)traits.push(skipRate>=0.5
    ?{emo:'🧘',t:'자제력 좋음',d:`위시리스트에 담은 것 중 ${Math.round(skipRate*100)}%를 참았어요. 쿨다운이 잘 통하고 있어요.`}
    :{emo:'🛍️',t:'구매 결심형',d:`담은 것 중 ${Math.round((1-skipRate)*100)}%를 실제로 샀어요. 쿨다운을 더 길게 잡아보는 것도 방법이에요.`});
  if(budRate!==null)traits.push(budRate>=0.6
    ?{emo:'🎯',t:'계획 준수형',d:`예산을 세운 달 중 ${Math.round(budRate*100)}%를 지켰어요.`}
    :{emo:'🌀',t:'계획 이탈형',d:'예산을 자주 넘겨요. 목표를 조금 낮춰 잡으면 성공 경험이 쌓여요.'});
  return{traits,total,count:exp.length};
}
function renderProfile(){
  const el=$('profile-card'); if(!el)return;
  const p=spendProfile();
  if(!p){el.innerHTML=`<div style="font-weight:800;font-size:.92rem">🧬 소비 성향</div><div class="empty">3개월치 지출이 쌓이면<br>소비 성향을 분석해드려요</div>`;return}

      <span class="a-txt"><b>${t.t}</b><br><span class="tiny">${t.d}</span></span></div>`).join('')}`;

function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`claude-flow-${todayStr()}.json`;a.click();

function importData(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    const backup=JSON.parse(JSON.stringify(S)); // 현재 상태 스냅샷
    try{
      const d=JSON.parse(r.result);
      if(!d||typeof d!=='object'||Array.isArray(d))throw new Error('형식 오류');
      if(!Array.isArray(d.tx)||!Array.isArray(d.accounts))throw new Error('내역/계좌 데이터가 없어요');
      ['cards','fixed','invLogs','debts','wish','recon','goals'].forEach(k=>{
        if(d[k]!==undefined&&!Array.isArray(d[k]))throw new Error(k+' 형식 오류');
      });
      ['reports','budgets','briefs','scores','settings'].forEach(k=>{
        if(d[k]!==undefined&&(typeof d[k]!=='object'||Array.isArray(d[k])))throw new Error(k+' 형식 오류');
      });
      const staged=JSON.parse(JSON.stringify(d)); // 원본 분리
      const prev=S; S=staged;
      try{ migrate(); totalAssets(); }        // 마이그레이션·집계 시험 실행
      catch(err){ S=prev; throw new Error('데이터 구조가 손상됐어요') }
      const n=S.tx.length, a=S.accounts.length;
      save(); closeModal(); renderAll();
      toast(`가져왔어요 · 내역 ${n}건 · 계좌 ${a}개`);
    }catch(e){
      S=backup; migrate();                     // 원상 복구 보장
      toast('가져오지 못했어요 — '+(e.message||'올바른 백업 파일이 아니에요'));
    }
  };
  r.readAsText(f);
}
