function ilSetMode(m){
  ilMode=m;
  const rw=$('il-rate-w'), fw=$('il-fx-w');
  if(rw)rw.style.display=(m==='rate')?'':'none';
  if(fw)fw.style.display=(m==='fx')?'':'none';
  document.querySelectorAll('#il-seg button').forEach((b,i)=>b.classList.toggle('on',(i===0)===(m==='rate')));
  ilHint();
}
// 화면에 쓰는 계산값 (저장 때도 같은 함수를 써서 표시와 저장이 어긋나지 않게)
function ilCalc(accId){
  const a=accById(accId||ilAcc);
  const isFx=!!(a&&a.cur&&a.cur!=='KRW');
  const krw=Math.round(numVal('il-krw'));
  if(!isFx)return {isFx:false,krw,amount:krw,cur:'KRW',rate:1};
  let rate,amount;
  if(ilMode==='fx'){
    amount=+val('il-fxamt')||0;
    rate=amount>0?krw/amount:0;
  }else{
    rate=+val('il-fx')||0;
    amount=rate>0?krw/rate:0;
  }
  return {isFx:true,krw,cur:a.cur,rate,amount:Math.round(amount*100)/100};
}
function ilHint(){
  const h=$('il-hint'); if(!h)return;
  const c=ilCalc(ilAcc);
  const sym=(CURS[c.cur]||{}).sym||'₩';
  if(!c.isFx){ h.innerHTML=c.krw>0?`${fmt(c.krw)}을 납입해요.`:''; return; }
  if(c.krw<=0){ h.innerHTML='보낸 금액을 입력해주세요.'; return; }
  if(!(c.rate>0)||!(c.amount>0)){ h.innerHTML=(ilMode==='fx')?'받은 금액을 입력해주세요.':'환율을 입력해주세요.'; return; }
  const acc=accById(ilAcc), fx=acc?invFxRate(acc):null;
  // 우대가 설정돼 있으면 '우대 덕에 얼마를 더 받았는지'를 같이 보여준다
  let gain='';
  if(fx&&fx.spread>0&&fx.on&&fx.applied>0&&c.rate>0){
    const noPrefAmt=c.krw/fx.noPref;
    const more=c.amount-noPrefAmt;
    if(more>0.004)gain=`<br><span class="pos">우대 ${fx.applied}% 덕에 ${sym}${(Math.round(more*100)/100).toFixed(2)} 더 받았어요</span>`;
  }
  h.innerHTML=(ilMode==='fx')
    ? `💱 ${fmt(c.krw)} → <b class="num">${sym}${c.amount.toLocaleString(undefined,{minimumFractionDigits:2})}</b><br>적용 환율 <b class="num">${Math.round(c.rate).toLocaleString()}원</b> / 1${sym} <span style="color:var(--faint)">(수수료 포함)</span>`
    : `💱 ${fmt(c.krw)} → 받는 금액 <b class="num">${sym}${c.amount.toLocaleString(undefined,{minimumFractionDigits:2})}</b>${gain}`;
}
function saveInvLog(accId){
  const d=val('il-date');
  const fromId=val('il-from');
  const c=ilCalc(accId);
  if(!d)return toast('날짜를 확인해주세요');
  if(!fromId)return toast('출금 계좌를 선택해주세요');
  const from=accById(fromId);
  if(!from)return toast('출금 계좌를 찾을 수 없어요');
  if(!checkAmt(c.krw,'보낸 금액'))return;
  if(c.isFx){
    if(!(c.rate>0))return toast(ilMode==='fx'?'받은 금액을 확인해주세요':'환율을 확인해주세요');
    if(!(c.amount>0))return toast('환전 금액을 확인해주세요');
  }
  if(accKRW(from)<c.krw)return toast(`${from.name} 잔액이 부족해요 (${fmtCur(from.balance,from.cur)})`);
  const a=accById(accId);
  const fxAt=c.isFx?c.rate:1;
  const t={id:uid(),type:'transfer',date:d,amount:c.krw,fromId,toId:accId,
    memo:`${a?a.name:'투자'} 납입`,invLogId:null,fxAt};
  const log={id:uid(),accountId:accId,date:d,amount:c.amount,cur:c.cur,fxAt,txId:t.id};
  t.invLogId=log.id;
  S.tx.push(t); applyBalance(t,1);                   // 출금계좌 −원화, 투자계좌 +외화(환율 적용)
  S.invLogs.push(log);                               // 원금(DCA) 기록
  save();closeModal();renderAll();
  const sym=(CURS[c.cur]||{}).sym||'₩';
  toast(c.isFx?`${fmt(c.krw)} → ${sym}${c.amount.toLocaleString()} 납입했어요`
              :`${from.name} → ${a?a.name:'투자'} ${fmt(c.krw)} 납입했어요`);
}
/* 달러 투자: 주가 손익과 환율 손익을 분리 */
function fxBreakdown(){
  const usd=S.invLogs.filter(l=>l.cur==='USD');
  if(!usd.length)return null;
  const usdIn=usd.reduce((s,l)=>s+l.amount,0);                        // 총 매수 달러
  const krwIn=usd.reduce((s,l)=>s+toKRW(l.amount,'USD',l.fxAt),0);    // 실제 투입 원화
  const avgRate=usdIn>0?krwIn/usdIn:0;                                // 평균 매입환율
  const now=fxRate();
  const usdVal=S.accounts.filter(a=>a.type==='invest'&&a.cur==='USD').reduce((s,a)=>s+a.balance,0);
  if(!usdVal)return{usdIn,krwIn,avgRate,now,fxOnly:Math.round(usdIn*(now-avgRate)),usdVal:0,pricePL:0,fxPL:0,total:0};
  // 주가손익 = (평가$ − 매수$) × 현재환율 / 환차손익 = 매수$ × (현재환율 − 평균매입환율)
  const pricePL=Math.round((usdVal-usdIn)*now);
  const fxPL=Math.round(usdIn*(now-avgRate));
  return{usdIn,krwIn,avgRate,now,usdVal,pricePL,fxPL,total:pricePL+fxPL};
}
function fxBreak(){
  const f=fxBreakdown();
  if(!f||!f.usdVal)return '';
  const row=(label,v,sub)=>`<div class="row" style="padding:4px 0">
    <span style="font-size:.8rem">${label}${sub?` <span class="tiny">${sub}</span>`:''}</span>
    <b class="num ${v>=0?'pos':'neg'}" style="font-size:.82rem">${v>=0?'+':'−'}${fmt(Math.abs(v))}</b></div>`;
  return `<div style="background:var(--bg);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:10px">
    <div class="row" style="margin-bottom:5px"><b style="font-size:.8rem">💵 달러 투자 손익 분해</b>
      <span class="tiny num">평균 매입 ${Math.round(f.avgRate).toLocaleString()}원 → 현재 ${f.now.toLocaleString()}원</span></div>
    ${row('주가 손익',f.pricePL,`($${Math.round(f.usdVal-f.usdIn).toLocaleString()} × ${f.now.toLocaleString()}원)`)}
    ${row('환율 손익',f.fxPL,`($${Math.round(f.usdIn).toLocaleString()} × ${f.now>=f.avgRate?'+':'−'}${Math.abs(Math.round(f.now-f.avgRate)).toLocaleString()}원)`)}
    <div class="divider" style="margin:6px 0"></div>
    ${row('합계',f.total)}
    <div class="tiny" style="margin-top:4px">${Math.abs(f.fxPL)>Math.abs(f.pricePL)
      ? '⚠️ 지금은 <b>환율 변동</b>이 수익에 더 큰 영향을 주고 있어요.'
      : '주가 변동이 수익의 주된 요인이에요.'}</div>
  </div>`;
}
function renderDCA(){
  const el=$('dca-card');
  const logs=[...S.invLogs].sort((a,b)=>a.date.localeCompare(b.date));
  if(!logs.length){el.innerHTML=`<div class="row"><div style="font-weight:800;font-size:.92rem;margin-bottom:6px">DCA 적립 차트</div><span style="font-size:.78rem;cursor:pointer;color:var(--terra);font-weight:600" onclick="openDcaTargetModal()">목표 설정</span></div><div class="empty">투자 자산에서 납입을 기록하면<br>적립 곡선이 그려져요 📈</div>`;return}
  // 월별 누적 납입
  const byM={};logs.forEach(l=>byM[ymOf(l.date)]=(byM[ymOf(l.date)]||0)+toKRW(l.amount,l.cur,l.fxAt));
  const months=Object.keys(byM).sort();
  let cum=0;const pts=months.map(m=>{cum+=byM[m];return{m,cum,put:byM[m]}});
  const curVal=S.accounts.filter(a=>a.type==='invest').reduce((s,a)=>s+accKRW(a),0);
  const W=440,H=170,P=30;
  const dcaM=S.settings.dcaM||0;
  const maxY=Math.max(cum,curVal,dcaM*pts.length)*1.12;
  const x=i=>P+ i*(W-P-12)/Math.max(1,pts.length-1);
  const y=v=>H-24-(v/maxY)*(H-44);
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.cum).toFixed(1)}`).join(' ');
  const area=line+` L${x(pts.length-1).toFixed(1)},${H-24} L${x(0).toFixed(1)},${H-24} Z`;
  const pl=curVal-cum, plr=cum>0?pl/cum*100:0;
  const goalLine=dcaM>0?pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(dcaM*(i+1)).toFixed(1)}`).join(' '):'';
  const goalGap=cum-dcaM*pts.length;
  el.innerHTML=`
    <div class="row" style="margin-bottom:4px"><div style="font-weight:800;font-size:.92rem">DCA 적립 차트 <span style="font-size:.76rem;cursor:pointer;color:var(--terra);font-weight:600" onclick="openDcaTargetModal()">목표 설정</span></div>
    <div class="tiny num">누적 납입 ${fmtK(cum)}원 → 평가 ${fmtK(curVal)}원</div></div>
    <div class="num" style="font-size:.85rem;margin-bottom:8px">수익 <b class="${pl>=0?'pos':'neg'}">${pl>=0?'+':''}${fmt(pl)} (${plr>=0?'+':''}${plr.toFixed(1)}%)</b></div>
    ${fxBreak()}
    <svg class="svg-chart" viewBox="0 0 ${W} ${H}">
      <line x1="${P}" y1="${H-24}" x2="${W-10}" y2="${H-24}" stroke="var(--line2)" stroke-width="1"/>
      <line x1="${P}" y1="${y(curVal)}" x2="${W-10}" y2="${y(curVal)}" stroke="var(--green)" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="${W-12}" y="${y(curVal)-5}" text-anchor="end" font-size="10" fill="var(--green)" font-weight="700">현재 평가액</text>
      ${goalLine?`<path d="${goalLine}" fill="none" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="${x(0)+3}" y="${y(dcaM)-6}" font-size="10" fill="var(--gold)" font-weight="700">목표 페이스</text>`:''}
      <path d="${area}" fill="rgba(217,119,87,.12)"/>
      <path d="${line}" fill="none" stroke="var(--terra)" stroke-width="2.5" stroke-linecap="round"/>
      ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.cum)}" r="3.4" fill="var(--terra)" stroke="var(--surface)" stroke-width="1.5"/>`).join('')}
      ${pts.map((p,i)=>(pts.length<=8||i%2===0||i===pts.length-1)?`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="var(--faint)">${p.m.slice(2).replace('-','.')}</text>`:'').join('')}
    </svg>
    <div class="tiny" style="margin-top:4px"><span class="legend-dot" style="background:var(--terra)"></span>누적 납입액 곡선${dcaM?` · 목표(월 ${fmtK(dcaM)}원) 대비 <b class="${goalGap>=0?'pos':'neg'}">${goalGap>=0?'+':'−'}${fmtK(Math.abs(goalGap))}원</b>`:' — 꾸준함이 그려지고 있어요'}</div>`;
}

  if(id){ Object.assign(S.fixed.find(x=>x.id===id),data); commit('저장했어요'); return; }

function delFixed(id){

  askDel(`이 고정 ${f&&(f.kind==='income')?'수입':'지출'}을 삭제할까요?`,()=>{S.fixed=S.fixed.filter(x=>x.id!==id);commit()});

/* 해당 월(ym)에 이 고정 항목이 유효한가 — from/to 비면 무기한 */
/* 해당 월에 이 항목이 유효한가 — 기간이 그 달과 조금이라도 겹치면 유효 */
function fixedActiveOn(f,ym){
  if(f.active===false)return false;
  const mStart=`${ym}-01`, mEnd=`${ym}-${pad(daysIn(ym))}`;
  if(f.from&&f.from>mEnd)return false;   // 시작이 이 달보다 뒤
  if(f.to&&f.to<mStart)return false;     // 종료가 이 달보다 앞
  return true;
}
/* 자동 기록용: 실제 그 날짜에 기록해도 되는지 (기간을 하루 단위로 엄격 판정) */
function fixedDueOn(f,ym,day){
  if(!fixedActiveOn(f,ym))return false;
  const d=`${ym}-${pad(f.day||1)}`;
  if(f.from&&d<f.from)return false;
  if(f.to&&d>f.to)return false;
  return day>=f.day;
}
const fixedOf=kind=>S.fixed.filter(f=>(f.kind||'expense')===kind);
function fixedMonthly(kind,ym){
  return fixedOf(kind).filter(f=>fixedActiveOn(f,ym||thisYM())).reduce((s,f)=>s+f.amount,0);
}
function fixedPeriodLabel(f){
  if(!f.from&&!f.to)return '무기한';
  const s=f.from?f.from.slice(2).replace(/-/g,'.'):'시작일 없음';
  const e=f.to?f.to.slice(2).replace(/-/g,'.'):'무기한';
  return `${s} ~ ${e}`;
}
function fixedEndsSoon(f){ // 종료 임박(30일 이내)
  if(!f.to)return 0;
  const n=Math.ceil((new Date(f.to)-new Date(todayStr()))/86400000);
  return (n>=0&&n<=30)?n:0;
}
function autoApplyFixed(){ // 결제일 지난 고정 항목 자동 기록 (지출·수입 모두)
  const ym=thisYM(), day=new Date().getDate();
  let ne=0,ni=0;
  S.fixed.forEach(f=>{
    if(!fixedDueOn(f,ym,day))return;
    if(S.tx.some(t=>t.fixedId===f.id&&ymOf(t.date)===ym))return;
    const isInc=(f.kind||'expense')==='income';
    const t={id:uid(),type:isInc?'income':'expense',date:`${ym}-${pad(f.day)}`,amount:f.amount,
      cat:f.cat,memo:f.name,payKind:f.payKind,payId:f.payId,fixedId:f.id,defended:!isInc,fxAt:fxRate()};
    if(!isInc){t.months=1;t.paidPortions=0}
    S.tx.push(t);applyBalance(t,1);
    isInc?ni++:ne++;
  });
  if(ne||ni){save();toast(`고정 ${ne?`지출 ${ne}건`:''}${ne&&ni?' · ':''}${ni?`수입 ${ni}건`:''}을 자동 기록했어요`)}
}

/* ═════════ 주택청약 ═════════ */
// 이 청약통장으로 들어간 납입 내역(자동납입 이체 + 수동 이체)을 월별로 집계
function housingPayments(a){
  const byM={};
  S.tx.filter(t=>t.type==='transfer'&&t.toId===a.id).forEach(t=>{
    byM[ymOf(t.date)]=(byM[ymOf(t.date)]||0)+t.amount;
  });
  return byM;                                   // { '2026-07': 100000, … }
}
function housingStats(a){
  const cap=a.recogCap||HOUSING_DEF.recogCap;   // 월 인정 한도
  const byM=housingPayments(a);
  const months=Object.keys(byM).sort();
  // 납입 회차 = 납입한 달 수 (앱 기록 기준) + 가입 전 회차 보정값
  const rounds=(a.roundsBase||0)+months.length;
  // 인정 납입액 = 매달 min(납입액, 한도) 합
  const recognized=months.reduce((s,m)=>s+Math.min(byM[m],cap),0)+(a.recogBase||0);
  // 올해 납입액 (소득공제 대상)
  const yr=todayStr().slice(0,4);
  const thisYear=months.filter(m=>m.startsWith(yr)).reduce((s,m)=>s+byM[m],0);
  const dCap=a.deductCap||HOUSING_DEF.deductCap;
  const deductBase=Math.min(thisYear,dCap);
  // 가입 기간(개월)
  let ageM=0;
  if(a.joinDate){
    const [jy,jm]=a.joinDate.split('-').map(Number);
    const now=new Date(); ageM=Math.max(0,(now.getFullYear()-jy)*12+(now.getMonth()+1-jm));
  }
  return {cap,byM,months,rounds,recognized,thisYear,dCap,deductBase,
    deductAmt:Math.round(deductBase*(a.deductRate||HOUSING_DEF.deductRate)),
    ageM, paidThisMonth:byM[thisYM()]||0};
}
// 가입일로부터 예상 납입 회차 계산 (가입 시 납입이 1회차)
function houRoundsFromJoin(join){
  if(!join)return 0;
  const [jy,jm]=join.split('-').map(Number);
  if(!jy||!jm)return 0;
  const now=new Date();
  const months=(now.getFullYear()-jy)*12+(now.getMonth()+1-jm);
  return Math.max(1,months+1);        // 가입한 달이 1회차
}
function houEstimate(){
  const el=$('ac-hou-hint'); if(!el)return;
  const join=val('ac-join');
  if(!join){el.innerHTML='';return}
  const est=houRoundsFromJoin(join);
  const cur=$('ac-rbase')?(Math.round(numVal('ac-rbase'))||0):0;
  el.innerHTML=`💡 가입일 기준 <b>${est}회차</b>까지 납입했을 수 있어요 (가입 시 납입이 1회차).
    ${cur===est?'<span class="pos">✓ 반영됨</span>':`<span style="color:var(--terra);cursor:pointer;font-weight:700" onclick="houFill(${est})">이 값으로 채우기</span>`}`;
}
function houFill(est){
  const rb=$('ac-rbase'); if(rb)rb.value=est;
  const cap=(Math.round(numVal('ac-recog'))||HOUSING_DEF.recogCap);
  const rc=$('ac-recbase');
  if(rc&&!(+rc.value)){
    const bal=numVal('ac-bal');
    rc.value=Math.min(Math.round(bal), est*cap);   // 잔액과 한도 중 작은 쪽으로 추정
  }
  const det=document.querySelector('details.acc'); if(det)det.open=true;
  houEstimate();
  toast('가입일 기준으로 채웠어요 — 실제와 다르면 수정하세요');
}

/* 적금 자동납입: 납입일이 지나면 출금계좌 → 적금계좌로 이체 기록 */
function autoApplySaving(){
  const ym=thisYM(), day=new Date().getDate();
  let n=0, skipped=[];
  S.accounts.filter(a=>(a.type==='saving'||a.type==='housing')&&a.payDay>0&&a.monthly>0&&a.payFrom).forEach(a=>{
    if(a.payDay>day)return;                                        // 아직 납입일 전
    if(a.payFrom_start&&`${ym}-${pad(a.payDay)}`<a.payFrom_start)return; // 설정 전의 지난 납입일은 건너뜀
    if(a.maturity&&a.maturity<`${ym}-${pad(a.payDay)}`)return;      // 만기 지남
    if(S.tx.some(t=>t.savingId===a.id&&ymOf(t.date)===ym))return;   // 이번 달 이미 납입
    const from=accById(a.payFrom);
    if(!from){skipped.push(`${a.name}(출금계좌 없음)`);return}       // 계좌가 삭제된 경우
    if(accKRW(from)<a.monthly){skipped.push(`${a.name}(잔액 부족)`);return}
    const t={id:uid(),type:'transfer',date:`${ym}-${pad(a.payDay)}`,amount:a.monthly,
      fromId:from.id,toId:a.id,memo:`${a.name} 자동납입`,savingId:a.id,fxAt:fxRate()};
    S.tx.push(t);applyBalance(t,1);n++;
  });
  if(n||skipped.length){
    save();
    if(n)toast(`적금 ${n}건을 자동 납입했어요`);
    else if(skipped.length)toast(`적금 자동납입 보류 — ${skipped[0]}`);
  }
}

function renderPerfBanner(){
  const el=$('perf-banner'); el.innerHTML='';
  const ym=thisYM(), day=new Date().getDate(), dim=daysIn(ym), left=dim-day;
  if(left>7)return;
  for(const c of S.cards){
    const tiers=c.tiers||[]; if(!tiers.length)continue;
    const perf=perfSpend(c,ym), gap=tiers[0]-perf;
    if(gap<=0)continue;
    if(day>0 && perf/day*dim>=tiers[0])continue; // 페이스상 달성 예상이면 조용히
    const appliedIds=new Set(monthTx(ym).filter(t=>t.fixedId).map(t=>t.fixedId));
    const cand=fixedOf('expense').filter(f=>fixedActiveOn(f,thisYM())&&!appliedIds.has(f.id)&&!(f.payKind==='card'&&f.payId===c.id));
    const candSum=cand.reduce((s,f)=>s+f.amount,0);
    const rec=candSum>0?` 남은 고정비 ${cand.slice(0,2).map(f=>esc(f.name)).join('·')} 등 ${fmtK(candSum)}원을 이 카드로 돌리는 것도 방법이에요.`:'';
    el.innerHTML=`<div class="banner" style="background:var(--terra-soft);border-color:var(--terra-line)"><div class="b-main">💳 <b>${esc(c.name)}</b> 실적 마감 D-${left} — <b class="num">${fmt(gap)}</b> 남았어요.${rec}</div><button class="btn dark sm" onclick="switchView('cards')">보기</button></div>`;
    break;
  }
}
/* ── 카드 모달 (draft 기반) ── */
let cardDraft=null;
const parseTiers=s=>String(s||'').split(',').map(x=>Math.round(+x.replace(/[^0-9]/g,''))||0).filter(x=>x>0).sort((a,b)=>a-b);
function settleCard(id){
  const c=cardById(id), pend=creditPending(c);
  if(pend<=0)return;
  // 이번 정산에 포함되는 금액(월별)에 비례한 할인만 계산 → 이중계상 방지
  let disc=0; const _byM={};
  S.tx.forEach(t=>{
    if(t.type!=='expense'||t.payKind!=='card'||t.payId!==c.id)return;
    const np=duePortions(t), op=t.paidPortions||0;
    if(np<=op)return;
    let amt=0; for(let k=op;k<np;k++)amt+=portionAmt(t,k);
    _byM[ymOf(t.date)]=(_byM[ymOf(t.date)]||0)+amt;
  });
  Object.entries(_byM).forEach(([m,amt])=>{disc+=discOfAmount(c,m,amt)});
  disc=Math.min(pend,disc);
  const net=pend-disc;
  const a=accById(c.accountId);
  const msg=`${c.name} 결제 처리할까요?\n\n청구액 ${fmt(pend)}`
    +(disc>0?`\n청구할인 −${fmt(disc)}\n실제 출금 ${fmt(net)}`:'')
    +`\n\n${a?a.name+' 잔액에서 차감됩니다.':'연결 계좌가 없어 기록만 됩니다.'}`;
  if(!confirm(msg))return;
  if(a)applyToAcc(a,net,-1);
  // 청구할인은 별도 내역으로 남겨 지출 통계에 반영
  if(disc>0){
    S.tx.push({id:uid(),type:'discount',date:todayStr(),amount:disc,cat:'청구할인',
      memo:`${c.name} 청구할인`,payKind:'card',payId:c.id,cardId:c.id,fxAt:fxRate(),defended:true});
  }
  S.tx.forEach(t=>{
    if(t.type!=='expense'||t.payKind!=='card'||t.payId!==c.id)return;
    t.paidPortions=duePortions(t);
  });
  c.lastSettled=todayStr();
  commit(disc>0?`결제 처리 · 할인 ${fmt(disc)} 반영`:'결제 처리했어요');
}

/* ═════════ 선결제 ═════════
 * 청구일이 오기 전에 미리 갚는 기능. 회계는 정기 결제(settleCard)와 똑같이 하되
 * 대상 거래를 골라서 갚을 수 있다 — 정기 결제는 미결제 전액이 대상이다.
 *
 * 카드사의 '자동 선결제'는 대개 **미결제 잔액이 기준액 이상이면 지정 요일에 전액 출금**
 * 하는 형태라 그대로 옮겼다. 선결제하면 잔액이 0이 되므로, 결과적으로 '그 주에 쓴 만큼'을
 * 매주 갚는 동작이 된다. */
const WEEKDAYS=['일','월','화','수','목','금','토'];
const defAutoPre=()=>({on:false,weekday:5,min:300000,lastRun:''});

// 아직 안 갚은(청구됐지만 미납) 카드 거래 — 최신순
function prepayables(c){
  if(!c||c.type!=='credit')return [];
  return S.tx.filter(t=>t.type==='expense'&&t.payKind==='card'&&t.payId===c.id&&pendingOfTx(t)>0)
    .sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
}
// 이 거래들을 갚을 때 실제로 나가는 돈 (청구할인은 월별 비례 배분 — settleCard와 같은 회계)
function prepayAmount(c,list){
  const byM={}; let gross=0;
  (list||[]).forEach(t=>{
    const np=duePortions(t), op=t.paidPortions||0;
    let amt=0; for(let k=op;k<np;k++)amt+=portionAmt(t,k);
    if(amt<=0)return;
    gross+=amt; byM[ymOf(t.date)]=(byM[ymOf(t.date)]||0)+amt;
  });
  let disc=0; Object.entries(byM).forEach(([m,amt])=>{disc+=discOfAmount(c,m,amt)});
  disc=Math.min(gross,Math.round(disc));
  return {gross,disc,net:gross-disc};
}
/* 실제 처리. date 를 넘기면 그 날짜로 기록한다
   (자동 선결제는 앱을 늦게 열어도 '지정 요일'에 나간 것으로 남겨야 하므로) */
function applyPrepay(c,list,how,date){
  const amt=prepayAmount(c,list);
  if(amt.gross<=0)return null;
  const d=date||todayStr();
  const a=accById(c.accountId);
  if(a)applyToAcc(a,amt.net,-1);
  // 청구할인은 정기 결제와 마찬가지로 별도 내역으로 남겨 지출 통계에 반영
  if(amt.disc>0){
    S.tx.push({id:uid(),type:'discount',date:d,amount:amt.disc,cat:'청구할인',
      memo:`${c.name} 청구할인 (선결제)`,payKind:'card',payId:c.id,cardId:c.id,fxAt:fxRate(),defended:true});
  }
  list.forEach(t=>{t.paidPortions=duePortions(t)});
  c.prepays=(c.prepays||[]).concat([{id:uid(),date:d,gross:amt.gross,disc:amt.disc,net:amt.net,
    n:list.length,how:how||'manual'}]).slice(-60);
  return amt;
}
/* 이번 주의 지정 요일 날짜 (일요일 시작) */
function weekdayDate(wd){
  return addDays(todayStr(),(Math.max(0,Math.min(6,+wd||0)))-new Date().getDay());
}
/* 다음 실행 예정일 — 이번 주 몫이 끝났으면 다음 주 */
function nextPrepayDate(c){
  const ap=c.autoPre||defAutoPre(), due=weekdayDate(ap.weekday);
  return (due<todayStr()||(ap.lastRun||'')>=due)?addDays(due,7):due;
}
/* 앱을 열 때 도는 자동 선결제 */
function autoPrepayCards(){
  const today=todayStr();
  const done=[], skipped=[];
  S.cards.forEach(c=>{
    if(c.type!=='credit')return;
    const ap=c.autoPre; if(!ap||!ap.on)return;
    const due=weekdayDate(ap.weekday);
    if(due>today)return;                       // 이번 주 지정 요일이 아직 안 왔다
    if((ap.lastRun||'')>=due)return;           // 이번 주 몫은 이미 처리했다
    const list=prepayables(c), amt=prepayAmount(c,list);
    if(amt.gross<(+ap.min||0)){                // 기준 미달 — 카드사도 이 주는 그냥 넘어간다
      ap.lastRun=due; return;
    }
    const a=accById(c.accountId);
    // 잔액이 모자라면 마이너스를 만들지 않고 보류한다 (lastRun 을 올리지 않아 다음에 다시 시도)
    if(a&&accKRW(a)<amt.net){ skipped.push(`${c.name}(잔액 부족)`); return; }
    applyPrepay(c,list,'auto',due);
    ap.lastRun=due;
    done.push(`${c.name} ${fmtK(amt.net)}원`);
  });
  if(done.length||skipped.length){
    save();
    if(done.length)toast(`자동 선결제 — ${done.join(' · ')}`);
    else toast(`자동 선결제 보류 — ${skipped[0]}`);
  }
}

const addDays=(d,n)=>{const t=new Date(d+'T00:00:00');t.setDate(t.getDate()+n);
  return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`};

/* ═════════ 결제수단 추천 — "이거 어느 카드로 쓸까?" ═════════
 * 적립률만 비교하지 않는다. 남은 월 한도·전월 실적 활성 여부·연속일 달성까지
 * 넣고, '이 결제를 이 카드로 하면 적립이 얼마나 늘어나는지'를 직접 계산한다. */
function cardPick(q){
  const date=q.date||todayStr(), ym=ymOf(date);
  const amount=Math.round(q.amount||0);
  if(!(amount>0)||!S.cards.length)return[];
  const hypo={date,amount,cat:q.cat||'기타',memo:q.memo||'',via:q.via||'',months:1,noPerf:false};
  return S.cards.map(c=>{
    const before=perkEstimates(c,ym), after=perkEstimates(c,ym,hypo);
    const gain=Math.max(0,Math.round(after.reduce((s,e)=>s+e.est,0)-before.reduce((s,e)=>s+e.est,0)));
    const hp=Object.assign({},hypo,{type:'expense',payKind:'card',payId:c.id});
    // 어느 혜택에서 늘었는지 / 한도에 막혀 못 받는 게 있는지
    const from=after.map((e,i)=>({e,p:e.p,d:Math.round(e.est-before[i].est)}))
      .filter(x=>x.d>0).sort((a,b)=>b.d-a.d);
    const blocked=after.map((e,i)=>({e,p:e.p,d:Math.round(e.est-before[i].est)}))
      .filter(x=>x.d<=0&&perkMatch(x.p,hp)&&(x.e.active?x.e.capped:true));
    // 이 결제로 연속일이 채워져 2배가 붙는지
    const streakUp=after.some((e,i)=>(e.p.boost||0)>0&&(e.p.streakDays||0)>1&&e.boostN>before[i].boostN);
    // 전월 실적 진행
    const tiers=c.tiers||[];
    let perf=null;
    if(c.type==='credit'&&tiers.length){
      const cur=perfSpend(c,ym), need=tiers[0];
      if(cur<need)perf={left:need-cur,reach:cur+amount>=need,need};
    }
    return{card:c,gain,from,blocked,perf,streakUp};
  }).sort((a,b)=>b.gain-a.gain);
}
function cardPickReason(r){
  const out=[];
  if(r.from.length){
    const t=r.from[0];
    out.push(`<b>${esc(t.p.name)}</b> ${t.p.kind==='percent'?((t.e.boostN>0&&(t.p.boost||0)>0)?t.p.boost:t.p.value)+'%':'정액'}`);
  }
  r.blocked.slice(0,2).forEach(b=>{
    out.push(b.e.active?`${esc(b.p.name)} 한도 다 참`:`${esc(b.p.name)} 잠김(전월 실적)`);
  });
  if(r.streakUp)out.push(`<span class="pos">⚡ 연속 달성 → 2배 적용</span>`);
  if(r.perf)out.push(r.perf.reach
    ? `<span class="pos">이걸로 전월 실적 ${fmtK(r.perf.need)}원 달성</span>`
    : `실적 ${fmtK(r.perf.left)}원 남음`);
  return out.join(' · ');
}

/* ═════════ 연속 이용 스트릭 ═════════
 * "3일 연속 쓰면 2배" 같은 조건은 하루만 걸러도 처음부터 다시다.
 * 오늘 한 건이면 달성인지 / 이미 끊겼는지를 미리 알려준다. */
function cardStreaks(card,ym){
  const M=ym||thisYM(), today=todayStr(), yst=addDays(today,-1);
  const tiers=card.tiers||[];
  const activeTier=activeTierOf(card,M);
  return(card.perks||[]).filter(p=>(p.boost||0)>0&&(p.streakDays||0)>1).map(p=>{
    const need=(p.tier===undefined?1:p.tier);
    const active=need===0?true:(tiers.length?activeTier>=need:true);
    const set=new Set(S.tx.filter(t=>t.type==='expense'&&t.payKind==='card'&&t.payId===card.id&&perkMatch(p,t))
      .map(t=>t.date));
    const runTo=end=>{let n=0,c=end;while(set.has(c)){n++;c=addDays(c,-1)}return n};
    const rToday=runTo(today), rYst=runTo(yst), N=p.streakDays;
    let state;
    if(rToday>=N)          state='done';       // 오늘 결제분은 이미 2배
    else if(rToday>0)      state='partial';    // 오늘 썼지만 아직 부족
    else if(rYst>=N-1)     state='ready';      // 오늘 한 건이면 달성
    else if(rYst>0)        state='building';
    else                   state='none';
    return{p,active,N,rToday,rYst,state,
           left:state==='partial'?N-rToday:(state==='building'?N-rYst-1:0)};
  });
}
/* 오늘 움직이면 이득인 것만 (홈·카드 화면 알림용) */
function streakActionable(){
  const out=[];
  S.cards.forEach(c=>cardStreaks(c).forEach(s=>{
    if(!s.active)return;
    if(s.state==='ready'||s.state==='building')out.push({c,s});
  }));
  return out.sort((a,b)=>(a.s.state==='ready'?-1:1)-(b.s.state==='ready'?-1:1));
}

function saveCard(){
  syncCardDraft();
  if(!cardDraft.name.trim())return toast('카드 이름을 입력해주세요');
  cardDraft.tiers=parseTiers(cardDraft.tiersText);
  cardDraft.target=cardDraft.tiers[0]||0;
  const {tiersText,...data}=cardDraft;
  if(data.id)Object.assign(cardById(data.id),data);
  else S.cards.push({...data,id:uid()});
  commit('저장했어요');
}
function delCard(id){
  if(S.tx.some(t=>t.payKind==='card'&&t.payId===id)&&!confirm('이 카드로 기록한 내역이 있어요. 그래도 삭제할까요? (내역은 유지됩니다)'))return;
  S.cards=S.cards.filter(c=>c.id!==id);commit();
}

function reportStats(ym){
  const{inc,exp}=totals(ym), p=prevYM(ym), pv=totals(p);
  const saveRate=inc>0?Math.round((inc-exp)/inc*100):0;
  const pSave=pv.inc>0?Math.round((pv.inc-pv.exp)/pv.inc*100):null;
  const top3=catSums(ym).slice(0,3);
  const maxTx=monthTx(ym).filter(t=>t.type==='expense').sort((a,b)=>b.amount-a.amount)[0]||null;
  return{inc,exp,saveRate,top3,maxTx,
    expD:pv.exp>0?(exp-pv.exp)/pv.exp*100:null,
    incD:pv.inc>0?(inc-pv.inc)/pv.inc*100:null,
    saveD:pSave===null?null:saveRate-pSave};
}
function ruleHeadline(st,ym){
  if(st.inc>st.exp&&st.saveRate>=30)return`${+ym.slice(5)}월, 수입의 ${st.saveRate}%를 지켜낸 견실한 한 달`;
  if(st.inc>st.exp)return`${+ym.slice(5)}월은 흑자. 다만 저축률 ${st.saveRate}%는 조금 아쉬워요`;
  if(st.exp>0&&st.inc===0)return`${+ym.slice(5)}월, 수입 기록 없이 ${fmtK(st.exp)}원이 나갔어요`;
  return`${+ym.slice(5)}월은 적자. 새는 곳을 찾아볼 시간이에요`;
}
function ruleCommentary(st){
  const l=[];
  if(st.top3[0])l.push(`가장 큰 지출은 ${st.top3[0][0]}(${fmtK(st.top3[0][1])}원)로 전체의 ${Math.round(st.top3[0][1]/st.exp*100)}%를 차지했어요.`);
  if(st.expD!==null)l.push(st.expD>10?`지출이 전월보다 ${st.expD.toFixed(0)}% 늘었어요. 증가 원인을 TOP 3에서 확인해보세요.`:st.expD<-10?`지출을 전월 대비 ${Math.abs(st.expD).toFixed(0)}% 줄였어요. 좋은 흐름이에요.`:`지출 규모는 전월과 비슷하게 유지됐어요.`);
  if(st.saveRate>=30)l.push(`저축률 ${st.saveRate}%는 사회초년생 권장선(20~30%)을 넘는 훌륭한 수치예요.`);
  else if(st.inc>0)l.push(`저축률은 ${st.saveRate}%예요. 다음 달엔 수입의 20%를 먼저 떼어놓는 '선저축'을 시도해보세요.`);
  if(st.maxTx)l.push(`최대 단일 지출은 '${st.maxTx.memo||st.maxTx.cat}' ${fmtK(st.maxTx.amount)}원이었어요.`);
  return l.join(' ');
}
function ruleTips(st){
  const tips=[];
  if(st.top3[0])tips.push(`${st.top3[0][0]} 예산을 ${fmtK(Math.round(st.top3[0][1]*0.9))}원(−10%)으로 정하고 캘린더로 페이스를 확인하기`);
  if(st.inc>0&&st.saveRate<30)tips.push(`월급날 수입의 ${Math.min(30,st.saveRate+10)}%를 적금·투자 계좌로 자동이체 걸기`);
  tips.push('카드 탭에서 실적 달성 여부를 확인하고, 남은 실적은 고정비로 채우기');
  tips.push('일주일에 한 번 히트맵에서 진한 날을 눌러 그날의 소비를 복기하기');
  return tips.slice(0,3);
}
async function genReport(ym){
  const st=reportStats(ym);
  if(monthTx(ym).length===0)return toast('이 달의 기록이 없어요');
  const btn=$('gen-btn');
  if(btn){btn.disabled=true;btn.textContent='생성 중…'}
  let headline=ruleHeadline(st,ym), aiText=ruleCommentary(st), tips=ruleTips(st), byAI=false, aiFail='';
  if(aiEnabled()){
    try{
      const prompt=`${AI_PERSONA}\n아래 ${ymLabel(ym)} 가계부를 분석해서 JSON으로만 답해. 형식: {"headline":"신문 헤드라인 같은 한 문장(25자 내외)","commentary":"소비 패턴 해설 3~4문장. 구체적 숫자와 항목명 인용","tips":["다음 달 실천 팁1","팁2","팁3"]}
commentary는 2~3개 문단으로 나눠 쓰고 문단 사이를 빈 줄로 띄워. 팁은 반드시 내 데이터에 근거해서 써. 목표·위시리스트가 있으면 언제 달성 가능한지, 카드 실적이 부족하면 얼마나 더 쓰면 되는지처럼 구체적으로.${aiCtx(ym)}
데이터: 수입 ${st.inc}원(전월대비 ${st.incD===null?'비교불가':st.incD.toFixed(0)+'%'}), 지출 ${st.exp}원(전월대비 ${st.expD===null?'비교불가':st.expD.toFixed(0)+'%'}), 저축률 ${st.saveRate}%, 지출TOP3 ${st.top3.map(([c,v])=>`${c} ${v}원`).join(', ')||'없음'}, 최대 단일지출 ${st.maxTx?`${st.maxTx.memo||st.maxTx.cat} ${st.maxTx.amount}원`:'없음'}, 카테고리별 상세 ${JSON.stringify(catSums(ym).slice(0,8))}`;
      const out=await gemini(prompt);
      const j=JSON.parse(out.replace(/```json|```/g,'').trim());
      if(j.headline&&j.commentary&&Array.isArray(j.tips)){headline=j.headline;aiText=j.commentary;tips=j.tips.slice(0,3);byAI=true;clearAIFail()}

/* ═════════ AI 재무 프로필 ═════════
   AI에게 '익명 통계'가 아니라 '이 사람의 재무 상황' 전체를 넘겨 초개인화한다.

  if(wish.length)p.사고싶은것=wish.map(w=>({이름:w.name,가격:w.amount,담은날:w.date}));
  const fx=(S.fixed||[]).filter(f=>f.active!==false);
  if(fx.length)p.매달고정=fx.map(f=>({이름:f.name,금액:f.amount,날짜:f.day+'일',
    구분:(f.kind||'expense')==='income'?'수입':'지출'}));
  const sav=S.accounts.filter(a=>(a.type==='saving'||a.type==='housing')&&a.monthly>0);
  if(sav.length)p.강제저축=sav.map(a=>{
    const o={이름:a.name,종류:a.type==='housing'?'청약':'적금',월납입:a.monthly,잔액:Math.round(a.balance||0)};
    if(a.maturity)o.만기=a.maturity;
    if(a.type==='housing'){try{o.회차=housingStats(a).rounds}catch(e){}}
    return o;});
  if(S.cards.length)p.카드=S.cards.map(c=>{
    let spend=0,got=0,rate=0;
    try{ spend=cardMonthSpend(c.id,M); const pr=pickRate(c,M); got=Math.round(pr.got); rate=pr.rate; }catch(e){}
    const target=c.target||((c.tiers&&c.tiers.length)?Math.min(...c.tiers):0);
    const o={이름:c.name,종류:c.type==='credit'?'신용':'체크',이번달사용:spend,
      예상혜택:got,피킹률:rate.toFixed(2)+'%',혜택:(c.perks||[]).map(k=>`${k.name}(${k.cat})`)};
    if(target){o.실적기준=target; if(spend<target)o.실적부족=target-spend;}
    return o;});
  try{ const recv=debtSum('receivable'), pay=debtSum('payable');
    if(recv||pay)p.돈거래={받을돈:recv,갚을돈:pay}; }catch(e){}
  try{ const sp=spendProfile(); if(sp&&sp.traits)p.소비성향=sp.traits.map(x=>x.t); }catch(e){}
  try{ const hs=healthScore(M); if(hs)p.건강점수={총점:hs.total,세부:hs.parts}; }catch(e){}
  const memo={};
  monthTx(M).filter(x=>x.type==='expense'&&x.memo).forEach(x=>{
    memo[x.memo]=memo[x.memo]||{건수:0,금액:0}; memo[x.memo].건수++; memo[x.memo].금액+=x.amount;});
  const top=Object.entries(memo).sort((a,b)=>b[1].금액-a[1].금액).slice(0,8);
  if(top.length)p.자주쓴곳=top.map(([n,v])=>({곳:n,건수:v.건수,금액:v.금액}));
  return p;
}
const AI_PERSONA=`너는 한국 대학생·사회초년생 전용 재무 코치야. 따뜻하지만 직설적이고, 두루뭉술한 일반론 대신 아래 '내 재무 데이터'의 실제 숫자와 항목명(목표 이름, 카드 이름, 가맹점 등)을 인용해서 말해. 잘하고 있는 건 인정해주고, 바로 실행할 수 있는 다음 행동을 제시해. 데이터에 없는 건 지어내지 마.`;

const AI_FORMAT=`읽기 쉽게 써: 한 문단은 1~2문장으로 짧게 하고 문단 사이는 빈 줄로 띄워. 나열할 내용은 각 줄을 '- '로 시작하는 목록으로. 마크다운 강조(**, ##)는 쓰지 마.`;

/* AI 답변을 문단·목록으로 렌더링 (긴 한 덩어리 텍스트도 읽기 좋게 쪼갬) */
function fmtAI(text){
  let t=String(text||'').replace(/\*\*|__|^#+\s*/gm,'').trim();
  if(!t)return '';
  // 개행이 거의 없으면 문장 2개 단위로 문단을 만들어 준다
  if(!/\n/.test(t)){
    const sents=t.match(/[^.!?。]+[.!?。]+\s*/g)||[t];
    const out=[]; for(let i=0;i<sents.length;i+=2)out.push(sents.slice(i,i+2).join('').trim());
    t=out.join('\n\n');
  }
  const blocks=t.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
  return blocks.map(b=>{
    const lines=b.split('\n').map(x=>x.trim()).filter(Boolean);
    const bullet=x=>/^[-•*·]\s*/.test(x);
    // '이번 달에 할 일:' 처럼 머리말 뒤에 목록이 오는 경우가 흔하다.
    // 예전에는 모든 줄이 '-' 로 시작해야만 목록으로 봐서, 머리말이 있으면 통째로 문단이 됐다.
    const i0=lines.findIndex(bullet);
    if(i0>=0&&lines.slice(i0).every(bullet)&&lines.length-i0>=1){
      const head=lines.slice(0,i0), items=lines.slice(i0);
      return (head.length?`<p style="margin:0 0 6px 0">${head.map(esc).join('<br>')}</p>`:'')
        +`<ul style="margin:0 0 9px 0;padding-left:17px">${
          items.map(x=>`<li style="margin-bottom:4px">${esc(x.replace(/^[-•*·]\s*/,''))}</li>`).join('')}</ul>`;
    }
    return `<p style="margin:0 0 9px 0">${lines.map(esc).join('<br>')}</p>`;
  }).join('');
}

function aiEnabled(){ return !!(window.Sync && Sync.aiReady && Sync.aiReady()) || !!(S.settings&&S.settings.gemini); }
async function gemini(prompt){
  // 1) 클라우드 로그인 상태면 서버 함수(Edge Function) 우선 — 키 노출 없음, 모든 기기 공용
  if(window.Sync && Sync.aiReady && Sync.aiReady()){
    try{ return (await Sync.callAI(prompt))||''; }
    catch(e){
      // 서버 함수가 아직 없거나 실패 → 로컬 키가 있으면 폴백, 없으면 에러 전파
      if(!S.settings.gemini){ const err=new Error((e&&e.message)||'서버 AI를 불러오지 못했어요'); err.kind='server'; throw err; }
    }
  }
  // 2) 로컬 키로 직접 호출 (기존 방식 · 폴백)
  if(!S.settings.gemini){ const err=new Error('AI가 설정되지 않았어요 (설정에서 로그인 또는 키 입력)'); err.kind='config'; throw err; }
  return geminiDirect(prompt);
}
async function geminiDirect(prompt){
  let res;
  try{
    const c=(typeof AbortController!=='undefined')?new AbortController():null;
    const t=c?setTimeout(()=>c.abort(),25000):null;
    res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(S.settings.gemini)}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:prompt}]}]}),
      signal:c?c.signal:undefined
    });
    if(t)clearTimeout(t);
  }catch(e){
    const err=new Error((e&&e.name==='AbortError')?'응답 시간 초과':'네트워크 차단(CORS) — 저장한 파일을 직접 열면 막힐 수 있어요');
    err.kind='network'; throw err;
  }
  if(!res.ok){
    let msg='서버 오류 '+res.status;
    if(res.status===400||res.status===403)msg='API 키가 올바르지 않아요';
    else if(res.status===429)msg='무료 사용량을 초과했어요 (잠시 후 재시도)';
    const err=new Error(msg); err.kind='api'; throw err;
  }
  const data=await res.json();
  return data.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||'';
}

function weekStats(offset){ // offset 0=최근7일, 1=직전7일
  const end=new Date(); end.setDate(end.getDate()-offset*7);
  const days=[];
  for(let i=0;i<7;i++){const d=new Date(end);d.setDate(end.getDate()-i);days.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`)}
  const list=S.tx.filter(t=>days.includes(t.date));
  let exp=0,inc=0;const cats={};
  list.forEach(t=>{if(t.type==='expense'){exp+=t.amount;cats[t.cat]=(cats[t.cat]||0)+t.amount}
    else if(t.type==='income')inc+=t.amount; else if(t.type==='discount')exp-=t.amount});
  const top=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,3);
  return{exp,inc,top};
}

    if(d.inc>0){const sr=Math.round((d.inc-d.exp)/d.inc*100);ratePts.push({cx,cy:yR(sr),sr})}

/* ═════════════════════════════════════════════════════════════════════
 * 현금흐름 코치
 *
 * AI 에게 원본을 통째로 던지지 않는다. 먼저 여기서 '돈이 언제 얼마나
 * 들어오고 나가는지'를 정확히 계산하고, AI 는 그 숫자를 읽고 해석만 한다.
 * (숫자를 AI 가 만들면 틀려도 알 수가 없다)
 *
 * 두 가지를 나눠서 본다.
 *   크기 — 한 달에 들어오는 돈 대비 고정비·강제저축·변동지출의 비중
 *   시점 — 급여일·결제일·납입일이 엇갈려 잔액이 바닥나는 날이 있는지
 * ═════════════════════════════════════════════════════════════════════ */
function cashflowPlan(days){
  const D=days||45, today=todayStr(), ym=thisYM();
  const fxAll=(S.fixed||[]).filter(f=>f.active!==false);
  const incF=fxAll.filter(f=>(f.kind||'expense')==='income');
  const expF=fxAll.filter(f=>(f.kind||'expense')!=='income');
  const forced=S.accounts.filter(a=>(a.type==='saving'||a.type==='housing')
    &&(+a.monthly||0)>0&&(!a.maturity||a.maturity>=today));
  const dca=Math.round(recentInvestPace());
  const avg=recentAvg();

  const incFixed=incF.reduce((s,f)=>s+(+f.amount||0),0);
  const expFixed=expF.reduce((s,f)=>s+(+f.amount||0),0);
  const forcedTotal=forced.reduce((s,a)=>s+(+a.monthly||0),0);
  // 변동지출 = 최근 평균 지출에서 고정지출을 뺀 나머지 (적금·투자는 이체라 지출에 없다)
  const variable=Math.max(0,Math.round(avg.exp-expFixed));
  const inflow=incFixed>0?incFixed:Math.round(avg.inc);
  const incFrom=incFixed>0?'fixed':(avg.inc>0?'avg':'none');
  const outflow=expFixed+forcedTotal+dca+variable;
  const net=inflow-outflow;

  /* ── 앞으로 D일 잔액 흐름 (입출금 계좌 합계 기준) ──
     크기가 아니라 '시점'을 본다. 카드로 낸 고정비는 결제일에 한 번에 빠지므로
     여기서는 카드 결제일에만 반영한다(이중 차감 방지). */
  const checking=S.accounts.filter(a=>a.type==='checking');
  let bal=checking.reduce((s,a)=>s+accKRW(a),0);
  const start=bal, dayVar=Math.round(variable/30.44);
  const line=[]; let lowest=null, risk=null; const seen={};
  for(let i=0;i<=D;i++){
    const d=addDays(today,i), dom=+d.slice(8,10);
    const ev=[];
    if(i>0){
      incF.forEach(f=>{if(+f.day===dom){bal+=+f.amount||0;ev.push({t:'in',n:f.name,v:+f.amount||0})}});
      expF.forEach(f=>{if(+f.day===dom&&f.payKind!=='card'){bal-=+f.amount||0;ev.push({t:'out',n:f.name,v:+f.amount||0})}});
      forced.forEach(a=>{if(+a.payDay===dom){bal-=+a.monthly||0;
        ev.push({t:'save',n:a.name,v:+a.monthly||0})}});
      S.cards.filter(c=>c.type==='credit'&&+c.payDay>0).forEach(c=>{
        if(+c.payDay!==dom)return;
        seen[c.id]=(seen[c.id]||0)+1;
        // 첫 결제일은 실제 미결제액, 그 다음부터는 이번 달 사용 페이스로 추정
        const amt=seen[c.id]===1?Math.round(creditPendingNet(c)):Math.round(cardMonthSpend(c.id,ym));
        if(amt>0){bal-=amt;ev.push({t:'card',n:c.name,v:amt,est:seen[c.id]>1})}
      });
      bal-=dayVar;
    }
    const b=Math.round(bal);
    line.push({d,bal:b,ev});
    if(!lowest||b<lowest.bal)lowest={d,bal:b};
    if(b<0&&!risk)risk={d,short:-b,days:i};
  }

  // 최근 6개월 흐름
  const trend=[];
  for(let i=5;i>=0;i--){
    const dd=new Date(); dd.setMonth(dd.getMonth()-i);
    const m=`${dd.getFullYear()}-${pad(dd.getMonth()+1)}`;
    const t=totals(m);
    if(t.inc||t.exp)trend.push({ym:m,inc:t.inc,exp:t.exp,bal:t.bal});
  }
  return{ym,today,days:D,
    incF:incF.map(f=>({name:f.name,day:+f.day,amount:+f.amount||0})),
    expF:expF.map(f=>({name:f.name,day:+f.day,amount:+f.amount||0,
      byCard:f.payKind==='card'?((cardById(f.payId)||{}).name||'카드'):''})),
    forced:forced.map(a=>({name:a.name,kind:a.type==='housing'?'청약':'적금',
      monthly:+a.monthly||0,day:+a.payDay||0,
      from:(accById(a.payFrom)||{}).name||''})),
    dca,incFixed,expFixed,forcedTotal,variable,inflow,incFrom,outflow,net,
    rates:{fixed:inflow>0?expFixed/inflow*100:0, forced:inflow>0?(forcedTotal+dca)/inflow*100:0,
           variable:inflow>0?variable/inflow*100:0, save:inflow>0?(net+forcedTotal+dca)/inflow*100:0},
    start,line,lowest,risk,trend,
    monthsOfData:avg.n};
}

/* ── 과거 패턴 기반 예측용 자료 ──
 * 위 cashflowPlan()은 '고정 항목'을 등록해야 정확해진다. 여기서는 그거 없이도
 * 최근 실제 월별 수입·지출만으로 추세·변동성·반복 지출을 뽑는다 — AI 예측(아래
 * flowForecast)이 고정수입·고정비 없이도 동작하게 하려는 목적. */
function cashflowHistory(months){
  const N=months||12, now=new Date(), rows=[];
  for(let i=N;i>=1;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const ym=`${d.getFullYear()}-${pad(d.getMonth()+1)}`, t=totals(ym);
    if(t.inc||t.exp)rows.push({ym,inc:Math.round(t.inc),exp:Math.round(t.exp),net:Math.round(t.inc-t.exp)});
  }
  if(rows.length<2)return{months:rows.length,rows,trendPct:0,volatility:0,irregular:[]};

  // 추세: 최근 절반 대 이전 절반 평균 지출 비교
  const half=Math.floor(rows.length/2);
  const older=rows.slice(0,rows.length-half), newer=rows.slice(rows.length-half);
  const avgExp=arr=>arr.length?arr.reduce((s,r)=>s+r.exp,0)/arr.length:0;
  const oldAvg=avgExp(older);
  const trendPct=oldAvg>0?Math.round((avgExp(newer)-oldAvg)/oldAvg*100):0;

  // 변동성: 수입의 표준편차/평균 (프리랜서 등 비정기 수입 여부 판단용)
  const incs=rows.map(r=>r.inc), incAvg=incs.reduce((s,v)=>s+v,0)/incs.length;
  const variance=incs.reduce((s,v)=>s+(v-incAvg)**2,0)/incs.length;
  const volatility=incAvg>0?Math.round(Math.sqrt(variance)/incAvg*100):0;

  // 고정으로 등록 안 됐지만 여러 달에 걸쳐 반복되는 지출 카테고리(경조사비 등)
  const catByYm={};
  rows.forEach(r=>{ catSums(r.ym).forEach(([cat,amt])=>{ (catByYm[cat]=catByYm[cat]||[]).push(amt); }); });
  const fixedCats=new Set((S.fixed||[]).map(f=>f.cat).filter(Boolean));
  const irregular=Object.entries(catByYm)
    .filter(([cat,arr])=>!fixedCats.has(cat)&&arr.length>=2&&arr.length<rows.length)
    .map(([cat,arr])=>({cat,count:arr.length,avg:Math.round(arr.reduce((s,v)=>s+v,0)/arr.length)}))
    .sort((a,b)=>b.avg*b.count-a.avg*a.count).slice(0,5);

  return{months:rows.length,rows,trendPct,volatility,irregular};
}

/* 잔액 곡선 — 0 아래로 내려가는 구간은 붉게 */
function flowChart(p){
  const L=p.line; if(L.length<2)return'';
  const W=320,H=120,PT=8,PB=16;
  const vals=L.map(x=>x.bal);
  const hi=Math.max(...vals,0), lo=Math.min(...vals,0), span=(hi-lo)||1;
  const x=i=>W*(i/(L.length-1)), y=v=>PT+(H-PT-PB)*(1-(v-lo)/span);
  const path=L.map((pt,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(pt.bal).toFixed(1)}`).join('');
  const zero=y(0).toFixed(1);
  return`<svg class="svg-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:120px">
    ${lo<0?`<rect x="0" y="${zero}" width="${W}" height="${(H-PB-+zero).toFixed(1)}" fill="var(--terra-soft)"/>`:''}
    <path d="${path}L${W},${H-PB}L0,${H-PB}Z" fill="var(--fill)"/>
    <path d="${path}" fill="none" stroke="var(--terra)" stroke-width="2" stroke-linejoin="round"/>
    <line x1="0" y1="${zero}" x2="${W}" y2="${zero}" stroke="var(--line2)" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="0" y="${H-3}" font-size="9" fill="var(--faint)">오늘</text>
    <text x="${W}" y="${H-3}" font-size="9" fill="var(--faint)" text-anchor="end">${p.days}일 뒤</text>
  </svg>`;
}
/* 앞으로 2주 안에 일어날 큰 이동만 추린다 */
function flowEvents(p){
  const soon=p.line.filter(x=>x.ev.length).slice(0,15);
  const items=[];
  soon.forEach(x=>x.ev.forEach(e=>{if(e.v>=10000)items.push({d:x.d,...e})}));
  if(!items.length)return'';
  const emo={in:'💰',out:'📌',save:'🔒',card:'💳'};
  return`<div class="divider"></div>${items.slice(0,8).map(e=>`<div class="row" style="padding:4px 0;gap:8px">
    <span class="tiny">${emo[e.t]||'•'} ${esc(e.d.slice(5).replace('-','/'))} ${esc(e.n)}${e.est?' <span style="color:var(--faint)">(추정)</span>':''}</span>
    <span class="tiny num ${e.t==='in'?'pos':''}">${e.t==='in'?'+':'−'}${fmtK(e.v)}</span></div>`).join('')}`;
}

/* ── AI 진단 ── */
const FLOW_PERSONA=`너는 한국 사회초년생 전용 '현금흐름 코치'야. 아래 데이터는 앱이 직접 계산한 정확한 숫자다. 이 숫자만 근거로 말하고, 없는 건 지어내지 마. 따뜻하지만 직설적으로, 항목 이름과 실제 금액·날짜를 인용해서 말해.`;
const FLOW_TASK=`다음 세 가지를 순서대로 써:
1) 지금 구조 한 줄 평가 — 들어오는 돈 대비 고정비·저축·변동지출의 균형이 어떤지.
2) 눈에 띄는 것 — 잘하고 있는 것 하나, 걱정되는 것 하나. 날짜가 엇갈려 잔액이 바닥나는 구간이 있으면 반드시 짚어.
3) 이번 달에 할 일 3가지 — 각각 구체적인 항목명과 금액으로. '아껴라' 같은 막연한 말은 쓰지 마.`;
let flowBusy=false;
async function flowDiagnose(){
  if(flowBusy)return;
  if(!aiEnabled()){ toast('설정에서 클라우드 로그인 또는 Gemini 키를 넣어주세요'); return openSettings(); }
  const out=$('flow-ai-out'), btn=$('flow-ai-btn');
  flowBusy=true; if(btn){btn.disabled=true;btn.textContent='분석 중…';}
  if(out)out.innerHTML='<div class="tiny">현금흐름을 읽고 있어요…</div>';
  try{
    const p=cashflowPlan();
    // AI 에 넘길 때는 일자별 곡선 전체가 아니라 요약과 큰 이동만 준다 (토큰·정확도)
    const ctx={
      기준일:p.today,
      한달구조:{들어오는돈:p.inflow,수입출처:p.incFrom==='fixed'?'고정수입 등록분':'최근 평균',
        고정비:p.expFixed,적금청약:p.forcedTotal,투자납입:p.dca,변동지출:p.variable,남는돈:p.net},
      비중:{고정비:Math.round(p.rates.fixed)+'%',저축투자:Math.round(p.rates.forced)+'%',
        변동지출:Math.round(p.rates.variable)+'%',저축률:Math.round(p.rates.save)+'%'},
      고정수입:p.incF,고정비상세:p.expF,적금청약:p.forced,
      입출금잔액:{지금:p.start,최저:(p.lowest||{}).bal,최저일:(p.lowest||{}).d,
        부족예상:p.risk?{날짜:p.risk.d,모자란금액:p.risk.short}:null},
      최근6개월:p.trend
    };
    const text=await gemini(`${FLOW_PERSONA}\n\n${FLOW_TASK}\n\n[현금흐름 데이터]\n${JSON.stringify(ctx)}\n\n${AI_FORMAT}`);
    S.flowAI={at:new Date().toISOString(),ym:thisYM(),text};
    save();
    if(out)out.innerHTML=fmtAI(text);
    if(btn)btn.textContent='다시 진단받기';
  }catch(e){
    if(out)out.innerHTML=`<div class="tiny" style="color:var(--terra-deep)">진단하지 못했어요 — ${esc((e&&e.message)||'')}</div>`;
    if(btn)btn.textContent='다시 시도';
  }finally{ flowBusy=false; if(btn)btn.disabled=false; }
}

/* ── 과거 패턴 기반 예측 — 고정 항목이 하나도 없어도 동작 ── */
const FORECAST_PERSONA=`너는 한국 사회초년생 전용 '현금흐름 예측가'야. 아래는 최근 실제 월별 수입·지출 데이터(앱이 계산한 정확한 숫자)야. 고정수입·고정비를 등록했는지와 상관없이, 이 과거 흐름만 근거로 다음 달을 예상해. 숫자를 지어내지 말고, 데이터가 부족하면 부족하다고 말해.`;
const FORECAST_TASK=`다음을 순서대로 써:
1) 다음 달 예상 수입·지출·순현금흐름 — 원 단위 범위로 (예: 수입 250~300만원). 어떤 과거 패턴을 근거로 그렇게 봤는지 반드시 밝혀.
2) 눈에 띄는 패턴 — 수입이 불규칙한지, 지출이 늘고 있는지 줄고 있는지, 고정으로 등록 안 됐지만 반복되는 지출이 있는지.
3) 다음 달 준비할 것 한 가지 — 위 예측을 근거로 구체적으로.`;
let forecastBusy=false;
async function flowForecast(){
  if(forecastBusy)return;
  if(!aiEnabled()){ toast('설정에서 클라우드 로그인 또는 Gemini 키를 넣어주세요'); return openSettings(); }
  const h=cashflowHistory();
  if(h.months<2){ toast('최근 2개월 이상의 기록이 있어야 예측할 수 있어요'); return; }
  const out=$('flow-fc-out'), btn=$('flow-fc-btn');
  forecastBusy=true; if(btn){btn.disabled=true;btn.textContent='분석 중…';}
  if(out)out.innerHTML='<div class="tiny">과거 패턴을 읽고 있어요…</div>';
  try{
    const ctx={
      최근개월수:h.months, 월별수입지출:h.rows,
      지출추세:h.trendPct>0?`최근이 이전보다 ${h.trendPct}% 늘었어요`:h.trendPct<0?`최근이 이전보다 ${Math.abs(h.trendPct)}% 줄었어요`:'큰 변화 없어요',
      수입변동성:h.volatility+'% (클수록 수입이 불규칙)',
      고정등록안된반복지출:h.irregular.map(x=>({카테고리:x.cat,등장월수:x.count,평균금액:x.avg}))
    };
    const text=await gemini(`${FORECAST_PERSONA}\n\n${FORECAST_TASK}\n\n[과거 현금흐름 데이터]\n${JSON.stringify(ctx)}\n\n${AI_FORMAT}`);
    S.flowForecast={at:new Date().toISOString(),months:h.months,text};
    save();
    if(out)out.innerHTML=fmtAI(text);
    if(btn)btn.textContent='다시 예측받기';
  }catch(e){
    if(out)out.innerHTML=`<div class="tiny" style="color:var(--terra-deep)">예측하지 못했어요 — ${esc((e&&e.message)||'')}</div>`;
    if(btn)btn.textContent='다시 시도';
  }finally{ forecastBusy=false; if(btn)btn.disabled=false; }
}

/* ═════════ 순자산 타임라인 ═════════
 * 홈의 순자산은 늘 '지금' 값이라 늘고 있는지 줄고 있는지 알 수 없었다.
 * 앱을 열고 기록할 때마다 그날의 순자산을 남겨 두고, 월 단위로 이어 그린다. */
function netSeries(months){
  const h=S.netHist||{};
  const byM={};
  Object.keys(h).sort().forEach(k=>{byM[ymOf(k)]=h[k]});   // 그 달의 마지막 값
  const ms=Object.keys(byM).sort();
  return (months?ms.slice(-months):ms).map(m=>({m,v:byM[m]}));
}
function renderNetHist(){
  const el=$('nethist-card'); if(!el)return;
  const all=netSeries(0), pts=netSeries(13);
  const days=Object.keys(S.netHist||{}).length;
  if(pts.length<2){
    el.innerHTML=`<div style="font-weight:700;font-size:.92rem">📈 순자산 흐름</div>
      <div class="empty">${days<=1
        ? '오늘부터 순자산을 기록하기 시작했어요.<br>며칠 지나면 여기에 흐름이 그려져요.'
        : `${days}일치를 모았어요.<br>달이 바뀌면 흐름이 그려져요.`}</div>
      <div class="tiny" style="text-align:center">지금 순자산 <b class="num">${fmt(netAssets())}</b></div>`;
    return;
  }
  const first=pts[0], last=pts[pts.length-1];
  const diff=last.v-first.v;
  const pace=recentMonthlySaving();            // 시뮬레이터와 같은 '월 저축 여력'
  const fw=6;                                   // 앞으로 6개월 예측
  const proj=[]; for(let i=1;i<=fw;i++)proj.push(last.v+pace*i);

  const W=320,H=132,PL=6,PR=6,PT=10,PB=18;
  const vals=pts.map(p=>p.v).concat(proj);
  const lo=Math.min(...vals), hi=Math.max(...vals), span=(hi-lo)||1;
  const n=pts.length+fw-1;
  const x=i=>PL+(W-PL-PR)*(n?i/n:0);
  const y=v=>PT+(H-PT-PB)*(1-(v-lo)/span);
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const area=`${line}L${x(pts.length-1).toFixed(1)},${H-PB}L${x(0).toFixed(1)},${H-PB}Z`;
  const pline=[[pts.length-1,last.v]].concat(proj.map((v,i)=>[pts.length+i,v]))
    .map((p,i)=>`${i?'L':'M'}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join('');

  el.innerHTML=`<div class="row" style="margin-bottom:4px">
      <div style="font-weight:700;font-size:.92rem">📈 순자산 흐름</div>
      <span class="tiny">${esc(ymLabel(first.m))} ~</span></div>
    <div class="row" style="align-items:baseline;margin-bottom:10px">
      <b class="num" style="font-size:1.32rem;letter-spacing:-.03em">${fmt(last.v)}</b>
      <span class="num ${diff>=0?'pos':'neg'}" style="font-weight:700;font-size:.9rem">
        ${diff>=0?'+':'−'}${fmtK(Math.abs(diff))}원 <span class="tiny">${pts.length}개월</span></span></div>
    <svg class="svg-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:132px">
      <path d="${area}" fill="var(--terra-soft)"/>
      <path d="${line}" fill="none" stroke="var(--terra)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${pace!==0?`<path d="${pline}" fill="none" stroke="var(--terra)" stroke-width="1.6" stroke-dasharray="4 3" opacity=".55"/>`:''}
      <circle cx="${x(pts.length-1).toFixed(1)}" cy="${y(last.v).toFixed(1)}" r="3.4"
        fill="var(--terra)" stroke="var(--surface)" stroke-width="1.5"/>
      <text x="${PL}" y="${H-4}" font-size="9" fill="var(--faint)">${esc(ymLabel(first.m))}</text>
      <text x="${W-PR}" y="${H-4}" font-size="9" fill="var(--faint)" text-anchor="end">${pace!==0?fw+'개월 뒤':esc(ymLabel(last.m))}</text>
    </svg>
    ${pace!==0?`<div class="tiny" style="margin-top:4px">점선은 지금 저축 페이스(월 ${fmtK(pace)}원)가 이어질 때의 예상이에요 — 실선과 벌어지면 페이스가 바뀐 거예요.</div>`:''}
    ${all.length>pts.length?`<div class="tiny" style="margin-top:4px">전체 ${all.length}개월 중 최근 13개월</div>`:''}`;
}

/* ═════════ 자산 배분 & 리밸런싱 ═════════ */
const ALLOC_GROUPS=[
  {k:'cash',  label:'현금성', types:['checking'],                     emo:'💳', color:'var(--blue)'},
  {k:'safe',  label:'안전자산', types:['deposit','saving','housing'],  emo:'🔒', color:'var(--green)'},
  {k:'invest',label:'투자',   types:['invest'],                       emo:'📈', color:'var(--terra)'}
];
const ALLOC_DEFAULT={cash:20,safe:50,invest:30};
function allocNow(){
  const g={}; let tot=0;
  ALLOC_GROUPS.forEach(x=>{
    g[x.k]=S.accounts.filter(a=>x.types.includes(a.type)).reduce((s,a)=>s+accKRW(a),0);
    tot+=g[x.k];
  });
  return{tot,g};
}
function renderAlloc(){
  const el=$('alloc-card'); if(!el)return;
  const {tot,g}=allocNow();
  if(tot<=0){ el.style.display='none'; return; }
  el.style.display='';
  const tgt=S.alloc;
  const rows=ALLOC_GROUPS.map(x=>{
    const amt=g[x.k], pct=amt/tot*100;
    const want=tgt?tgt[x.k]:null;
    const gap=want!=null?(want-pct):null;                 // +면 더 채워야 함
    const move=want!=null?Math.round(tot*want/100-amt):0;
    return{...x,amt,pct,want,gap,move};
  });
  const bar=`<div style="display:flex;height:10px;border-radius:var(--r-full);overflow:hidden;background:var(--fill-2);margin:10px 0 12px">
    ${rows.filter(r=>r.pct>0).map(r=>`<div style="width:${r.pct}%;background:${r.color}"></div>`).join('')}</div>`;

  // 목표에서 5%p 넘게 벗어난 것만 제안한다 (조금씩 흔들리는 건 정상)
  const drift=rows.filter(r=>r.gap!=null&&Math.abs(r.gap)>=5).sort((a,b)=>Math.abs(b.gap)-Math.abs(a.gap));
  el.innerHTML=`<div class="row" style="margin-bottom:2px">
      <div style="font-weight:700;font-size:.92rem">⚖️ 자산 배분</div>
      <button class="btn ghost sm" onclick="openAllocModal()">${tgt?'목표 수정':'목표 정하기'}</button></div>
    ${bar}
    ${rows.map(r=>`<div class="row" style="padding:6px 0;gap:10px">
      <span style="font-size:.86rem;min-width:0"><span class="legend-dot" style="background:${r.color}"></span>${r.emo} ${r.label}</span>
      <span style="text-align:right;white-space:nowrap">
        <b class="num" style="font-size:.88rem">${r.pct.toFixed(0)}%</b>
        <span class="tiny num"> ${fmtK(r.amt)}원${r.want!=null?` · 목표 ${r.want}%`:''}</span></span></div>`).join('')}
    ${!tgt?`<div class="tiny" style="margin-top:8px">💡 목표 비중을 정하면 얼마를 옮겨야 하는지 계산해드려요.</div>`
      :drift.length?`<div class="divider"></div>${drift.map(r=>`<div class="tiny" style="padding:3px 0">
          ${r.move>0?'🔻':'🔺'} <b>${r.label}</b> 비중이 목표보다 ${Math.abs(r.gap).toFixed(0)}%p ${r.move>0?'낮아요':'높아요'} —
          <b class="num">${fmtK(Math.abs(r.move))}원</b>을 ${r.move>0?'이쪽으로 옮기면':'다른 곳으로 옮기면'} 맞아요.</div>`).join('')}
        <div class="tiny" style="margin-top:6px;color:var(--faint)">5%p 이내 차이는 정상 범위로 보고 넘어가요.</div>
        <button class="btn ghost sm block" style="margin-top:8px" onclick="openAllocExecModal()">💰 수수료까지 계산한 실행 계획 보기</button>`
      :`<div class="divider"></div><div class="tiny">✅ 목표 배분에 잘 맞춰져 있어요.</div>`}`;
}
function openAllocModal(){
  const t=S.alloc||ALLOC_DEFAULT;
  openModal(`${sheetHead('자산 배분 목표')}
    <div class="tiny" style="margin:-4px 2px 12px">현금성·안전자산·투자를 각각 몇 %로 유지할지 정해두면, 벗어났을 때 얼마를 옮겨야 하는지 알려드려요. 합이 100%가 되게 넣어주세요.</div>
    ${ALLOC_GROUPS.map(x=>`<div class="field"><label>${x.emo} ${x.label} (%)</label>
      <input type="number" inputmode="numeric" id="al-${x.k}" value="${t[x.k]}" oninput="allocHint()"></div>`).join('')}
    <div class="card tight" style="margin-bottom:12px"><div class="tiny" id="al-hint"></div></div>
    <div style="display:flex;gap:8px">
      ${S.alloc?`<button class="btn ghost" style="flex:1" onclick="S.alloc=null;commit('목표를 지웠어요')">목표 지우기</button>`:''}
      <button class="btn primary" style="flex:2" onclick="saveAlloc()">저장</button>
    </div>`);

function allocHint(){
  const h=$('al-hint'); if(!h)return;
  const sum=ALLOC_GROUPS.reduce((s,x)=>s+(numVal('al-'+x.k)||0),0);
  h.innerHTML=sum===100?'✅ 합계 100% — 좋아요.'
    :`합계 <b class="num">${sum}%</b> — 100%가 되도록 맞춰주세요 (${sum>100?'초과':'부족'} ${Math.abs(100-sum)}%p)`;
  h.style.color=sum===100?'var(--green)':'var(--terra-deep)';
}
function saveAlloc(){
  const v={}; let sum=0;
  ALLOC_GROUPS.forEach(x=>{v[x.k]=Math.max(0,Math.round(numVal('al-'+x.k)||0));sum+=v[x.k]});
  if(sum!==100)return toast(`합계가 ${sum}%예요 — 100%로 맞춰주세요`);
  S.alloc=v; commit('배분 목표를 저장했어요');
}

/* ═════════ 리밸런싱 실행 도우미 — 배분 갭 × 매매 수수료 ═════════
 * '자산 배분' 카드는 얼마를 옮겨야 하는지까지만 알려준다. 여기서는 그 이동이
 * 실제로 어느 투자 계좌를 사고팔아야 하는 일인지, 수수료가 얼마나 드는지 계산한다.
 * 수수료가 낮은 계좌부터 채우고, 매도일 때는 절세계좌(중도인출 시 세제혜택
 * 추징 우려)를 맨 뒤로 미룬다. 현금성↔안전자산 사이는 계좌 이체라 수수료가 없다. */
function allocExecPlan(){
  const {tot,g}=allocNow(), tgt=S.alloc;
  if(!tgt||tot<=0)return null;
  const rows=ALLOC_GROUPS.map(x=>{
    const amt=g[x.k], pct=amt/tot*100, want=tgt[x.k];
    return{...x,amt,pct,want,gap:want-pct,move:Math.round(tot*want/100-amt)};
  });
  const drift=rows.filter(r=>Math.abs(r.gap)>=5);
  const legs=[]; let short=0, side=null;
  const investRow=rows.find(r=>r.k==='invest');
  if(investRow&&drift.some(r=>r.k==='invest')&&Math.abs(investRow.move)>0){
    side=investRow.move>0?'buy':'sell';
    let left=Math.abs(investRow.move);
    const ranked=S.accounts.filter(a=>a.type==='invest').map(a=>{
      const f=invFees(a), r=((side==='sell'?+f.sell:+f.buy)||0)+(+f.etc||0);
      return{a,r};
    }).sort((x,y)=>(side==='sell'?(invKindOf(x.a)==='tax')-(invKindOf(y.a)==='tax'):0)||x.r-y.r);
    ranked.forEach(({a})=>{
      if(left<=0)return;
      const isFx=!!(a.cur&&a.cur!=='KRW'), rate=isFx?invFxRate(a).rate:1;
      const availKrw=side==='sell'?accKRW(a):left;
      const takeKrw=Math.min(left,availKrw);
      if(takeKrw<=0)return;
      const nativeAmt=isFx?Math.round(takeKrw/rate*100)/100:takeKrw;
      const cost=tradeCost(a,nativeAmt,side);
      const feeKrw=isFx?Math.round(cost.fee*rate):cost.fee;
      let fxCostKrw=0;
      if(isFx&&side==='buy'){
        const fx=invFxRate(a);
        if(fx.spread>0)fxCostKrw=Math.round(nativeAmt*fx.rate-nativeAmt*fx.base);
      }
      legs.push({a,side,krw:takeKrw,native:nativeAmt,isFx,feeKrw,fxCostKrw,
                 pct:cost.pct,isTax:invKindOf(a)==='tax',expired:cost.st.state==='expired'});
      left-=takeKrw;
    });
    short=left;
  }
  return{tot,rows,drift,legs,side,short,feeTotal:legs.reduce((s,l)=>s+l.feeKrw+l.fxCostKrw,0)};
}
function openAllocExecModal(){
  if(!S.alloc){ toast('먼저 배분 목표를 정해주세요'); return; }
  const p=allocExecPlan();
  if(!p||!p.drift.length){ toast('지금은 5%p 이상 벗어난 게 없어요'); return; }
  const adjLine=r=>{
    if(Math.abs(r.gap)<5)return'';
    return`<div class="row" style="padding:6px 0">
      <span style="font-size:.86rem">${r.emo} ${r.label}</span>
      <b class="num" style="font-size:.88rem;color:${r.move>0?'var(--green)':'var(--terra-deep)'}">${r.move>0?'+':'−'}${fmt(Math.abs(r.move))}</b></div>`;
  };
  const legRows=p.legs.map(l=>{
    const warn=[];
    if(l.isTax)warn.push('⚠️ 절세계좌예요 — 중도 인출하면 세액공제 추징 등 불이익이 있을 수 있어요.');
    if(l.expired)warn.push('⏰ 수수료 우대 기간이 지나 설정된 값 그대로 계산했어요 — 실제와 다를 수 있어요.');
    return`<div class="card tight" style="margin-bottom:8px">
      <div class="row"><b style="font-size:.87rem">${esc(l.a.name)}</b>
        <span class="badge ${l.side==='buy'?'green':'gold'}">${l.side==='buy'?'매수':'매도'}</span></div>
      <div class="tiny num" style="margin-top:2px">${fmt(l.krw)}${l.isFx?` · ${esc((CURS[l.a.cur]||{}).sym||'')}${l.native.toLocaleString(undefined,{minimumFractionDigits:2})}`:''}</div>
      <div class="row" style="margin-top:6px"><span class="tiny">수수료 <span style="color:var(--faint)">(${l.pct.toFixed(3)}%)</span></span>
        <b class="num tiny">${fmt(l.feeKrw)}${l.fxCostKrw?` + 환전비용 ${fmt(l.fxCostKrw)}`:''}</b></div>
      ${warn.map(w=>`<div class="tiny" style="color:var(--terra-deep);margin-top:4px">${w}</div>`).join('')}
    </div>`;
  }).join('');
  const totalMove=p.legs.reduce((s,l)=>s+l.krw,0);
  const feePct=totalMove>0?p.feeTotal/totalMove*100:0;
  openModal(`${sheetHead('리밸런싱 실행 계획')}
    <div class="tiny" style="margin:-4px 2px 12px">목표와 5%p 이상 벗어난 만큼만 계산해요. 투자 계좌는 수수료가 낮은 곳부터 채우고, 매도는 절세계좌를 맨 뒤로 미뤄요.</div>
    <div class="card tight" style="margin-bottom:12px">${p.rows.map(adjLine).join('')}</div>
    ${legRows||`<div class="tiny" style="margin-bottom:12px">현금성·안전자산 사이는 계좌 이체만 하면 돼요 — 수수료가 없어요.</div>`}

      <b style="font-size:.88rem">수수료 합계</b>

      ${feePct>=1?`<div class="tiny" style="margin-top:6px">💡 수수료가 이동 금액의 ${feePct.toFixed(1)}%나 돼요 — 급하지 않다면 다음 기회에 모아서 하는 게 나을 수 있어요.</div>`:''}`:''}
    <div class="tiny" style="margin-top:10px;color:var(--faint)">설정한 수수료율 기준 추정이에요. 실제 체결가·환율에 따라 달라질 수 있어요.</div>`);
}

/* ═════════ 목표 역산 ═════════
 * '언제까지 얼마'를 정했을 때 매달 얼마가 필요한지, 지금 여력으로 되는지 계산한다. */
function goalPlan(g){
  const cur=goalSaved(g), need=Math.max(0,(g.target||0)-cur);
  const cap=Math.max(0,Math.round(recentMonthlySaving()));   // 월 저축 여력
  const byPace=cap>0?Math.ceil(need/cap):null;               // 지금 페이스로 몇 달
  if(need<=0)return{done:true,need:0,cap};
  if(!g.due)return{done:false,need,cap,byPace};
  const days=Math.round((new Date(g.due+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/86400000);
  const months=days/30.44;
  if(months<=0)return{done:false,over:true,need,cap,byPace,days};
  const perMonth=Math.ceil(need/months);
  return{done:false,need,cap,byPace,days,months,perMonth,feasible:cap>0&&perMonth<=cap,
         short:Math.max(0,perMonth-cap)};
}
function goalPlanLine(g){
  const p=goalPlan(g);
  if(p.done)return`<div class="tiny" style="color:var(--green);margin-top:6px">🏆 목표를 채웠어요.</div>`;
  const capNote=p.cap>0?`지금 여력 월 ${fmtK(p.cap)}원`:'수입·지출이 쌓이면 여력을 계산해드려요';
  if(p.over)return`<div class="tiny" style="color:var(--terra-deep);margin-top:6px">⏰ 기한이 지났어요 · ${fmtK(p.need)}원 남음 — 기한을 다시 정해보세요.</div>`;
  if(!p.perMonth){
    return`<div class="tiny" style="margin-top:6px">${fmtK(p.need)}원 남았어요.${p.byPace?` 지금 페이스면 <b>약 ${p.byPace}개월</b> 뒤 (${esc(monthsLater(p.byPace))})`:` ${capNote}`}</div>`;
  }
  return`<div class="tiny" style="margin-top:6px">
    매달 <b class="num">${fmtK(p.perMonth)}원</b>씩 넣어야 해요 <span style="color:var(--faint)">· ${capNote}</span><br>
    ${p.feasible
      ? `<span style="color:var(--green)">✅ 지금 페이스로 가능해요.</span>`
      : `<span style="color:var(--terra-deep)">⚠️ 월 ${fmtK(p.short)}원이 부족해요.</span> ${p.byPace?`기한을 <b>${esc(monthsLater(p.byPace))}</b>로 미루거나, 그만큼 더 모아야 해요.`:''}`}
  </div>`;
}
function monthsLater(n){
  const d=new Date(); d.setMonth(d.getMonth()+n);
  return `${d.getFullYear()}년 ${d.getMonth()+1}월`;
}
function renderGoals(){

      <div style="text-align:right"><b class="num" style="font-size:.88rem">${fmtK(cur)} / ${fmtK(g.target)}원</b><div class="tiny num">${pct.toFixed(0)}%</div></div></div>
      <div class="gauge-track" style="margin-top:8px"><div class="gauge-fill" style="width:${pct}%;background:${done?'var(--green)':'var(--gold)'}"></div></div>

/* ═════════ v3: 자산 시뮬레이터 ═════════ */
// 최근 N개월 실제 월 저축(수입-지출) 중앙값 → 기본 저축 페이스
// 최근 6개월 현금흐름(수입−지출) 중앙값
function cashflowSaving(){
  const now=new Date(); const vals=[];
  for(let i=1;i<=6;i++){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const ym=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
    const t=totals(ym);
    if(t.inc>0||t.exp>0) vals.push(t.inc-t.exp);
  }
  if(!vals.length)return 0;
  vals.sort((a,b)=>a-b);
  const mid=Math.floor(vals.length/2);
  return Math.round(vals.length%2?vals[mid]:(vals[mid-1]+vals[mid])/2);
}
// 최근 6개월 월평균 수입·지출 (기록이 있는 달만)
function recentAvg(){
  const now=new Date(); let inc=0, exp=0, n=0;
  for(let i=1;i<=6;i++){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const t=totals(`${d.getFullYear()}-${pad(d.getMonth()+1)}`);
    if(t.inc>0||t.exp>0){ inc+=t.inc; exp+=t.exp; n++; }
  }
  return n?{inc:Math.round(inc/n), exp:Math.round(exp/n), n}:{inc:0,exp:0,n:0};
}
/* 시뮬레이션에 쓸 월 저축액.
   원칙: 순자산 증가 = 수입 − 지출. (적금·청약 납입은 계좌 간 이동이라 이미 여기 포함)
   다만 수입을 기록하지 않으면 계산이 불가능하므로, 그때만 '적금·청약 납입 − 월평균 지출'로
   추정하고 추정임을 화면에 명시한다. */
function savingBreakdown(){
  const flow=cashflowSaving(), forced=monthlyAutoSaving(), avg=recentAvg();
  const hasIncome=avg.inc>0;
  if(hasIncome) return {mode:'flow', used:flow, flow, forced, avg};
  // 수입 미기록 → 강제저축에서 실제 소비를 빼서 보수적으로 추정
  return {mode:'estimate', used:forced-avg.exp, flow, forced, avg};
}
function recentMonthlySaving(){ return savingBreakdown().used; }
// 적금·청약 월 자동납입 합계(만기 전까지 유지되는 강제저축)
function monthlyAutoSaving(){
  return S.accounts.filter(a=>(a.type==='saving'||a.type==='housing')&&a.monthly>0)
    .filter(a=>!a.maturity||a.maturity>=todayStr())
    .reduce((s,a)=>s+a.monthly,0);
}
// 최근 투자 월 납입 페이스(최근 3회 평균)
function recentInvestPace(){
  const byM={}; S.invLogs.forEach(l=>byM[ymOf(l.date)]=(byM[ymOf(l.date)]||0)+toKRW(l.amount,l.cur,l.fxAt));
  const ms=Object.keys(byM).sort().slice(-3);
  if(!ms.length)return 0;
  return Math.round(ms.reduce((s,m)=>s+byM[m],0)/ms.length);
}
/* 시뮬레이션: 매달 (기본저축 + 추가절약)을 순자산에 더하고, 투자원금엔 월 수익률 복리 */
function simulate(months,extraMonthly){
  const start=netAssets();
  const invStart=S.accounts.filter(a=>a.type==='invest').reduce((s,a)=>s+accKRW(a),0);
  const baseSave=recentMonthlySaving();
  const invPace=recentInvestPace();
  const r=(S.settings.simReturn||0)/100/12; // 월 수익률
  const contrib=baseSave+extraMonthly; // 매달 순자산 증가(현금성)
  const pts=[]; let cash=start-invStart, inv=invStart;
  pts.push({m:0,total:start});
  for(let i=1;i<=months;i++){
    inv=inv*(1+r)+invPace;      // 투자: 복리 + 매달 납입
    cash+=contrib-invPace;       // 현금: 저축분에서 투자납입만큼은 투자로 이동
    pts.push({m:i,total:Math.round(cash+inv)});
  }
  return{pts,baseSave,invPace,contrib,end:pts[pts.length-1].total,invEnd:Math.round(inv)};
}
function setHorizon(h){S.settings.simHorizon=h;save();renderSim()}
function onSimExtra(v){S.settings.simExtra=Math.round(+v);$('sim-extra-val').textContent=(S.settings.simExtra>=0?'+':'−')+fmtK(Math.abs(S.settings.simExtra))+'원/월';save();drawSim()}
function onSimReturn(v){S.settings.simReturn=+v;$('sim-ret-val').textContent=(+v).toFixed(1)+'%/년';save();drawSim()}
function renderSim(){
  const el=$('sim-card');
  const hasData=S.tx.length>0||S.accounts.length>0;
  if(!hasData){el.innerHTML=`<div style="font-weight:800;font-size:.95rem">📈 자산 시뮬레이터</div><div class="empty">계좌와 내역을 등록하면<br>미래 순자산 곡선을 그려드려요</div>`;return}
  const base=recentMonthlySaving();
  el.innerHTML=`
    <div class="row"><div style="font-weight:800;font-size:.95rem">📈 자산 시뮬레이터</div>
      <div class="horizon-seg">${[6,12,36].map(h=>`<button class="${S.settings.simHorizon===h?'on':''}" onclick="setHorizon(${h})">${h>=12?h/12+'년':h+'개월'}</button>`).join('')}</div></div>
    <div class="tiny" style="margin-top:6px">월 저축 <b class="num ${base>=0?'pos':'neg'}">${base>=0?'+':'−'}${fmtK(Math.abs(base))}원</b> · 이대로 가면?
      ${(()=>{const sb=savingBreakdown(), a=sb.avg;
        if(sb.mode==='flow')
          return `<br>월평균 수입 <b class="num">${fmtK(a.inc)}</b> − 지출 <b class="num">${fmtK(a.exp)}</b> (최근 ${a.n}개월)
            ${sb.forced?`<br><span style="color:var(--faint)">※ 적금·청약 납입 ${fmtK(sb.forced)}원은 계좌 간 이동이라 이미 포함돼 있어요</span>`:''}`;
        // 수입 미기록 → 추정 모드
        return `<br>⚠️ 수입 기록이 없어 <b>추정</b>이에요 — 적금·청약 납입 <b class="num">${fmtK(sb.forced)}</b> − 월평균 지출 <b class="num">${fmtK(a.exp)}</b>
          <br><span style="color:var(--terra-deep)">수입을 기록하면 훨씬 정확해져요</span>`;})()}</div>
    <svg class="svg-chart" id="sim-svg" viewBox="0 0 440 180" style="margin-top:10px"></svg>
    <div class="sim-out" id="sim-out"></div>
    <div class="sim-controls">
      <div class="slider-row">
        <div class="sl-top"><span class="sl-label">💰 월 추가 절약/저축</span><span class="sl-val" id="sim-extra-val">${(S.settings.simExtra>=0?'+':'−')+fmtK(Math.abs(S.settings.simExtra))}원/월</span></div>
        <input type="range" min="-300000" max="500000" step="10000" value="${S.settings.simExtra}" oninput="onSimExtra(this.value)">
      </div>
      <div class="slider-row">
        <div class="sl-top"><span class="sl-label">📊 투자 연 수익률 가정</span><span class="sl-val" id="sim-ret-val">${(S.settings.simReturn||0).toFixed(1)}%/년</span></div>
        <input type="range" min="0" max="15" step="0.5" value="${S.settings.simReturn}" oninput="onSimReturn(this.value)">
      </div>
    </div>
    <div class="tiny">투자 수익률은 가정치예요. 과거 수익이 미래를 보장하지 않습니다.</div>`;
  drawSim();
}
function drawSim(){
  const svg=$('sim-svg'); if(!svg)return;
  const months=S.settings.simHorizon, extra=S.settings.simExtra;
  const sim=simulate(months,extra), base=simulate(months,0); // 비교선: 추가절약 0
  const W=440,H=180,P=8,BOT=22,L=4;
  const allV=[...sim.pts,...base.pts].map(p=>p.total);
  const minV=Math.min(...allV,0), maxV=Math.max(...allV)*1.08||1;
  const x=i=>L+i*(W-L-10)/months;
  const y=v=>H-BOT-((v-minV)/(maxV-minV||1))*(H-BOT-P);
  const path=pts=>pts.map((p,i)=>`${i?'L':'M'}${x(p.m).toFixed(1)},${y(p.total).toFixed(1)}`).join(' ');
  const area=path(sim.pts)+` L${x(months).toFixed(1)},${H-BOT} L${L},${H-BOT} Z`;
  const zeroY=y(0);
  svg.innerHTML=`
    ${minV<0?`<line x1="${L}" y1="${zeroY.toFixed(1)}" x2="${W-10}" y2="${zeroY.toFixed(1)}" stroke="var(--terra-line)" stroke-width="1" stroke-dasharray="3 3"/>`:''}
    <path d="${area}" fill="rgba(217,119,87,.10)"/>
    ${extra!==0?`<path d="${path(base.pts)}" fill="none" stroke="var(--faint)" stroke-width="1.5" stroke-dasharray="4 4"/>`:''}
    <path d="${path(sim.pts)}" fill="none" stroke="var(--terra)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="${x(months)}" cy="${y(sim.end)}" r="4" fill="var(--terra)" stroke="var(--surface)" stroke-width="1.5"/>
    <text x="${x(0)}" y="${H-6}" font-size="9.5" fill="var(--faint)">지금</text>
    <text x="${x(months)}" y="${H-6}" text-anchor="end" font-size="9.5" fill="var(--faint)">${months>=12?months/12+'년 후':months+'개월 후'}</text>
    ${extra!==0?`<text x="${x(months)-4}" y="${y(base.pts[months].total)-6}" text-anchor="end" font-size="9" fill="var(--faint)">지금 페이스</text>`:''}`;
  const diff=sim.end-netAssets(), vsBase=sim.end-base.end;
  $('sim-out').innerHTML=`
    <div class="cell"><div class="k">현재 순자산</div><div class="v num">${fmtK(netAssets())}원</div></div>

/* ═════════ v3: 큰 지출 What-if ═════════ */
let wiAmt=0, wiMonths=1;
function renderWhatIf(){
  const el=$('whatif-card');
  el.innerHTML=`
    <div style="font-weight:800;font-size:.95rem">🤔 큰 지출 What-if</div>
    <div class="tiny" style="margin-top:4px">지를까 말까 고민되는 지출을 넣어보면 현금흐름 영향을 미리 계산해요</div>
    <div class="wi-preset">
      <button onclick="wiSet(1500000,1)">노트북 150만</button>
      <button onclick="wiSet(500000,1)">여행 50만</button>
      <button onclick="wiSet(1200000,3)">가전 120만·3개월</button>
    </div>
    <div class="grid2" style="margin-top:4px">
      <div class="field" style="margin-bottom:8px"><label>지출 금액 (원)</label><input type="number" inputmode="numeric" id="wi-amt" value="${wiAmt||''}" placeholder="1500000" oninput="wiCalc()"></div>
      <div class="field" style="margin-bottom:8px"><label>할부 개월</label><select id="wi-months" onchange="wiCalc()">${[1,2,3,6,12].map(n=>`<option value="${n}" ${wiMonths===n?'selected':''}>${n===1?'일시불':n+'개월'}</option>`).join('')}</select></div>
    </div>
    <div id="wi-result"></div>`;
  wiCalc();
}
function wiSet(a,m){wiAmt=a;wiMonths=m;renderWhatIf()}
function wiCalc(){
  if($('wi-amt'))wiAmt=Math.round(numVal('wi-amt'));
  if($('wi-months'))wiMonths=numVal('wi-months')||1;
  const box=$('wi-result'); if(!box)return;
  if(!wiAmt){box.innerHTML='';return}
  const perMonth=Math.round(wiAmt/wiMonths);
  const liquid=S.accounts.filter(a=>a.type==='checking'||a.type==='deposit').reduce((s,a)=>s+accKRW(a),0);
  const baseSave=recentMonthlySaving();
  const t=totals(thisYM());
  const thisMonthBal=t.inc-t.exp-perMonth; // 이번 달 첫 회차 반영
  const afterLiquid=liquid-perMonth;
  const monthsToRecover=baseSave>0?Math.ceil(wiAmt/baseSave):null;
  // 판정
  let cls,verdict;
  if(perMonth>liquid){cls='wi-bad';verdict=`⚠️ 첫 회차 ${fmt(perMonth)}이 현재 유동자산(${fmtK(liquid)}원)을 넘어요. 지금은 무리예요.`;}
  else if(baseSave>0 && perMonth>baseSave*1.5){cls='wi-warn';verdict=`🟡 첫 회차가 월 저축액(${fmtK(baseSave)}원)의 ${(perMonth/baseSave).toFixed(1)}배예요. ${wiMonths>1?'할부 개월을 늘리거나 ':''}한 달 미루는 걸 고려해보세요.`;}
  else if(baseSave<=0){cls='wi-warn';verdict=`🟡 최근 저축 페이스가 0 이하라 판단이 어려워요. 유동자산에서 ${fmtK(perMonth)}원이 빠진다는 점만 확인하세요.`;}
  else{cls='wi-ok';verdict=`🟢 감당 가능해요. ${monthsToRecover?`이 지출은 약 ${monthsToRecover}개월치 저축에 해당해요.`:''} ${wiMonths>1?`${wiMonths}개월 할부면 월 ${fmtK(perMonth)}원씩이에요.`:''}`;}
  box.innerHTML=`
    <div class="sim-out">
      <div class="cell"><div class="k">${wiMonths>1?'첫 달 부담':'즉시 부담'}</div><div class="v num">${fmtK(perMonth)}원</div></div>
      <div class="cell"><div class="k">이번 달 수지</div><div class="v num ${thisMonthBal>=0?'pos':'neg'}">${thisMonthBal>=0?'+':'−'}${fmtK(Math.abs(thisMonthBal))}</div></div>
      <div class="cell"><div class="k">지출 후 유동자산</div><div class="v num ${afterLiquid>=0?'':'neg'}">${fmtK(afterLiquid)}원</div></div>
    </div>
    <div class="wi-verdict ${cls}">${verdict}</div>`;
}

function saveDebt(id){
  const person=val('db-person').trim(), amt=Math.round(numVal('db-amt'));
  if(!person||!amt||amt<=0)return toast('상대와 금액을 확인해주세요');
  const data={dir:document.querySelector('#db-seg button.on').dataset.d,person,amount:amt,
    date:val('db-date')||todayStr(),memo:val('db-memo').trim(),due:val('db-due'),accountId:val('db-acc')};

function applyDebt(d,sign){ // 받을돈 정산=계좌 증가 / 갚을돈 정산=계좌 감소
  if(!d.accountId)return;

}
function settleDebt(id){
  const d=S.debts.find(x=>x.id===id); if(!d||d.settled)return;
  d.settled=true; d.settledDate=todayStr(); d.fxAt=d.fxAt||fxRate(); applyDebt(d,1);

function unsettleDebt(id){
  const d=S.debts.find(x=>x.id===id); if(!d||!d.settled)return;

function delDebt(id){

  commit();
}

/* ═════════ v4-2: 월간 예산 + 페이스 분석 ═════════ */
/* 예산 조회 — rollover(이월)가 켜져 있으면 지난달 남은/초과분을 총액에 반영 */
function budgetOf(ym){
  const b=S.budgets[ym]; if(!b)return null;
  if(!b.rollover) return b;
  const carry=budgetCarry(ym);
  return {...b, total:Math.max(0,(b.total||0)+carry), baseTotal:b.total||0, carry};
}
// 지난달 이월액: (지난달 예산 − 지난달 실제 지출). 남으면 +, 초과하면 −
function budgetCarry(ym){
  const pm=prevYM(ym), pb=S.budgets[pm];
  if(!pb||!pb.total)return 0;
  const prevTotal=pb.rollover?Math.max(0,(pb.total||0)+budgetCarryRaw(pm)):(pb.total||0);
  return Math.round(prevTotal-totals(pm).exp);
}
// 이월 계산이 무한 재귀하지 않게 한 단계만 거슬러 올라감
function budgetCarryRaw(ym){
  const pm=prevYM(ym), pb=S.budgets[pm];
  if(!pb||!pb.total)return 0;
  return Math.round((pb.total||0)-totals(pm).exp);
}
function budgetPace(ym){
  const b=budgetOf(ym); if(!b||!b.total)return null;
  const day=(ym===thisYM())?new Date().getDate():daysIn(ym);
  const dim=daysIn(ym), {exp}=totals(ym);
  const f=(ym===thisYM())?forecastMonth().predicted:exp;
  const idealPace=b.total*day/dim; // 오늘까지 이상적 소비
  return{total:b.total,spent:exp,day,dim,predicted:Math.round(f),
    pct:b.total>0?exp/b.total*100:0, pacePct:day/dim*100,
    over:f>b.total, gap:Math.round(f-b.total),
    dailyLeft:Math.max(0,Math.round((b.total-exp)/Math.max(1,dim-day))),
    ahead:exp>idealPace};
}
function renderBudget(){
  const el=$('budget-card'), ym=thisYM(), b=budgetOf(ym);
  if(!b||!b.total){
    el.innerHTML=`<div class="row"><div style="font-weight:800;font-size:.9rem">🎯 이번 달 예산</div>
      <button class="btn soft sm" onclick="openBudgetModal()">설정하기</button></div>
      <div class="tiny" style="margin-top:6px">예산을 정하면 지금 속도로 목표를 지킬 수 있는지 AI가 알려줘요.</div>`;
    return;
  }
  const p=budgetPace(ym);
  const cls=p.pct>=100?'over-fill':(p.over?'warn-fill':'');
  const col=p.pct>=100?'var(--terra-deep)':(p.over?'var(--gold)':'var(--green)');
  const verdict=p.pct>=100?`🔴 예산을 <b>${fmtK(p.spent-p.total)}원</b> 초과했어요.`
    :p.over?`🟡 지금 속도면 월말 <b class="num">${fmtK(p.predicted)}원</b> — 예산을 <b>${fmtK(p.gap)}원</b> 넘겨요.`
    :`🟢 지금 속도면 월말 <b class="num">${fmtK(p.predicted)}원</b> — 예산 안에 들어와요.`;
  el.innerHTML=`
    <div class="row" style="margin-bottom:7px"><div style="font-weight:800;font-size:.9rem">🎯 이번 달 예산 <span class="badge gold">AI 페이스</span></div>
      <button class="btn ghost sm" onclick="openBudgetModal()">수정</button></div>
    <div class="row" style="margin-bottom:6px"><span class="num" style="font-weight:800;color:${col}">${fmt(p.spent)}</span>
      <span class="tiny num">/ ${fmt(p.total)} (${p.pct.toFixed(0)}%)</span></div>
    ${(b.rollover&&b.carry)?`<div class="tiny" style="margin:-2px 0 6px">↩︎ 이월 ${b.carry>=0?'+':'−'}${fmtK(Math.abs(b.carry))}원 포함 (기본 ${fmtK(b.baseTotal)}원)</div>`:''}
    <div class="bd-track"><div class="bd-fill" style="width:${Math.min(100,p.pct)}%;background:${col}"></div><div class="bd-pace" style="left:${Math.min(100,p.pacePct)}%"></div></div>
    <div class="tiny" style="margin-top:7px">${verdict}</div>
    <div class="tiny" style="margin-top:3px">▍표시선은 오늘까지의 정상 페이스 · 남은 ${Math.max(0,p.dim-p.day)}일 동안 하루 <b class="num">${fmt(p.dailyLeft)}</b>까지 쓸 수 있어요</div>
    ${(b.cats&&Object.keys(b.cats).length)?`<div class="divider"></div>${Object.entries(b.cats).map(([c,v])=>{
      const s=catSums(ym).find(x=>x[0]===c);const used=s?s[1]:0;const pc=v>0?used/v*100:0;
      return`<div class="bd-row"><div class="bd-top"><span class="bd-name">${CAT_EMO[c]||''} ${c}</span><span class="bd-nums num">${fmtK(used)} / ${fmtK(v)}</span></div>
      <div class="bd-track"><div class="bd-fill" style="width:${Math.min(100,pc)}%;background:${pc>=100?'var(--terra)':pc>=80?'var(--gold)':'var(--green)'}"></div></div></div>`}).join('')}`:''}`;
}

      <div class="grid2">

      <div class="tiny" style="margin-top:4px">${(()=>{const c=budgetCarry(ym);

        return c>=0?`지난달 예산이 <b class="pos">${fmt(c)}</b> 남았어요 → 켜면 이번 달 예산에 더해져요.`
                   :`지난달 예산을 <b class="neg">${fmt(Math.abs(c))}</b> 초과했어요 → 켜면 이번 달 예산에서 차감돼요.`;})()}</div></div>
    <div style="display:flex;gap:8px;margin-top:6px">

function syncBd(){const t=$('bd-total');if(t)bdDraft.total=Math.round(+t.value||0);const r=$('bd-roll');if(r)bdDraft.rollover=r.checked}

function rmBdCat(c){syncBd();delete bdDraft.cats[c];renderBudgetModal()}
function saveBudget(){
  syncBd();
  if(!bdDraft.total||bdDraft.total<=0)return toast('총 예산을 입력해주세요');

  commit('예산을 저장했어요');

function delBudget(){
  if(!confirm('이번 달 예산을 삭제할까요?'))return;

/* ═════════ v4-3: 이상 거래 감지 ═════════ */
function detectAnomalies(){
  const ym=thisYM(), out=[];
  const m=monthTx(ym).filter(t=>t.type==='expense'&&!t.fixedId);
  // 카테고리별 과거 3개월 평균 건당 금액
  const hist={};
  for(let i=1;i<=3;i++){
    const d=new Date();d.setMonth(d.getMonth()-i);
    monthTx(`${d.getFullYear()}-${pad(d.getMonth()+1)}`).filter(t=>t.type==='expense'&&!t.fixedId)
      .forEach(t=>{(hist[t.cat]=hist[t.cat]||[]).push(t.amount)});
  }
  const recent=m.filter(t=>{const dd=(new Date(todayStr())-new Date(t.date))/86400000;return dd>=0&&dd<=14});
  // ① 평소보다 큰 단일 지출
  recent.forEach(t=>{
    const hs=hist[t.cat];
    if(hs&&hs.length>=3){
      const avg=hs.reduce((a,b)=>a+b,0)/hs.length;
      if(t.amount>=avg*2.5&&t.amount>=30000)
        out.push({id:'big-'+t.id,emo:'📈',txt:`<b>${esc(t.memo||t.cat)}</b> ${fmt(t.amount)} — 평소 ${t.cat} 평균(${fmtK(avg)}원)의 <b>${(t.amount/avg).toFixed(1)}배</b>예요.`});
    }
  });
  // ② 중복 결제 의심 (같은 금액·같은 카테고리가 3일 내 2건 이상)
  const seen={};
  recent.forEach(t=>{const k=t.cat+'|'+t.amount;(seen[k]=seen[k]||[]).push(t)});
  Object.values(seen).forEach(g=>{
    if(g.length>=2){
      g.sort((a,b)=>a.date.localeCompare(b.date));
      for(let i=1;i<g.length;i++){
        const gap=(new Date(g[i].date)-new Date(g[i-1].date))/86400000;
        if(gap<=3){out.push({id:'dup-'+g[i].id,emo:'👯',txt:`<b>${esc(g[i].memo||g[i].cat)}</b> ${fmt(g[i].amount)}이 ${gap===0?'같은 날':gap+'일 간격으로'} 2번 기록됐어요. 중복 입력이 아닌지 확인해보세요.`});break}
      }
    }
  });
  // ③ 안 쓰던 카테고리 등장
  const usedBefore=new Set(Object.keys(hist));
  const newCats=[...new Set(recent.map(t=>t.cat))].filter(c=>!usedBefore.has(c));
  newCats.forEach(c=>{
    const sum=recent.filter(t=>t.cat===c).reduce((s,t)=>s+t.amount,0);
    if(sum>=50000)out.push({id:'new-'+ym+'-'+c,emo:'🆕',txt:`최근 <b>${c}</b>에 ${fmt(sum)}을 썼어요. 이전 3개월엔 없던 항목이에요.`});
  });
  return out.filter(a=>!S.anomAck.includes(a.id)).slice(0,4);
}
function renderAnomaly(){
  const el=$('anomaly-card');
  const list=detectAnomalies();
  if(!list.length){el.innerHTML='';el.style.display='none';return}
  el.style.display='';
  el.innerHTML=`<div class="row" style="margin-bottom:4px"><div style="font-weight:800;font-size:.9rem">🔍 이런 점이 눈에 띄어요</div>
    <button class="btn ghost sm" onclick="ackAllAnom()">모두 확인</button></div>
    ${list.map(a=>`<div class="anom"><span class="a-emo">${a.emo}</span><span class="a-txt">${a.txt}</span></div>`).join('')}
    <div class="tiny" style="margin-top:6px">잘못 입력한 게 없다면 [모두 확인]을 눌러 정리하세요.</div>`;
}

}

function fillFilterOpts(){

      [...EXP_CATS,...INC_CATS].map(([e,n])=>`<option value="${n}">${e} ${n}</option>`).join('');
  }

      '<option value="cash|">현금</option>';

}
function searchCriteria(){
  return{q:val('sq').trim().toLowerCase(),type:val('sf-type'),cat:val('sf-cat'),
    pay:val('sf-pay'),amt:val('sf-amt'),from:val('sf-from'),to:val('sf-to')};
}
function hasSearch(){
  const c=searchCriteria();
  return !!(c.q||c.type||c.cat||c.pay||c.amt||c.from||c.to);
}
function runSearch(){
  const c=searchCriteria();
  let list=[...S.tx];
  if(c.q)list=list.filter(t=>((t.memo||'')+' '+(t.cat||'')).toLowerCase().includes(c.q));
  if(c.type)list=list.filter(t=>t.type===c.type);
  if(c.cat)list=list.filter(t=>t.cat===c.cat);
  if(c.pay){const[k,i]=c.pay.split('|');list=list.filter(t=>t.payKind===k&&(i?t.payId===i:true))}
  if(c.amt){const[lo,hi]=c.amt.split('-');
    list=list.filter(t=>t.amount>=(+lo||0)&&(hi?t.amount<+hi:true))}
  if(c.from)list=list.filter(t=>t.date>=c.from);
  if(c.to)list=list.filter(t=>t.date<=c.to);
  return list.sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
}
function onSearch(){
  const box=$('sf-result'), wrap=$('cal-wrap');
  if(!hasSearch()){box.innerHTML='';wrap.style.display='';return}
  wrap.style.display='none';
  const r=runSearch();
  const exp=r.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const inc=r.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  box.innerHTML=`<div class="divider"></div>
    <div class="row" style="margin-bottom:8px"><b style="font-size:.88rem">검색 결과 ${r.length}건</b>
      <span class="tiny num">지출 ${fmtK(exp)}원 · 수입 ${fmtK(inc)}원</span></div>

}
function clearSearch(){
  ['sq','sf-type','sf-cat','sf-pay','sf-amt','sf-from','sf-to'].forEach(id=>{const e=$(id);if(e)e.value=''});

}

/* ═════════ v6-2: 수입원 분석 ═════════ */
function incomeBreakdown(months=6){
  const now=new Date(), byCat={}, byMonth={};
  for(let i=0;i<months;i++){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const ym=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
    let mSum=0;
    monthTx(ym).filter(t=>t.type==='income').forEach(t=>{
      byCat[t.cat]=(byCat[t.cat]||0)+t.amount; mSum+=t.amount;
    });
    byMonth[ym]=mSum;
  }
  const total=Object.values(byCat).reduce((a,b)=>a+b,0);
  const sorted=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const vals=Object.values(byMonth).filter(v=>v>0);
  const avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
  // 변동성: 표준편차/평균 (낮을수록 안정적)
  const sd=vals.length>1?Math.sqrt(vals.reduce((s,v)=>s+Math.pow(v-avg,2),0)/vals.length):0;
  const cv=avg>0?sd/avg:0;
  // 의존도: 최대 수입원 비중
  const dep=total>0&&sorted.length?sorted[0][1]/total:0;
  return{byCat:sorted,byMonth,total,avg,cv,dep,months};
}
function renderIncome(){
  const el=$('income-card'); if(!el)return;
  const b=incomeBreakdown(6);
  if(!b.total){el.innerHTML=`<div style="font-weight:800;font-size:.92rem">💰 수입원 분석</div><div class="empty">수입을 기록하면 수입원 구성과<br>안정성을 분석해드려요</div>`;return}

  // 도넛
  const R=52,C=2*Math.PI*R; let off=0;
