function scoreHistory(n=6){
  S.scores=S.scores||{};
  const out=[], now=new Date();
  for(let i=n-1;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const ym=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
    const saved=S.scores[ym];
    const live=(ym===thisYM())?healthScore(ym):null;
    const has=monthTx(ym).length>0;
    out.push({ym,score:saved?saved.total:(live?live.total:null),has});
  }
  return out;
}

/* ═════════ v6-4: 소비 성향 프로파일 ═════════ */
function spendProfile(months){
  const M=months||S.settings.profM||3;
  const now=new Date(); let exp=[], fixedSum=0, varSum=0, weekend=0, weekday=0, late=0;
  for(let i=0;i<M;i++){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const ym=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
    monthTx(ym).filter(t=>t.type==='expense').forEach(t=>{
      exp.push(t);
      if(t.fixedId)fixedSum+=t.amount; else varSum+=t.amount;
      const dow=new Date(t.date).getDay();
      if(dow===0||dow===5||dow===6)weekend+=t.amount; else weekday+=t.amount;
    });
  }
  if(exp.length<3)return null;
  const total=fixedSum+varSum;
  // 위시리스트 자제율
  const decided=S.wish.filter(w=>w.status!=='open');
  const skipRate=decided.length?decided.filter(w=>w.status==='skipped').length/decided.length:null;
  // 소액 다건 vs 고액 소수
  const avg=total/exp.length;
  const bigCount=exp.filter(t=>t.amount>=avg*3).length;
  const bigShare=exp.filter(t=>t.amount>=avg*3).reduce((s,t)=>s+t.amount,0)/total;
  // 예산 준수율
  const budKeys=Object.keys(S.budgets||{}).filter(k=>k<thisYM());
  const kept=budKeys.filter(k=>totals(k).exp<=S.budgets[k].total).length;
  const budRate=budKeys.length?kept/budKeys.length:null;
  const traits=[];
  traits.push(fixedSum/total>=0.4
    ?{emo:'🔁',t:'고정비 중심형',d:`지출의 ${Math.round(fixedSum/total*100)}%가 고정비예요. 구독·통신비를 한 번 정리하면 효과가 커요.`}
    :{emo:'🎚️',t:'변동비 중심형',d:`지출의 ${Math.round(varSum/total*100)}%가 변동비라 마음먹으면 조절 여지가 커요.`});
  traits.push(weekend/(weekend+weekday)>=0.5
    ?{emo:'🌆',t:'주말 집중형',d:`지출의 ${Math.round(weekend/(weekend+weekday)*100)}%가 금~일에 몰려요. 주말 예산을 따로 잡아보세요.`}
    :{emo:'📅',t:'평일 분산형',d:'지출이 요일에 고르게 퍼져 있어요. 일상 소비가 주를 이뤄요.'});
  traits.push(bigShare>=0.5
    ?{emo:'💎',t:'큰 지출형',d:`상위 ${bigCount}건이 전체의 ${Math.round(bigShare*100)}%예요. What-if로 큰 결제를 미리 점검하면 좋아요.`}
    :{emo:'🐜',t:'소액 다건형',d:'작은 지출이 쌓이는 유형이에요. 카페·편의점 같은 반복 지출을 줄이면 체감이 커요.'});
  if(skipRate!==null)traits.push(skipRate>=0.5
    ?{emo:'🧘',t:'자제력 좋음',d:`위시리스트에 담은 것 중 ${Math.round(skipRate*100)}%를 참았어요. 쿨다운이 잘 통하고 있어요.`}
    :{emo:'🛍️',t:'구매 결심형',d:`담은 것 중 ${Math.round((1-skipRate)*100)}%를 실제로 샀어요. 쿨다운을 더 길게 잡아보는 것도 방법이에요.`});
  if(budRate!==null)traits.push(budRate>=0.6
    ?{emo:'🎯',t:'계획 준수형',d:`예산을 세운 달 중 ${Math.round(budRate*100)}%를 지켰어요.`}
    :{emo:'🌀',t:'계획 이탈형',d:'예산을 자주 넘겨요. 목표를 조금 낮춰 잡으면 성공 경험이 쌓여요.'});
  return{traits,total,count:exp.length,months:M};
}

/* ═════════ v7: 카드 피킹률 + 개선 코칭 ═════════ */
// 국내 카드 실질 혜택률 벤치마크 (일반적 수준)
const PICK_TIERS=[
  {min:2.0,label:'최상위',color:'var(--green)',desc:'상위권 카드에서도 보기 드문 수준이에요'},
  {min:1.2,label:'우수',color:'var(--green)',desc:'잘 쓰고 있어요. 일반적으로 1~2%면 좋은 편이에요'},
  {min:0.7,label:'양호',color:'var(--gold)',desc:'평균 수준이에요. 조금만 조정하면 더 올릴 수 있어요'},
  {min:0.3,label:'낮음',color:'var(--terra)',desc:'혜택을 거의 못 받고 있어요. 아래 제안을 확인해보세요'},
  {min:-99,label:'거의 없음',color:'var(--terra-deep)',desc:'이 카드로는 혜택이 나오지 않고 있어요'}
];
const pickTier=r=>PICK_TIERS.find(t=>r>=t.min);
function pickRate(card,ym){
  const spend=cardMonthSpend(card.id,ym);
  const ests=perkEstimates(card,ym);
  const got=ests.filter(e=>e.active).reduce((s,e)=>s+e.est,0);
  const rate=spend>0?got/spend*100:0;
  const fee=card.annualFee||0;
  // 연회비 반영 실질: (연간혜택 − 연회비) / 연간사용액
  const netRate=spend>0?((got*12-fee)/(spend*12))*100:0;
  return{spend,got,rate,fee,netRate,ests};
}
/* 개선 제안 생성 — 실제 데이터 기반 */
function pickAdvice(card,ym){
  const p=pickRate(card,ym), out=[];
  const tiers=card.tiers||[], prev=prevYM(ym);
  const perfPrev=perfSpend(card,prev), perfNow=perfSpend(card,ym);
  // ① 실적 미달로 혜택 잠김
  if(tiers.length){
    const t=achievedTierBy(perfPrev,tiers);
    if(t===0){
      const need=tiers[0]-perfPrev;
      out.push({icon:'🔒',t:'전월 실적 미달로 혜택이 잠겼어요',
        d:`지난달 ${fmtK(perfPrev)}원 사용 · ${fmtK(tiers[0])}원 필요. 이번 달은 <b>${fmtK(Math.max(0,tiers[0]-perfNow))}원</b> 더 쓰면 다음 달 혜택이 열려요.`});
    }else if(t<tiers.length){
      const need=tiers[t]-perfNow;
      if(need>0)out.push({icon:'⬆️',t:`${t+1}구간까지 ${fmtK(need)}원 남았어요`,
        d:`이번 달 인정 실적 ${fmtK(perfNow)}원. 여기까지 채우면 다음 달 혜택이 한 단계 올라가요.`});
    }
  }
  // ② 한도를 다 못 쓴 혜택 → 그 카테고리 지출을 이 카드로
  p.ests.filter(e=>e.active&&e.p.capM>0&&e.est<e.p.capM).forEach(e=>{
    const room=e.p.capM-e.est;
    if(room<300)return;
    const cat=e.p.cat;
    // 다른 결제수단으로 나간 같은 카테고리 지출 찾기
    const elsewhere=monthTx(ym).filter(t=>t.type==='expense'&&t.cat===cat&&!(t.payKind==='card'&&t.payId===card.id))
      .reduce((s,t)=>s+t.amount,0);
    const gain=e.p.kind==='percent'?Math.min(room,Math.round(elsewhere*e.p.value/100)):0;
    out.push({icon:'🎯',t:`${cat} 혜택 한도가 ${fmtK(room)}원 남았어요`,
      d:elsewhere>0
        ? `이번 달 ${cat}에 다른 수단으로 <b>${fmtK(elsewhere)}원</b>을 썼어요. 이걸 이 카드로 돌렸다면 약 <b class="pos">+${fmtK(gain)}원</b>을 더 받았을 거예요.`
        : `${cat} 지출을 이 카드로 몰면 월 최대 ${fmtK(e.p.capM)}원까지 받을 수 있어요.`});
  });
  // ③ 한도 소진 → 초과분은 다른 카드로
  p.ests.filter(e=>e.active&&e.p.capM>0&&e.est>=e.p.capM).forEach(e=>{
    out.push({icon:'🈵',t:`${e.p.cat} 혜택 한도(${fmtK(e.p.capM)}원)를 다 채웠어요`,
      d:`이 카테고리는 이제 더 써도 혜택이 안 늘어요. 남은 ${e.p.cat} 지출은 다른 카드로 분산하는 게 이득이에요.`});
  });
  // ④ 혜택이 없는 카테고리에 큰 지출
  const covered=new Set(p.ests.filter(e=>e.active).map(e=>e.p.cat));
  if(!covered.has('전체')){
    const byCat={};
    monthTx(ym).filter(t=>t.type==='expense'&&t.payKind==='card'&&t.payId===card.id)
      .forEach(t=>byCat[t.cat]=(byCat[t.cat]||0)+t.amount);
    const top=Object.entries(byCat).filter(([c])=>!covered.has(c)).sort((a,b)=>b[1]-a[1])[0];
    if(top&&top[1]>=50000)out.push({icon:'💤',t:`${top[0]}에 ${fmtK(top[1])}원을 썼지만 혜택이 없어요`,
      d:`이 카드는 ${top[0]}에 혜택이 없어요. ${top[0]} 혜택이 있는 다른 카드가 있다면 그쪽으로 옮겨보세요.`});
  }
  // ⑤ 연회비 손익
  if(p.fee>0){
    const yearGot=p.got*12, be=Math.round(p.fee/12);
    out.push({icon:p.got*12>=p.fee?'✅':'⚠️',
      t:p.got*12>=p.fee?`연회비 ${fmtK(p.fee)}원 대비 이득이에요`:`연회비를 못 뽑고 있어요`,
      d:`현재 페이스로 연 <b>${fmtK(yearGot)}원</b> 혜택 · 연회비 ${fmtK(p.fee)}원. 본전을 넘으려면 월 <b>${fmtK(be)}원</b> 이상 받아야 해요.`});
  }
  // ⑥ 사용액이 거의 없음
  if(p.spend<30000)out.push({icon:'💤',t:'이번 달 사용액이 적어요',
    d:`${fmtK(p.spend)}원만 사용했어요. 피킹률은 사용액이 쌓여야 의미 있는 수치가 돼요.`});
  return out;
}

function setLstFilter(f){lstFilter=f;renderList()}
function renderList(){

function renderByDate(list){
  const byDay={};

/* 청구 사이클: 이번 달 사용분 → 다음 달 결제일에 출금 */
function billOfMonth(card,ym){
  // ym월에 발생한 이 카드 지출의 해당 회차 금액 (정산 완료분 제외)
  let gross=0, items=[];
  S.tx.filter(t=>t.type==='expense'&&t.payKind==='card'&&t.payId===card.id).forEach(t=>{
    const n=t.months||1, start=ymOf(t.date);
    const k=monthDiff(start,ym);                 // 이 달이 몇 번째 회차인지
    if(k<0||k>=n)return;
    if((t.paidPortions||0)>k)return;             // 이미 정산된 회차
    const amt=portionAmt(t,k);
    gross+=amt; items.push({t,amt,k,n});
  });
  const disc=Math.min(gross,discOfAmount(card,ym,gross));
  return{gross,disc,net:gross-disc,items};
}
function nextYM(ym){const[y,m]=ym.split('-').map(Number);const d=new Date(y,m,1);return`${d.getFullYear()}-${pad(d.getMonth()+1)}`}

function importData(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    const backup=JSON.parse(JSON.stringify(S)); // 현재 상태 스냅샷
    try{
      const d=JSON.parse(r.result);
      if(!d||typeof d!=='object'||Array.isArray(d))throw new Error('형식 오류');
      if(!Array.isArray(d.tx)||!Array.isArray(d.accounts))throw new Error('내역/계좌 데이터가 없어요');
      ['cards','fixed','invLogs','debts','wish','recon','goals'].forEach(k=>{
        if(d[k]!==undefined&&!Array.isArray(d[k]))throw new Error(k+' 형식 오류');
      });
      ['reports','budgets','briefs','scores','settings'].forEach(k=>{
        if(d[k]!==undefined&&(typeof d[k]!=='object'||Array.isArray(d[k])))throw new Error(k+' 형식 오류');
      });
      const staged=JSON.parse(JSON.stringify(d)); // 원본 분리
      const prev=S; S=staged;
      try{ migrate(); totalAssets(); }        // 마이그레이션·집계 시험 실행
      catch(err){ S=prev; throw new Error('데이터 구조가 손상됐어요') }
      const n=S.tx.length, a=S.accounts.length;
      save(); closeModal(); renderAll();
      toast(`가져왔어요 · 내역 ${n}건 · 계좌 ${a}개`);
    }catch(e){
      S=backup; migrate();                     // 원상 복구 보장
      toast('가져오지 못했어요 — '+(e.message||'올바른 백업 파일이 아니에요'));
    }
  };
  r.readAsText(f);
}

function readCatInputs(){
  const list=catList(catKind).slice();
  list.forEach((c,i)=>{ const e=$('ct-e-'+i), n=$('ct-n-'+i);
    if(e&&n) list[i]=[ (e.value.trim()||'💸'), n.value.trim() ]; });
  return list.filter(c=>c[1]);
}
function writeCats(list){
  S.cats=S.cats||{}; S.cats[catKind]=list;
  if(!S.cats.exp)S.cats.exp=catList('exp'); if(!S.cats.inc)S.cats.inc=catList('inc');
}
function addCat(){
  const e=val('ct-new-e').trim()||'💸', n=val('ct-new-n').trim();
  if(!n)return toast('카테고리 이름을 입력해주세요');
  const list=readCatInputs();
  if(list.some(c=>c[1]===n))return toast('같은 이름이 이미 있어요');
  list.push([e,n]); writeCats(list); save(); renderCatModal(); toast('추가했어요');
}
function moveCat(i,d){
  const list=readCatInputs(), j=i+d;
  if(j<0||j>=list.length)return;
  [list[i],list[j]]=[list[j],list[i]]; writeCats(list); save(); renderCatModal();
}
function rmCat(i){
  const list=readCatInputs(), c=list[i]; if(!c)return;
  const n=S.tx.filter(t=>t.cat===c[1]).length;
  if(n)return toast(`'${c[1]}'는 내역 ${n}건에서 쓰이고 있어 삭제할 수 없어요`);
  list.splice(i,1); writeCats(list); save(); renderCatModal(); toast('삭제했어요');
}
function saveCats(){
  const before=catList(catKind).map(c=>c[1]);
  const list=readCatInputs();
  if(!list.length)return toast('카테고리가 최소 1개는 있어야 해요');
  const names=list.map(c=>c[1]);
  if(new Set(names).size!==names.length)return toast('중복된 이름이 있어요');
  // 이름이 바뀐 카테고리는 기존 내역/예산/고정에도 반영
  let renamed=0;
  before.forEach((old,i)=>{ const now=names[i];
    if(now&&old!==now){
      S.tx.forEach(t=>{ if(t.cat===old)t.cat=now; });
      S.fixed.forEach(f=>{ if(f.cat===old)f.cat=now; });
      Object.values(S.budgets).forEach(b=>{ if(b.cats&&b.cats[old]!==undefined){ b.cats[now]=b.cats[old]; delete b.cats[old]; } });
      S.cards.forEach(c=>{ if(Array.isArray(c.exclCats))c.exclCats=c.exclCats.map(x=>x===old?now:x); });
      renamed++;
    }});
  writeCats(list); commit(renamed?`저장했어요 · 이름 변경 ${renamed}건 반영`:'저장했어요');
}
function resetCats(){

/* ═════════ 고정수입 데이터 정합성 점검 ═════════ */
// 옛 버전은 고정수입도 '지출'로 자동기록했을 수 있음 → 찾아서 바로잡기
function findFixedMismatch(){
  const incFixed=S.fixed.filter(f=>(f.kind||'expense')==='income');
  const bad=[];
  incFixed.forEach(f=>{
    S.tx.forEach(t=>{ if(t.fixedId===f.id && t.type==='expense') bad.push({t,f}); });
  });
  return bad;
}
function openFixCheckModal(){
  const bad=findFixedMismatch();
  openModal(`${sheetHead('데이터 점검')}
    ${bad.length?`<div class="card tight warn" style="margin-bottom:12px">
      <div class="w-title">⚠️ 잘못 기록된 고정수입 ${bad.length}건</div>
      <div class="w-body">고정 <b>수입</b>으로 등록했는데 <b>지출</b>로 기록된 내역이에요. 예전 버전에서 생긴 문제로, 아래 버튼으로 한 번에 고칠 수 있어요.</div></div>
      ${bad.slice(0,20).map(({t,f})=>`<div class="tx"><div class="t-main"><div class="t-name">${esc(f.name)}</div>
        <div class="t-sub">${t.date} · 지출로 기록 ${fmt(t.amount)}</div></div>
        <span class="badge terra">수입이어야 함</span></div>`).join('')}
      <button class="btn primary block" style="margin-top:12px" onclick="repairFixedMismatch()">🔧 ${bad.length}건 모두 수입으로 바로잡기</button>
      <div class="tiny" style="margin-top:8px">계좌 잔액도 함께 다시 계산돼요 (지출 취소 + 수입 반영).</div>`
    :`<div class="card tight" style="background:var(--green-soft);border-color:var(--green)">
      <div style="font-weight:800;color:var(--green)">✅ 문제 없어요</div>
      <div class="tiny" style="margin-top:4px">고정수입이 지출로 잘못 기록된 내역이 없습니다.</div></div>`}`);
}
function repairFixedMismatch(){
  const bad=findFixedMismatch();
  if(!bad.length)return toast('고칠 내역이 없어요');
  if(!confirm(`${bad.length}건을 수입으로 바로잡을까요? 계좌 잔액도 함께 정정돼요.`))return;
  let n=0;
  bad.forEach(({t,f})=>{
    applyBalance(t,-1);        // 기존 지출 반영 취소
    t.type='income';
    if(f.cat)t.cat=f.cat;
    t.payKind='account'; if(f.payId)t.payId=f.payId;
    applyBalance(t,1);         // 수입으로 다시 반영
    n++;
  });
  commit(`${n}건을 수입으로 바로잡았어요`);
}

/* ═════════ 빠른 입력 (자주 쓰는 내역) ═════════ */
const quickKey=q=>`${q.cat}|${q.amount}|${q.memo||''}`;
let quickEdit=false;
function quickList(){
  const hide=S.quickHide||[];
  const q=(S.quick||[]).filter(x=>!hide.includes(quickKey(x)));
  if(q.length) return q.slice(0,6);
  // 즐겨찾기가 없으면 최근 지출에서 자동 추천(같은 카테고리+금액 조합 빈도순)
  const m={};
  S.tx.filter(t=>t.type==='expense').slice(-60).forEach(t=>{
    const k=`${t.cat}|${t.amount}|${t.memo||''}`;
    m[k]=m[k]||{cat:t.cat,amount:t.amount,memo:t.memo||'',payKind:t.payKind,payId:t.payId,n:0};
    m[k].n++;
  });
  return Object.values(m).filter(x=>x.n>=2&&!hide.includes(quickKey(x)))
    .sort((a,b)=>b.n-a.n).slice(0,6);
}
function renderQuick(){
  const el=$('quick-card'); if(!el) return;
  const list=quickList();
  const hidden=(S.quickHide||[]).length;
  if(!list.length){
    el.innerHTML=`<div class="row"><div style="font-weight:800;font-size:.9rem">⚡ 빠른 입력</div>
      ${hidden?`<button class="btn ghost sm" onclick="resetQuickHidden()">숨김 ${hidden}개 복원</button>`:''}</div>
      <div class="empty">같은 지출을 2번 이상 기록하면<br>여기서 한 번에 다시 넣을 수 있어요</div>`;
    quickEdit=false; return;
  }
  el.innerHTML=`<div class="row" style="margin-bottom:8px"><div style="font-weight:800;font-size:.9rem">⚡ 빠른 입력</div>
      <span style="display:flex;gap:6px;align-items:center">
        ${(!quickEdit&&hidden)?`<button class="btn ghost sm" onclick="resetQuickHidden()">숨김 ${hidden}개 복원</button>`:''}
        <button class="btn ${quickEdit?'primary':'ghost'} sm" onclick="toggleQuickEdit()">${quickEdit?'완료':'편집'}</button></span></div>
    <div style="display:flex;flex-wrap:wrap;gap:7px">
      ${list.map((q,i)=>quickEdit
        ? `<span class="btn ghost sm" style="text-align:left;display:inline-flex;align-items:center;gap:7px">
             ${CAT_EMO[q.cat]||'💸'} ${esc(q.memo||q.cat)} <b class="num">${fmtK(q.amount)}</b>
             <span style="color:var(--danger);font-weight:800;cursor:pointer;padding:0 2px" onclick="delQuick(${i})">✕</span></span>`
        : `<button class="btn ghost sm" style="text-align:left" onclick="runQuick(${i})">
             ${CAT_EMO[q.cat]||'💸'} ${esc(q.memo||q.cat)} <b class="num">${fmtK(q.amount)}</b></button>`).join('')}
    </div>
    <div class="tiny" style="margin-top:7px">${quickEdit?'✕ 를 눌러 지우세요. 자동 추천 항목은 숨김 처리돼요.':'탭하면 오늘 날짜로 기록돼요'}</div>`;
}
function toggleQuickEdit(){ quickEdit=!quickEdit; renderQuick(); }
function delQuick(i){
  const q=quickList()[i]; if(!q)return;
  const k=quickKey(q);
  const before=(S.quick||[]).length;
  S.quick=(S.quick||[]).filter(x=>quickKey(x)!==k);
  // 즐겨찾기에 없던 자동 추천 항목이면 숨김 목록에 넣어 다시 안 뜨게
  if(S.quick.length===before){ S.quickHide=S.quickHide||[]; if(!S.quickHide.includes(k))S.quickHide.push(k); }
  save(); renderQuick(); toast('빠른 입력에서 지웠어요');
}
function resetQuickHidden(){
  S.quickHide=[]; save(); renderQuick(); toast('숨긴 항목을 복원했어요');
}
function runQuick(i){
  const q=quickList()[i]; if(!q)return;
  const t={id:uid(),type:'expense',date:todayStr(),amount:q.amount,cat:q.cat,memo:q.memo||'',
    payKind:q.payKind||'cash',payId:q.payId||'',defended:false};
  if(t.payKind==='card'&&!cardById(t.payId)){t.payKind='cash';t.payId=''}
  if(t.payKind==='account'&&!accById(t.payId)){t.payKind='cash';t.payId=''}
  if(t.payKind==='card'){ const c=cardById(t.payId); if(c&&c.type==='credit'){t.months=1;t.paidPortions=0} }
  S.tx.push(t); applyBalance(t,1);
  save(); renderAll(); toast(`${q.memo||q.cat} ${fmt(q.amount)} 기록했어요`);
}
function addQuickFromTx(id){
  const t=S.tx.find(x=>x.id===id); if(!t||t.type!=='expense')return toast('지출 내역만 추가할 수 있어요');
  S.quick=S.quick||[];
  if(S.quick.some(q=>q.cat===t.cat&&q.amount===t.amount&&(q.memo||'')===(t.memo||'')))return toast('이미 빠른 입력에 있어요');
  const item={cat:t.cat,amount:t.amount,memo:t.memo||'',payKind:t.payKind,payId:t.payId};
  S.quickHide=(S.quickHide||[]).filter(k=>k!==quickKey(item));   // 지웠던 항목이면 숨김 해제
  S.quick.unshift(item);
  S.quick=S.quick.slice(0,6);
  commit('빠른 입력에 추가했어요');
}

  openModal(`${sheetHead('타임머신 · 버전 복원')}
    <div id="ver-list" class="muted" style="text-align:center;padding:20px 0">불러오는 중…</div>
    <div class="tiny" style="margin-top:8px;text-align:center">저장할 때마다 자동으로 남는 최근 백업이에요. 복원해도 현재 상태는 먼저 백업됩니다.</div>`);
  Sync.listVersions().then(res=>{
    const el=$('ver-list'); if(!el) return;
    if(!res || res.error){ el.innerHTML=`<div class="tiny">아직 버전 기록을 켜지 않았어요.<br>Supabase에서 백업 테이블 SQL(README의 schema.sql)을 실행하면 여기에 쌓여요.</div>`; return; }
    const rows=res.data||[];
    if(!rows.length){ el.innerHTML=`<div class="tiny">아직 저장된 버전이 없어요. 몇 번 기록하면 여기 쌓여요.</div>`; return; }
    el.classList.remove('muted'); el.style.padding='0'; el.style.textAlign='left';
    el.innerHTML=rows.map(r=>{
      const d=new Date(r.saved_at);
      const label=`${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      return `<div class="tx"><div class="t-main"><div class="t-name num">${label}</div><div class="t-sub">버전 ${r.rev}</div></div><button class="btn ghost sm" onclick="restoreVersion(${r.id})">복원</button></div>`;
    }).join('');
  }).catch(()=>{ const el=$('ver-list'); if(el)el.innerHTML=`<div class="tiny">목록을 불러오지 못했어요.</div>`; });
}
function restoreVersion(id){
  if(!confirm('이 시점으로 되돌릴까요? 지금 상태는 자동으로 백업돼요.'))return;
  toast('복원 중…');
  Sync.restoreVersion(id).then(()=>{ toast('복원했어요'); closeModal(); }).catch(e=>toast('복원 실패 — '+(e.message||'')));
}

/* ═════════ 시작 ═════════ */
autoApplyFixed();
autoApplySaving();
recordScore();
txView=S.settings.txView||'cal'; cardView=S.settings.cardView||'manage';
setTimeout(()=>{
  document.querySelectorAll('#tx-viewseg button').forEach(b=>b.classList.toggle('on',b.dataset.m===txView));
  document.querySelectorAll('#card-viewseg button').forEach(b=>b.classList.toggle('on',b.dataset.m===cardView));
  $('cal-wrap').style.display=(txView==='cal')?'':'none';
  $('list-wrap').style.display=(txView==='cal')?'none':'';
  $('cardview-manage').style.display=(cardView==='manage')?'':'none';
  $('cardview-bill').style.display=(cardView==='bill')?'':'none';
  $('cardview-detail').style.display=(cardView==='detail')?'':'none';
},0);
renderHome();
autoFx();

/* PWA: 서비스워커 등록 + 클라우드 동기화 부트스트랩 */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
window.addEventListener('load',()=>{ if(window.Sync){ Sync.on((s)=>{ renderSyncBanner(); if(s&&s.status==='synced') refreshDigest(); }); Sync.init(); renderSyncBanner(); } });
</script>
